<style>
:root{
  --navy:#28394b;
  --navy-dark:#1f2c3b;
  --ocean:#1e6fa8;
  --ocean-light:#3b9dd4;
  --foam:#edf5fb;
  --ink:#0d1b2a;
  --muted:#6b8099;
  --border:#d4e3f0;
  --bg:#f0f5fa;
  --green:#118a5b;
  --green-bg:#e6f5ec;
  --red:#c94e42;
  --red-bg:#fdf1ef;
  --amber:#b57508;
  --amber-bg:#fef4dc;
  --sh-soft:0 1px 3px rgba(0,0,0,.05),0 4px 12px rgba(31,44,59,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
input,select,textarea,button{font-family:inherit;font-size:inherit}

/* ── Header (dark navy) ─────────────────────────────────────────── */
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;flex:1;min-width:0}
.brand svg{height:26px;width:auto;flex-shrink:0}
.brand-sub{font-size:10px;color:#7aabcc;letter-spacing:.14em;text-transform:uppercase;font-weight:800;white-space:nowrap}
.hdr-actions{display:flex;align-items:center;gap:8px}
.hdr-btn{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:6px 12px;font-size:11px;font-weight:700;text-decoration:none;cursor:pointer;text-transform:uppercase;letter-spacing:.06em}
.hdr-btn:hover{background:rgba(255,255,255,.20)}
.user-chip{font-size:10px;color:#a8c4db;background:rgba(255,255,255,.08);padding:5px 10px;border-radius:999px;font-weight:600;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Sub-nav (mobile-first tabs) ─────────────────────────────────── */
.subnav{background:#fff;border-bottom:1px solid var(--border);padding:6px 6px 0;display:flex;gap:4px;overflow-x:auto;position:sticky;top:52px;z-index:40}
.subnav::-webkit-scrollbar{display:none}
.tabbtn{background:none;border:none;color:var(--muted);padding:12px 18px;font-size:13px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;flex-shrink:0;position:relative;transition:color .15s, border-color .15s}
.tabbtn.active{color:var(--navy);border-bottom-color:var(--ocean)}
.tabbtn .badge{background:var(--ocean);color:#fff;font-size:10px;font-weight:800;padding:1px 7px;border-radius:999px;margin-left:6px;min-width:18px;display:inline-block;text-align:center}

/* ── Content sections ───────────────────────────────────────────── */
main{padding:16px;max-width:640px;margin:0 auto}
.page{display:none}
.page.active{display:block}

/* ── Cards + form primitives ────────────────────────────────────── */
.card{background:#fff;border-radius:12px;box-shadow:var(--sh-soft);padding:16px;margin-bottom:14px}
.card-t{font-family:'DM Serif Display',serif;font-size:20px;color:var(--navy);margin:0 0 12px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;font-size:15px;background:#fff;color:var(--ink);transition:border-color .15s;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ocean);box-shadow:0 0 0 3px rgba(30,111,168,.10)}
.field .hint{font-size:11px;color:var(--muted);margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Segment control (Kind: rental / lesson / activity) */
.segment{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--foam);padding:4px;border-radius:12px;margin-bottom:14px}
.segment button{background:none;border:none;padding:11px 8px;font-size:13px;font-weight:700;color:var(--muted);border-radius:9px;cursor:pointer;transition:background .15s, color .15s}
.segment button.active{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* Payment method toggle */
.pay-toggle{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pay-toggle button{background:#fff;border:1.5px solid var(--border);padding:11px;border-radius:10px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .15s}
.pay-toggle button.active{background:var(--navy);border-color:var(--navy);color:#fff}

/* Buttons */
.btn{width:100%;background:var(--ocean);color:#fff;border:none;padding:14px;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer;transition:background .15s;letter-spacing:.02em}
.btn:hover:not(:disabled){background:#175a8f}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.secondary{background:#fff;color:var(--navy);border:1.5px solid var(--border)}
.btn.secondary:hover:not(:disabled){background:var(--foam)}
.btn.success{background:var(--green)}
.btn.success:hover:not(:disabled){background:#0d6d47}
.btn.danger{background:var(--red)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Checkbox (terms) */
.terms{display:flex;gap:10px;align-items:flex-start;padding:12px;background:var(--foam);border-radius:10px;cursor:pointer}
.terms input{margin-top:2px;width:20px;height:20px;accent-color:var(--ocean);flex-shrink:0}
.terms-txt{font-size:12px;color:var(--muted);line-height:1.5}
.terms-txt a{color:var(--ocean);font-weight:700}

/* Open-rental / history item rows */
.rental-row{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:var(--sh-soft)}
.rental-row.open{border-left:4px solid var(--amber)}
/* Big "Return by HH:MM" hero on every open rental card. Staff need to
   read the return time from across the shop, not squint at 12px meta. */
.rr-return-hero{background:var(--foam);padding:12px 14px;border-radius:10px;margin-bottom:12px;text-align:center;border:1px solid #dce8f2}
.rr-return-hero.overdue{background:#fef4f2;border-color:#f4c3bd}
.rr-return-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:800}
.rr-return-time{font-family:'DM Serif Display',serif;font-size:38px;color:var(--navy);line-height:1;margin-top:4px}
.rr-return-hero.overdue .rr-return-time{color:var(--red)}
.rr-return-sub{font-size:12px;color:var(--muted);margin-top:4px}
.rr-return-hero.overdue .rr-return-sub{color:var(--red);font-weight:700}
.rental-row.overdue{border-left-color:var(--red);background:#fef4f2;border-color:#f4c3bd}
.rental-row.overdue .rr-name{color:var(--red)}
.rental-row.returned{border-left:4px solid var(--green);opacity:.72}
.rr-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.rr-name{font-weight:800;color:var(--ink);font-size:15px}
.rr-time{font-size:11px;color:var(--muted);white-space:nowrap;flex-shrink:0}
.rr-item{color:var(--muted);font-size:13px;margin-bottom:4px}
.rr-meta{font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:10px}
.rr-price{font-family:'DM Mono',monospace;font-weight:800;color:var(--navy);font-size:15px}
.rr-actions{display:flex;gap:8px;margin-top:12px}

/* Chips */
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.chip-open{background:var(--amber-bg);color:var(--amber)}
.chip-returned{background:var(--green-bg);color:var(--green)}
.chip-lesson{background:#eaf3fa;color:var(--ocean)}
.chip-activity{background:#f5efe6;color:#a06430}

/* Empty state */
.empty{padding:36px 20px;text-align:center;color:var(--muted);font-size:13px;background:#fff;border:1.5px dashed var(--border);border-radius:12px}
.empty-icon{font-size:36px;margin-bottom:10px;line-height:1}

/* Toast */
.toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;pointer-events:none}
.toast{background:var(--navy);color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.24);opacity:0;transition:opacity .2s, transform .2s;transform:translateY(20px)}
.toast.ok{background:var(--green)}
.toast.err{background:var(--red)}
.toast.show{opacity:1;transform:translateY(0)}

/* Filter row */
.filter-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-row select{background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--ink);cursor:pointer}

/* KPI strip on Open rentals */
.kpi-strip{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.kpi{background:#fff;padding:12px;border-radius:10px;box-shadow:var(--sh-soft)}
.kpi-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.kpi-val{font-family:'DM Serif Display',serif;font-size:22px;color:var(--navy);margin-top:2px;line-height:1}

/* Access denied splash */
.splash{max-width:420px;margin:80px auto;padding:32px;background:#fff;border-radius:14px;box-shadow:var(--sh-soft);text-align:center}
.splash h1{font-family:'DM Serif Display',serif;color:var(--navy);margin:0 0 12px;font-size:24px}
.splash p{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 18px}
.splash a{color:var(--ocean);font-weight:800;text-decoration:none}

/* ── Mobile-first chip selectors ─────────────────────────────────────
   Tap-once picks that replace <select> for enum fields. The hidden
   select stays around so existing JS (recalc, saveEntry) can read
   .value directly. Chip click → pickChip() sets the select + fires
   change. Buttons feel like a native app, no dropdown roundtrip. */
.chip-grid{display:grid;gap:8px}
.chip-grid.cols-2{grid-template-columns:1fr 1fr}
.chip-grid.cols-3{grid-template-columns:1fr 1fr 1fr}
.chip-grid.cols-4{grid-template-columns:1fr 1fr 1fr 1fr}
.chip-btn{background:#fff;border:1.5px solid var(--border);padding:14px 6px;border-radius:12px;font-size:14px;font-weight:800;color:var(--muted);cursor:pointer;transition:transform .1s, background .15s, border-color .15s, color .15s;line-height:1.15;-webkit-tap-highlight-color:transparent;font-family:inherit}
.chip-btn:active{transform:scale(.97)}
.chip-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 2px 8px rgba(40,57,75,.18)}
.chip-btn small{display:block;font-size:11px;font-weight:600;opacity:.75;margin-top:2px}
.chip-btn.active small{opacity:.9}

/* Days stepper — thumb-friendly +/− controls for Multi-day rentals.
   Replaces the number spinner which is fiddly on mobile Safari. */
.stepper{display:grid;grid-template-columns:56px 1fr 56px;border:1.5px solid var(--border);border-radius:12px;overflow:hidden;background:#fff;max-width:220px}
.stepper button{background:#fff;border:none;font-size:24px;font-weight:800;color:var(--navy);cursor:pointer;padding:0;transition:background .15s;-webkit-tap-highlight-color:transparent;font-family:inherit}
.stepper button:active{background:var(--foam)}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper .val{display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:22px;color:var(--navy);border-left:1.5px solid var(--border);border-right:1.5px solid var(--border);min-height:52px}
.stepper .val small{display:block;font-size:10px;color:var(--muted);font-family:'Outfit',sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:1px}

/* Live total preview — the big number staff read at a glance before
   pressing Save. Sits right above the editable Amount field so any
   manual override is obvious. */
.total-preview{background:linear-gradient(135deg,var(--navy),#3a5570);color:#fff;padding:14px 18px;border-radius:14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 4px 14px rgba(40,57,75,.18)}
.total-preview-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.14em;font-weight:800;opacity:.72}
.total-preview-val{font-family:'DM Serif Display',serif;font-size:34px;line-height:1;margin-top:2px}
.total-preview-breakdown{font-size:11px;opacity:.78;text-align:right;line-height:1.4;max-width:150px}

/* Sticky save on mobile — the save button always sits at thumb-reach
   without the user having to scroll to the bottom of the card. Fades
   into the page background so it doesn't feel like a hard bar. */
.sticky-save{position:sticky;bottom:0;padding:14px 0 8px;margin-top:14px;background:linear-gradient(to top,var(--bg) 60%,rgba(240,245,250,0));z-index:20}

/* Optional-fields collapsible — hides Email + ID Card behind a
   toggle so the default rental flow is 4 fields shorter. */
.optional-toggle{background:transparent;border:none;color:var(--ocean);font-weight:800;font-size:13px;cursor:pointer;padding:10px 0;display:flex;align-items:center;gap:6px;font-family:inherit}
.optional-toggle:hover{color:var(--navy)}
.optional-toggle .arrow{transition:transform .15s;display:inline-block}
.optional-toggle.open .arrow{transform:rotate(90deg)}
.optional-body{display:none;padding-top:4px}
.optional-body.open{display:block}

/* iOS Safari auto-zooms inputs with font-size < 16px on focus. Bump
   inputs to 16px on mobile so tapping into a field doesn't jerk the
   viewport. Selects included for the ones still visible (Cash chip
   fake-input etc). */
@media(max-width:640px){
  .field input,.field select,.field textarea{font-size:16px}
  /* The subnav's fixed top offset (52px) is Tuned for the header. On
     iOS momentum-scrolls it can jitter — set overscroll behavior so
     the scroll stays inside the container. */
  .subnav{overscroll-behavior:contain}
  /* On tiny screens (<380), let the date+time and email+id grids
     collapse to a single column rather than truncating labels. */
  @media(max-width:379px){
    .grid2{grid-template-columns:1fr}
  }
}

@media(min-width:640px){
  .btn-row{grid-template-columns:1fr 1fr 1fr}
  .kpi-strip{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>

<nav class="subnav">
  <button class="tabbtn active" data-page="new" onclick="showPage('new')">+ New</button>
  <button class="tabbtn" data-page="open" onclick="showPage('open')">Open <span class="badge" id="openBadge">0</span></button>
  <button class="tabbtn" data-page="history" onclick="showPage('history')">History</button>
</nav>

<main id="main">
  <!-- ══════════════════ NEW ENTRY ══════════════════ -->
  <div class="page active" id="page-new">
    <div class="card">
      <!-- Kind segment removed — Miguel confirmed the school only takes
           rentals through this form (lessons + activities aren't billed
           this way). Everything saved is kind='rental' by default; the
           JS still keeps the setKind() plumbing so lessons/activities
           can be re-enabled later without another rewrite. -->

      <div class="grid2">
        <div class="field">
          <label>Date of activity</label>
          <input id="fld_date" type="date" onchange="updateReturnPreview()">
        </div>
        <div class="field">
          <label>Start time</label>
          <input id="fld_start" type="time" onchange="updateReturnPreview()">
        </div>
      </div>
      <div id="returnPreview" style="margin:-6px 0 14px;padding:10px 12px;background:var(--foam);border-radius:10px;font-size:12px;color:var(--navy);display:none">
        <strong id="returnPreviewTxt">Return by —</strong>
        <span id="returnPreviewHint" style="color:var(--muted);font-weight:500"> · staff will know if the student went over</span>
      </div>
      <div class="field">
        <label>Student name</label>
        <input id="fld_name" type="text" placeholder="e.g. Ana Costa" autocomplete="off" autocapitalize="words" inputmode="text">
      </div>

      <!-- Email + ID collapsed by default. Most rentals don't need them;
           when the student wants a receipt or is leaving the board unsupervised
           the staff taps "Add contact info" to reveal them. Both stay optional. -->
      <button type="button" class="optional-toggle" id="contactToggle" onclick="toggleContactInfo()">
        <span class="arrow">▸</span>
        <span id="contactToggleLbl">Add contact info (email · ID)</span>
      </button>
      <div class="optional-body" id="contactBody">
        <div class="grid2">
          <div class="field">
            <label>Email (optional)</label>
            <input id="fld_email" type="email" placeholder="ana@…" autocomplete="off" inputmode="email" autocapitalize="off">
          </div>
          <div class="field">
            <label id="idLbl">ID card (optional)</label>
            <input id="fld_id" type="text" placeholder="Passport / ID" autocomplete="off">
          </div>
        </div>
      </div>

      <!-- Customer Type — chips (mobile-first). Hidden select mirrors the
           value for recalcRentalTotal() + saveEntry() so the JS stays as-is.
           "Choose" placeholder enforces an active pick (Google Form parity). -->
      <div class="field" id="custTypeWrap">
        <label>Customer type</label>
        <div class="chip-grid cols-3">
          <button type="button" class="chip-btn" data-val="Standard" onclick="pickChip('fld_customer_type','Standard')">Standard</button>
          <button type="button" class="chip-btn" data-val="Erasmus / Student" onclick="pickChip('fld_customer_type','Erasmus / Student')">Erasmus<small>/ Student</small></button>
          <button type="button" class="chip-btn" data-val="Resident" onclick="pickChip('fld_customer_type','Resident')">Resident</button>
        </div>
        <select id="fld_customer_type" style="display:none" onchange="recalcRentalTotal()" aria-hidden="true">
          <option value="">Choose…</option>
          <option value="Standard">Standard</option>
          <option value="Erasmus / Student">Erasmus / Student</option>
          <option value="Resident">Resident</option>
        </select>
        <div class="hint" id="customerTypeHint" style="display:none"></div>
      </div>

      <!-- Rental Type — Same Day vs Multi-day. Rentals only. -->
      <div class="field" id="rentalTypeWrap">
        <label>Rental type</label>
        <div class="segment" style="grid-template-columns:1fr 1fr">
          <button type="button" class="active" data-rtype="Same Day" onclick="setRentalType('Same Day')">Same Day</button>
          <button type="button" data-rtype="Multi-day" onclick="setRentalType('Multi-day')">Multi-day</button>
        </div>
      </div>

      <!-- Duration — chip grid for Same Day (4 chips), stepper for Multi-day.
           Both feed the same recalcRentalTotal() path via their hidden holders. -->
      <div class="field" id="durationWrap">
        <label id="durationLbl">Duration</label>
        <div class="chip-grid cols-4" id="durationChips">
          <button type="button" class="chip-btn active" data-val="1H" onclick="pickChip('fld_duration','1H')">1<small>hour</small></button>
          <button type="button" class="chip-btn" data-val="2H" onclick="pickChip('fld_duration','2H')">2<small>hours</small></button>
          <button type="button" class="chip-btn" data-val="3H" onclick="pickChip('fld_duration','3H')">3<small>hours</small></button>
          <button type="button" class="chip-btn" data-val="Full day" onclick="pickChip('fld_duration','Full day')">Full<small>day</small></button>
        </div>
        <select id="fld_duration" style="display:none" onchange="recalcRentalTotal()" aria-hidden="true">
          <option value="1H">1 hour</option>
          <option value="2H">2 hours</option>
          <option value="3H">3 hours</option>
          <option value="Full day">Full day</option>
        </select>
        <div id="daysStepperWrap" style="display:none">
          <div class="stepper">
            <button type="button" id="daysMinus" onclick="stepDays(-1)" aria-label="Fewer days">−</button>
            <div class="val"><span id="daysDisplay">2</span><small>days</small></div>
            <button type="button" onclick="stepDays(1)" aria-label="More days">+</button>
          </div>
          <div class="hint" style="margin-top:6px">Board goes home with the student — deposit taken.</div>
        </div>
        <input id="fld_days" type="hidden" value="2">
      </div>

      <!-- Rental item — chips (Board + Wetsuit is the common case). -->
      <div class="field" id="rentalItemsWrap">
        <label>Rental item</label>
        <div class="chip-grid cols-3">
          <button type="button" class="chip-btn active" data-val="Board + Wetsuit" onclick="pickChip('fld_rental_combo','Board + Wetsuit')">Board<small>+ Wetsuit</small></button>
          <button type="button" class="chip-btn" data-val="Board" onclick="pickChip('fld_rental_combo','Board')">Board<small>only</small></button>
          <button type="button" class="chip-btn" data-val="Wetsuit" onclick="pickChip('fld_rental_combo','Wetsuit')">Wetsuit<small>only</small></button>
        </div>
        <select id="fld_rental_combo" style="display:none" onchange="recalcRentalTotal()" aria-hidden="true">
          <option value="Board + Wetsuit" selected>Board + Wetsuit</option>
          <option value="Board">Board only</option>
          <option value="Wetsuit">Wetsuit only</option>
        </select>
      </div>

      <!-- Big total preview — recalcRentalTotal() paints this AND fills the
           Amount input below with the same number. Staff read the total
           here; the Amount field remains editable for one-off discounts. -->
      <div class="total-preview" id="totalPreview">
        <div>
          <div class="total-preview-lbl">Total</div>
          <div class="total-preview-val" id="totalPreviewVal">€0</div>
        </div>
        <div class="total-preview-breakdown" id="totalPreviewBreakdown">Pick a customer type</div>
      </div>

      <div class="field">
        <label>Amount (edit for discount)</label>
        <input id="fld_price" type="number" step="0.01" min="0" placeholder="0.00" inputmode="decimal">
        <div class="hint" id="curHint">EUR · <strong>€250 deposit taken</strong> if the board leaves the shop.</div>
      </div>
      <!-- Payment is Cash only for the Surf School — the form was born
           from the "Surf School Cash Payment Data Collection Form".
           Kept a small chip so staff know what's being recorded rather
           than hiding it entirely. If card ever gets accepted here, add
           the toggle back and wire setPay(). -->
      <div class="field">
        <label>Payment</label>
        <div style="padding:11px 14px;background:var(--foam);border-radius:10px;font-size:13px;color:var(--navy);font-weight:700">💵 Cash</div>
      </div>
      <label class="terms">
        <input id="fld_terms" type="checkbox">
        <span class="terms-txt">Student agrees to the <a href="https://gotadaguasurf.com/terms-and-conditions/" target="_blank" rel="noopener">terms &amp; conditions</a> and consents to their info being recorded.</span>
      </label>
      <div class="sticky-save">
        <button class="btn" id="saveBtn" onclick="saveEntry()">Save rental</button>
      </div>
    </div>
  </div>

  <!-- ══════════════════ OPEN RENTALS ══════════════════ -->
  <div class="page" id="page-open">
    <div class="kpi-strip">
      <div class="kpi">
        <div class="kpi-lbl">Boards out</div>
        <div class="kpi-val" id="kpiOut">0</div>
      </div>
      <div class="kpi">
        <div class="kpi-lbl">Overdue &gt;2h</div>
        <div class="kpi-val" id="kpiOverdue" style="color:var(--red)">0</div>
      </div>
    </div>
    <div id="openList"><div class="empty"><div class="empty-icon">🏄</div>No boards out right now.</div></div>
  </div>

  <!-- ══════════════════ HISTORY ══════════════════ -->
  <div class="page" id="page-history">
    <div class="filter-row">
      <select id="filt_kind" onchange="renderHistory()">
        <option value="all">All types</option>
        <option value="rental">Rentals</option>
        <option value="lesson">Lessons</option>
        <option value="activity">Activities</option>
      </select>
      <select id="filt_period" onchange="renderHistory()">
        <option value="today">Today</option>
        <option value="week" selected>Last 7 days</option>
        <option value="month">Last 30 days</option>
        <option value="all">All time</option>
      </select>
    </div>
    <div id="historyList"><div class="empty"><div class="empty-icon">⏳</div>Loading…</div></div>
  </div>
</main>

<div class="toast-wrap"><div class="toast" id="toast"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.4"></script>
<script src="/supabase-config.js"></script>
<script>
const cfg = window.__SUPABASE_CONFIG || {};
const sb = window.supabase.createClient(cfg.url, cfg.anonKey);

// State
let LOCATION_ID = null;
let CATALOG = [];
let ALL_RENTALS = [];
let CURRENT_KIND = 'rental';
let CURRENT_PAY = 'Cash';
let CURRENT_RENTAL_TYPE = 'Same Day';
let CURRENT_USER = null;
let PROFILE_NAMES = new Map();
// CAN_EDIT_HISTORY gates the Delete button on the History tab and any
// after-the-fact edit paths. Only staff with full Surf School access
// (workspace_memberships.can_edit=true) get these. The "Rentals only"
// role, which comes in via ?view=camp-tab-only from Settings, always
// sees false — so a cash-handling staff member can never edit a paid
// rental at the end of the day and pocket the difference.
let CAN_EDIT_HISTORY = false;

// When embedded inside camp-hub (iframe with ?embedded=1) the parent
// already has its own dark navy header + location switcher, so hiding
// ours prevents the double-header look. Same page works standalone at
// gotadaguasurf.com/surf-school/ where the header shows normally.
if (new URLSearchParams(location.search).get('embedded') === '1') {
  const hdr = document.querySelector('header');
  if (hdr) hdr.style.display = 'none';
  const sub = document.querySelector('.subnav');
  if (sub) sub.style.top = '0';
  document.body.style.background = 'var(--bg)';
}

// ── Boot ─────────────────────────────────────────────────────────
async function boot(){
  const { data:{ user } } = await sb.auth.getUser();
  if (!user) {
    document.body.innerHTML = `<div class="splash"><h1>Sign in required</h1><p>Open the Gota d'Água hub, sign in, then reopen this page.</p><a href="/">← Back to hub</a></div>`;
    return;
  }
  CURRENT_USER = user;
  // Best-effort display name.
  try {
    const { data } = await sb.from('platform_profiles').select('full_name,email').eq('id', user.id).maybeSingle();
    document.getElementById('userChip').textContent = data?.full_name || data?.email || user.email || 'you';
  } catch { document.getElementById('userChip').textContent = user.email || 'you'; }

  // Resolve surf-school location id — RLS on locations gates it, so if the
  // user has no access, this returns null and we show the access-denied splash.
  const { data: loc, error: locErr } = await sb.from('locations').select('id, name, slug').eq('slug','surf-school').maybeSingle();
  if (locErr || !loc) {
    document.body.innerHTML = `<div class="splash"><h1>No access</h1><p>Your account isn't provisioned for the Surf School location. Ask Miguel to add you.</p><a href="/">← Back to hub</a></div>`;
    return;
  }
  LOCATION_ID = loc.id;
  // Detect edit rights. Rentals-only staff (invited with just "Surf School
  // · Rentals" in Settings) come in through ?view=camp-tab-only — a
  // structural signal we can trust before any DB round-trip. Otherwise
  // look for a workspace_memberships row with can_edit=true on
  // surf-school; owner emails always get through.
  const viewMode = new URLSearchParams(location.search).get('view');
  if (viewMode === 'camp-tab-only') {
    CAN_EDIT_HISTORY = false;
  } else {
    try {
      const ownerEmails = new Set(['miguel@gotadaguasurf.com']);
      const email = String(user.email || '').toLowerCase();
      if (ownerEmails.has(email)) {
        CAN_EDIT_HISTORY = true;
      } else {
        const { data: mem } = await sb.from('workspace_memberships')
          .select('can_edit, workspaces!inner(slug)')
          .eq('user_id', user.id)
          .eq('active', true)
          .eq('workspaces.slug', 'surf-school')
          .maybeSingle();
        CAN_EDIT_HISTORY = !!mem?.can_edit;
      }
    } catch (_e) { CAN_EDIT_HISTORY = false; }
  }
  // Default the "Date of activity" + "Start time" fields to now so staff
  // usually just tap through them. Uses LOCAL clock so a 14:30 pick means
  // 14:30 in the manager's timezone.
  const now = new Date();
  const pad = (n) => String(n).padStart(2,'0');
  const dfld = document.getElementById('fld_date');
  if (dfld) dfld.value = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  const sfld = document.getElementById('fld_start');
  if (sfld) sfld.value = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  updateReturnPreview();
  // Preview the Regular price for the default combo/duration so the
  // amount doesn't sit at 0 until staff opens the customer dropdown.
  recalcRentalTotal();
  await loadCatalog();
  await loadRentals();
  renderOpen();
  subscribeRealtime();
}

async function loadCatalog(){
  const { data, error } = await sb.from('pricing_catalog')
    .select('id, name, category, sell_price, currency, active, sort_order')
    .eq('location_id', LOCATION_ID)
    .eq('active', true)
    .order('sort_order', { ascending:true });
  if (error) { toast('Catalog load failed: '+error.message, 'err'); return; }
  CATALOG = data || [];
  renderItemPicker();
}

function renderItemPicker(){

  const kindGuess = (c) => {
    const cat = String(c.category||'').toLowerCase();
    if (CURRENT_KIND === 'lesson') return cat.includes('lesson');
    if (CURRENT_KIND === 'rental') return cat.includes('surf pack') || cat.includes('rental') || cat.includes('other service');
    return true; // activity — show all

  const items = CATALOG.filter(kindGuess);

          <input type="checkbox" class="item-cb" data-id="${c.id}" data-price="${c.sell_price}" data-cur="${c.currency||'EUR'}" data-name="${escapeHtml(c.name)}" onchange="recalcRentalTotal()" style="width:20px;height:20px;accent-color:var(--ocean)">
          <span style="flex:1;font-weight:700">${escapeHtml(c.name)}</span>

      : `<div class="hint" style="padding:12px;background:var(--foam);border-radius:10px">No rental items in the catalog yet. Add them in the Prices app under Surf School.</div>`;
    document.getElementById('fld_price').value = '';

}
function onItemPick(){
  const sel = document.getElementById('fld_item');
  const opt = sel?.selectedOptions?.[0];
  if (!opt || !opt.value) { document.getElementById('fld_price').value = ''; document.getElementById('curHint').textContent = ''; return; }
  document.getElementById('fld_price').value = Number(opt.dataset.price || 0).toFixed(2);
  document.getElementById('curHint').textContent = (opt.dataset.cur || 'EUR') + ' · edit if you gave a discount';
}
// Surf School rental price matrix — from the printed price card Miguel
// shared. Every combo × duration lives here so the form auto-fills
// Amount without a second thought. Student and Resident tiers only
// quote 2H + Full day for the Board+Wetsuit combo — anything outside
// that falls back to Regular. Same for Surf Camp Customer until Miguel
// gives dedicated numbers.
const RENTAL_PRICING = {
  Standard: {
    'Board + Wetsuit': { '1H':20, '2H':30, '3H':40, 'Full day':45, extra:15 },
    'Board':           { '1H':15, '2H':20, '3H':30, 'Full day':40, extra:10 },
    'Wetsuit':         { '1H':10, '2H':12, '3H':15, 'Full day':20, extra:15 }
  },
  'Erasmus / Student': {
    // Discount tier only quotes 2H + Full day for the combo — anything
    // outside that falls back to Standard via priceFor().
    'Board + Wetsuit': { '2H':20, 'Full day':25 }
  },
  Resident: {
    'Board + Wetsuit': { '2H':15, 'Full day':25 }
  }
};

// Lesson pricing — not exposed on this form (rentals only for now) but
// kept here as the single source of truth so the Prices app and the
// Camp Tab exposure can pick it up when Miguel opts in.
//   Group (Standard):    max 5 per instructor, 1h30 per lesson.
//   Private (Standard):  max 5 pax, 1h30 per lesson. +30€ per extra person.
//   Erasmus surf lessons: 1h30, ESN document required.
//   Resident group lessons: 1h30, PT residency document required.
const LESSON_PRICING = {
  'Group (Standard)':     { 1: 35, 3: 95,  5: 140, 10: 230, note: 'Max 5 per instructor · 1h30' },
  'Private (Standard)':   { 1: 75, 3: 210, 5: 325, 10: 550, note: 'Max 5 pax · 1h30 · +€30 per extra person' },
  'Erasmus surf lessons': { 1: 20,          5: 90,  10: 160, note: '1h30 · ESN document required' },
  'Resident group':       {                5: 125, 10: 190, 20: 320, note: '1h30 · PT residency document required' }
};

// Documents required by customer type — surfaced under the picker so
// staff know to ask for the ID / student card before applying the tier.
const CUSTOMER_TYPE_NOTES = {
  'Erasmus / Student': 'Ask for the ESN document to apply the student rate.',
  'Resident':          'Ask for the PT residency document to apply the resident rate.'
};

function priceFor(customerType, combo, durationKey){
  const tier = RENTAL_PRICING[customerType];
  const tierPrice = tier?.[combo]?.[durationKey];
  if (typeof tierPrice === 'number') return tierPrice;
  // Fall back to Standard for any (tier, combo, duration) the discount
  // table doesn't cover — e.g. Erasmus + Board only, Resident + 3H.
  return RENTAL_PRICING.Standard[combo]?.[durationKey] ?? 0;
}
function extraDayRateFor(combo){
  return RENTAL_PRICING.Standard[combo]?.extra ?? 0;
}
function updateCustomerTypeHint(){
  const hint = document.getElementById('customerTypeHint');
  const val = document.getElementById('fld_customer_type')?.value;
  if (!hint) return;
  const note = CUSTOMER_TYPE_NOTES[val];
  if (note) {
    hint.textContent = '⚠ ' + note;
    hint.style.display = '';
    hint.style.color = 'var(--amber)';
    hint.style.fontWeight = '600';
  } else {
    hint.style.display = 'none';
  }
}

function recalcRentalTotal(){
  updateReturnPreview();
  updateCustomerTypeHint();
  if (CURRENT_KIND !== 'rental') return;
  const combo = document.getElementById('fld_rental_combo')?.value || 'Board + Wetsuit';
  const customerRaw = document.getElementById('fld_customer_type')?.value || '';
  const customer = customerRaw || 'Standard';
  let total = 0;
  let breakdown = '';
  if (CURRENT_RENTAL_TYPE === 'Multi-day') {
    // Multi-day pricing = one Full day (with tier discount if it applies)
    // + Extra days rate for every additional day. Extra rate uses the
    // Regular table across the board — the discount tiers only cover
    // 2H and Full day.
    const days = Math.max(1, Number(document.getElementById('fld_days')?.value) || 1);
    const dayOne = priceFor(customer, combo, 'Full day');
    const extraRate = extraDayRateFor(combo);
    const extraTotal = (days - 1) * extraRate;
    total = dayOne + extraTotal;
    breakdown = days === 1
      ? `1 day · ${combo}`
      : `Day 1: €${dayOne} + ${days-1} × €${extraRate}`;
  } else {
    const d = document.getElementById('fld_duration')?.value || '1H';
    total = priceFor(customer, combo, d);
    const durLabel = { '1H':'1h', '2H':'2h', '3H':'3h', 'Full day':'Full day' }[d] || d;
    breakdown = `${combo} · ${durLabel}`;
  }
  document.getElementById('fld_price').value = total.toFixed(2);
  // Big total-preview readout above the (editable) Amount input.
  const totalEl = document.getElementById('totalPreviewVal');
  const brkEl = document.getElementById('totalPreviewBreakdown');
  if (totalEl) totalEl.textContent = '€' + total.toFixed(total % 1 === 0 ? 0 : 2);
  if (brkEl) {
    if (!customerRaw) {
      brkEl.textContent = 'Pick a customer type';
    } else {
      brkEl.innerHTML = `${breakdown}<br><span style="opacity:.72">${customerRaw}</span>`;
    }
  }
}
// Turn "Date of activity" + "Start time" + the picked duration into two
// timestamps: when the rental starts and when it's expected back. Same
// Day uses hour offsets (1/2/3 hours, or 8 hours for Full day). Multi-day
// uses N × 24 h. Returns null when the required fields aren't filled yet.
function computeExpectedReturn(){
  const dateStr  = document.getElementById('fld_date')?.value;
  const startStr = document.getElementById('fld_start')?.value;
  if (!dateStr || !startStr) return null;
  const start = new Date(`${dateStr}T${startStr}`);
  if (isNaN(start.getTime())) return null;
  let addMs = 0;
  if (CURRENT_RENTAL_TYPE === 'Multi-day') {
    const days = Math.max(1, Number(document.getElementById('fld_days')?.value) || 1);
    addMs = days * 24 * 60 * 60 * 1000;
  } else {
    const d = document.getElementById('fld_duration')?.value || '1H';
    const hours = { '1H':1, '2H':2, '3H':3, 'Full day':8 }[d] || 1;
    addMs = hours * 60 * 60 * 1000;
  }
  return { start, expected: new Date(start.getTime() + addMs) };
}
function updateReturnPreview(){
  const box = document.getElementById('returnPreview');
  const txt = document.getElementById('returnPreviewTxt');
  if (!box || !txt) return;
  if (CURRENT_KIND !== 'rental') { box.style.display = 'none'; return; }
  const r = computeExpectedReturn();
  if (!r) { box.style.display = 'none'; return; }
  const sameDay = r.start.toDateString() === r.expected.toDateString();
  const timeFmt = { hour:'2-digit', minute:'2-digit' };
  const dateFmt = { day:'numeric', month:'short' };
  const label = sameDay
    ? `Return by ${r.expected.toLocaleTimeString('en-GB', timeFmt)}`
    : `Return by ${r.expected.toLocaleDateString('en-GB', dateFmt)} · ${r.expected.toLocaleTimeString('en-GB', timeFmt)}`;
  txt.textContent = label;
  box.style.display = '';
}

// ── Rentals ──────────────────────────────────────────────────────
async function loadRentals(){
  const { data, error } = await sb.from('surf_school_rentals')
    .select('id, kind, student_name, student_email, id_card_number, item_id, item_name, qty, price_local, currency, payment_method, opened_at, opened_by, closed_at, closed_by, is_returned, ledger_entry_id, terms_accepted, customer_type, rental_type, duration, items, start_time, expected_return_at')
    .eq('location_id', LOCATION_ID)
    .order('opened_at', { ascending:false })
    .limit(500);
  if (error) { toast('Rentals load failed: '+error.message, 'err'); return; }
  ALL_RENTALS = data || [];
  // Resolve staff names in the background so history/open show who
  // opened/closed each row.
  const uids = [...new Set(ALL_RENTALS.flatMap(r => [r.opened_by, r.closed_by]).filter(Boolean))];
  const missing = uids.filter(id => !PROFILE_NAMES.has(id));
  if (missing.length) {
    try {
      const { data: profs } = await sb.from('platform_profiles').select('id, full_name, email').in('id', missing);
      (profs||[]).forEach(p => PROFILE_NAMES.set(p.id, p.full_name || p.email || 'Unknown'));
      missing.forEach(id => { if (!PROFILE_NAMES.has(id)) PROFILE_NAMES.set(id, 'Unknown'); });
    } catch { missing.forEach(id => PROFILE_NAMES.set(id, 'Unknown')); }
  }
  const openCount = ALL_RENTALS.filter(r => r.kind === 'rental' && !r.is_returned).length;
  document.getElementById('openBadge').textContent = openCount;
}

function renderOpen(){
  const list = document.getElementById('openList');
  const open = ALL_RENTALS.filter(r => r.kind === 'rental' && !r.is_returned);
  document.getElementById('kpiOut').textContent = open.length;
  const now = Date.now();
  // Overdue rule: prefer expected_return_at when the row has it. Fall
  // back to the old "2h since opened_at" heuristic for phase-1 rows that
  // pre-date the expected_return_at column.
  const isOverdueOf = (r) => r.expected_return_at
    ? (now > new Date(r.expected_return_at).getTime())
    : ((now - new Date(r.opened_at).getTime()) > 2*60*60*1000);
  document.getElementById('kpiOverdue').textContent = open.filter(isOverdueOf).length;

  if (!open.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">🏄</div>No boards out right now.</div>`;
    return;
  }
  // Sort by expected_return_at asc so the most-imminent-return / overdue
  // floats to the top. Rows without expected_return_at (phase 1) sort
  // by opened_at as before.
  const sortKey = (r) => new Date(r.expected_return_at || r.opened_at).getTime();
  const sorted = [...open].sort((a,b) => sortKey(a) - sortKey(b));
  const timeFmt = { hour:'2-digit', minute:'2-digit' };
  const dateFmt = { day:'numeric', month:'short' };
  list.innerHTML = sorted.map(r => {
    const openedMs = new Date(r.opened_at).getTime();
    const mins = Math.max(0, Math.round((now - openedMs)/60000));
    const timeAgo = mins < 60 ? `${mins} min out` : `${Math.floor(mins/60)}h ${mins%60}m out`;
    const isOverdue = isOverdueOf(r);
    const cls = isOverdue ? 'open overdue' : 'open';
    const staff = PROFILE_NAMES.get(r.opened_by) || 'Unknown';
    // Return-by label. Same-day rentals show only the time; multi-day
    // adds the date.
    let returnLbl = '';
    if (r.expected_return_at) {
      const exp = new Date(r.expected_return_at);
      const open = new Date(r.opened_at);
      const sameDay = exp.toDateString() === open.toDateString();
      returnLbl = sameDay
        ? `Return by ${exp.toLocaleTimeString('en-GB', timeFmt)}`
        : `Return by ${exp.toLocaleDateString('en-GB', dateFmt)} · ${exp.toLocaleTimeString('en-GB', timeFmt)}`;
      if (isOverdue) {
        const overdueMs = now - exp.getTime();
        const overMins = Math.max(1, Math.round(overdueMs / 60000));
        const overStr = overMins < 60 ? `${overMins} min` : `${Math.floor(overMins/60)}h ${overMins%60}m`;
        returnLbl += ` · <strong style="color:var(--red)">${overStr} over</strong>`;
      }
    }
    // Big "Return by" hero. Time is the anchor — everything else supports
    // it. Multi-day returns show the date on the sub-line; overdue rows
    // paint the whole hero red with a countdown of "how far over".
    let heroTimeStr = '', heroSubStr = '';
    if (r.expected_return_at) {
      const exp = new Date(r.expected_return_at);
      const open = new Date(r.opened_at);
      const sameDay = exp.toDateString() === open.toDateString();
      heroTimeStr = exp.toLocaleTimeString('en-GB', timeFmt);
      const dayStr = exp.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
      if (isOverdue) {
        const overMs = now - exp.getTime();
        const overMins = Math.max(1, Math.round(overMs/60000));
        const overStr = overMins < 60 ? `${overMins} min` : `${Math.floor(overMins/60)}h ${overMins%60}m`;
        heroSubStr = sameDay ? `⚠ ${overStr} over` : `${dayStr} · ⚠ ${overStr} over`;
      } else {
        heroSubStr = sameDay ? 'today' : dayStr;
      }
    }
    const returnHero = heroTimeStr
      ? `<div class="rr-return-hero ${isOverdue?'overdue':''}">
           <div class="rr-return-lbl">Return by</div>
           <div class="rr-return-time">${heroTimeStr}</div>
           <div class="rr-return-sub">${heroSubStr}</div>
         </div>`
      : '';
    return `<div class="rental-row ${cls}">
      ${returnHero}
      <div class="rr-top">
        <div class="rr-name">${escapeHtml(r.student_name)}${r.customer_type?` <span class="chip" style="background:var(--foam);color:var(--ocean)">${escapeHtml(r.customer_type)}</span>`:''}</div>
        <div class="rr-time">${timeAgo}</div>
      </div>
      <div class="rr-item">${escapeHtml(r.item_name)}${r.duration?` · ${escapeHtml(r.duration)}`:''}</div>
      <div class="rr-meta">
        <span>Given by <strong>${escapeHtml(staff)}</strong></span>
        ${r.id_card_number?`<span>ID ${escapeHtml(r.id_card_number)}</span>`:''}
        <span class="rr-price">${escapeHtml(r.currency||'EUR')} ${Number(r.price_local||0).toFixed(0)}</span>
      </div>
      <div class="rr-actions">
        <button class="btn success" onclick="closeRental('${r.id}', '${escapeAttr(r.student_name)}')">✓ Return board</button>
      </div>
    </div>`;
  }).join('');

  // "Recently closed" strip — rentals that were returned in the last 24h.
  // If a manager tapped Return by mistake, the row is one click away from
  // Reopen. Muted styling so it doesn't compete with the active list.
  const dayAgo = now - 24*60*60*1000;
  const recent = ALL_RENTALS
    .filter(r => r.kind === 'rental' && r.is_returned && r.closed_at && new Date(r.closed_at).getTime() > dayAgo)
    .sort((a,b) => new Date(b.closed_at).getTime() - new Date(a.closed_at).getTime())
    .slice(0, 6);
  if (recent.length) {
    const rc = recent.map(r => {
      const closedMs = new Date(r.closed_at).getTime();
      const mins = Math.max(1, Math.round((now - closedMs)/60000));
      const ago = mins < 60 ? `${mins} min ago` : `${Math.floor(mins/60)}h ${mins%60}m ago`;
      return `<div class="rental-row returned" style="opacity:.9">
        <div class="rr-top">
          <div class="rr-name" style="color:var(--muted);text-decoration:line-through">${escapeHtml(r.student_name)}</div>
          <div class="rr-time">${ago}</div>
        </div>
        <div class="rr-item">${escapeHtml(r.item_name)}${r.duration?` · ${escapeHtml(r.duration)}`:''}</div>
        <div class="rr-actions">
          <button class="btn secondary" onclick="reopenRental('${r.id}', '${escapeAttr(r.student_name)}')">↺ Reopen (returned by mistake)</button>
        </div>
      </div>`;
    }).join('');
    list.insertAdjacentHTML('beforeend', `
      <div style="margin-top:28px;padding-top:14px;border-top:1px solid var(--border)">
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:800;margin-bottom:10px">Recently returned · last 24h</div>
        ${rc}
      </div>`);
  }
}

function renderHistory(){
  const kindF = document.getElementById('filt_kind')?.value || 'all';
  const periodF = document.getElementById('filt_period')?.value || 'week';
  const cutoff = (() => {
    const d = new Date();
    if (periodF === 'today') d.setUTCHours(0,0,0,0);
    else if (periodF === 'week') d.setUTCDate(d.getUTCDate() - 7);
    else if (periodF === 'month') d.setUTCDate(d.getUTCDate() - 30);
    else return null;
    return d.toISOString();
  })();

  const rows = ALL_RENTALS.filter(r => {
    if (kindF !== 'all' && r.kind !== kindF) return false;
    if (cutoff && String(r.opened_at) < cutoff) return false;
    return true;
  });
  const list = document.getElementById('historyList');
  if (!rows.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">📖</div>Nothing in this window.</div>`;
    return;
  }
  const now = Date.now();
  list.innerHTML = rows.slice(0, 300).map(r => {
    const openedDate = new Date(r.opened_at);
    const dateLbl = openedDate.toLocaleDateString('en-GB', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
    const staff = PROFILE_NAMES.get(r.opened_by) || 'Unknown';
    const closedBy = r.closed_by ? (PROFILE_NAMES.get(r.closed_by) || 'someone') : null;
    const cls = r.kind === 'rental' ? (r.is_returned?'returned':'open') : 'returned';
    const chip = r.kind === 'rental'
      ? (r.is_returned ? `<span class="chip chip-returned">Returned</span>` : `<span class="chip chip-open">Open</span>`)
      : (r.kind === 'lesson' ? `<span class="chip chip-lesson">Lesson</span>` : `<span class="chip chip-activity">Activity</span>`);
    const closedInfo = r.is_returned && r.closed_at
      ? `Returned ${new Date(r.closed_at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}${closedBy?` by ${escapeHtml(closedBy)}`:''}`
      : '';
    // Delete action — only for full-access staff. Rentals-only role
    // never sees this button (server-side RLS also blocks the delete,
    // so a manipulated request can't slip through either).
    const delBtn = CAN_EDIT_HISTORY
      ? `<button class="btn danger" style="margin-top:10px" onclick="deleteRental('${r.id}', '${escapeAttr(r.student_name)}')">🗑 Delete entry</button>`
      : '';
    return `<div class="rental-row ${cls}">
      <div class="rr-top">
        <div class="rr-name">${escapeHtml(r.student_name)} ${chip}</div>
        <div class="rr-time">${dateLbl}</div>
      </div>
      <div class="rr-item">${escapeHtml(r.item_name)}${r.qty!=1?` · ${r.qty}x`:''} · ${escapeHtml(r.payment_method||'—')}</div>
      <div class="rr-meta">
        <span>By <strong>${escapeHtml(staff)}</strong></span>
        ${closedInfo?`<span>${closedInfo}</span>`:''}
        <span class="rr-price">${escapeHtml(r.currency||'EUR')} ${Number(r.price_local||0).toFixed(0)}</span>
      </div>
      ${delBtn}
    </div>`;
  }).join('') + (rows.length > 300 ? `<div class="empty" style="border:none;padding:14px 8px;font-size:11px">Showing 300 of ${rows.length}. Narrow the filters to see more.</div>` : '');
}

// Hard-delete a rental + its ledger revenue line. Guarded by
// CAN_EDIT_HISTORY on the client and by RLS on the server. Requires
// the staff member to retype the student's first name to confirm.
async function deleteRental(id, studentName){
  if (!CAN_EDIT_HISTORY) { toast('Not allowed', 'err'); return; }
  const first = String(studentName||'').trim().split(/\s+/)[0] || '';
  const typed = window.prompt(`DELETE ${studentName}'s rental (and its revenue line)?\n\nType "${first}" to confirm.`);
  if (typed === null) return;
  if (String(typed).trim().toLowerCase() !== first.toLowerCase()) {
    toast('Name didn\'t match — delete cancelled', 'err');
    return;
  }
  // Fetch the row so we can nuke the ledger_entry_id too.
  const row = ALL_RENTALS.find(r => r.id === id);
  if (row?.ledger_entry_id) {
    await sb.from('ledger_entries').delete().eq('id', row.ledger_entry_id).catch(()=>{});
  }
  const { error } = await sb.from('surf_school_rentals').delete().eq('id', id);
  if (error) { toast('Delete failed: '+error.message, 'err'); return; }
  toast('✓ Deleted', 'ok');
  await loadRentals();
  renderHistory();
}

// ── Save flow ────────────────────────────────────────────────────
async function saveEntry(){
  const btn = document.getElementById('saveBtn');
  const name  = document.getElementById('fld_name').value.trim();
  const email = document.getElementById('fld_email').value.trim() || null;
  const idCard= document.getElementById('fld_id').value.trim() || null;
  const price = Number(document.getElementById('fld_price').value) || 0;
  const terms = document.getElementById('fld_terms').checked;

  // Rentals: the item picker is a single dropdown with the three combos
  // (Board + Wetsuit / Board / Wetsuit) that the price matrix knows. No
  // item_id — the item lives in the matrix, not the pricing_catalog.
  // Lesson / activity paths still exist for a future re-enable but aren't
  // reachable via the UI right now (kind segment was removed).
  let pickedItems = [];
  let primaryItem = null;
  let currency = 'EUR';
  if (CURRENT_KIND === 'rental') {
    const combo = document.getElementById('fld_rental_combo')?.value || 'Board + Wetsuit';
    primaryItem = { item_id: null, name: combo, price, currency: 'EUR' };
    pickedItems = [primaryItem];
    currency = 'EUR';
  } else {
    const itemSel = document.getElementById('fld_item');
    const opt = itemSel.selectedOptions[0];
    if (!opt || !opt.value) { toast('Pick an item from the catalog', 'err'); return; }
    primaryItem = { item_id: opt.value, name: opt.dataset.name || opt.textContent, price: Number(opt.dataset.price || 0), currency: opt.dataset.cur || 'EUR' };
    pickedItems = [primaryItem];
    currency = primaryItem.currency;
  }

  if (!name) { toast('Student name required', 'err'); return; }
  if (CURRENT_KIND === 'rental' && !document.getElementById('fld_customer_type').value) {
    toast('Pick a customer type', 'err'); return;
  }
  if (!(price > 0)) { toast('Amount must be > 0', 'err'); return; }
  if (!terms) { toast('Confirm terms accepted', 'err'); return; }

  const customerType = CURRENT_KIND === 'rental' ? (document.getElementById('fld_customer_type').value || null) : null;
  const rentalType   = CURRENT_KIND === 'rental' ? CURRENT_RENTAL_TYPE : null;
  const duration     = CURRENT_KIND === 'rental'
    ? (CURRENT_RENTAL_TYPE === 'Multi-day'
        ? `${Number(document.getElementById('fld_days').value) || 1} days`
        : document.getElementById('fld_duration').value)
    : null;
  const qty = CURRENT_KIND === 'rental' && CURRENT_RENTAL_TYPE === 'Multi-day'
    ? (Number(document.getElementById('fld_days').value) || 1)
    : 1;

  const itemName = pickedItems.length > 1
    ? pickedItems.map(p => p.name).join(' + ')
    : primaryItem.name;
  // "Date of activity" drives the ledger entry_date + the opened_at
  // timestamp we use as "when the board went out". If the user cleared
  // the field we fall back to today.
  const activityDate = document.getElementById('fld_date')?.value || new Date().toISOString().slice(0,10);
  // Start time + expected return come from the same Date + Time widgets.
  // We use the LOCAL clock so a "14:30" pick means 14:30 in the manager's
  // timezone — new Date("2026-07-12T14:30") is exactly that. Fall back
  // to noon if the field is somehow blank.
  const startStr = document.getElementById('fld_start')?.value || '12:00';
  const startTime = new Date(`${activityDate}T${startStr}`);
  const ret = computeExpectedReturn();
  const expectedReturnAt = ret ? ret.expected : null;
  // opened_at anchors the row's timeline. Use start_time when we have it
  // (real hour the board went out); fall back to noon of the picked date
  // for backwards compat with phase 1 rows.
  const openedAt = isNaN(startTime.getTime())
    ? `${activityDate}T12:00:00.000Z`
    : startTime.toISOString();
  const nowIso = new Date().toISOString();

  btn.disabled = true; btn.textContent = 'Saving…';

  // Revenue linkage is handled server-side by tr_surf_rental_ledger
  // (see supabase/surf-school-rentals-ledger-trigger.sql). The trigger
  // fires BEFORE INSERT, creates the ledger_entries row with the same
  // amount + entry_date + descriptor, and stamps ledger_entry_id on
  // the new rental row atomically. Client no longer does a two-step
  // insert — that path silently produced NULL ledger links in some
  // race + RLS combinations. Trigger is the single source of truth.
  const rentalPayload = {
    location_id: LOCATION_ID,
    kind: CURRENT_KIND,
    student_name: name,
    student_email: email,
    id_card_number: idCard,
    item_id: primaryItem.item_id,
    item_name: itemName,
    qty,
    price_local: price,
    currency,
    payment_method: CURRENT_PAY,
    customer_type: customerType,
    rental_type: rentalType,
    duration,
    items: pickedItems,
    terms_accepted: terms,
    terms_accepted_at: nowIso,
    // Anchor the "board went out at" to the picked Start time so Open
    // rentals sort chronologically by when the rental actually started,
    // not by when staff typed it in.
    opened_at: openedAt,
    start_time: isNaN(startTime.getTime()) ? null : startTime.toISOString(),
    expected_return_at: expectedReturnAt ? expectedReturnAt.toISOString() : null,
    is_returned: CURRENT_KIND !== 'rental',
    closed_at: CURRENT_KIND !== 'rental' ? nowIso : null
  };
  const { error: rentalErr } = await sb.from('surf_school_rentals').insert(rentalPayload);
  if (rentalErr) {
    toast('Ledger saved but rental failed: '+rentalErr.message, 'err');
    btn.disabled = false; btn.textContent = 'Save';
    return;
  }

  toast(`✓ Saved · ${currency} ${price.toFixed(0)}`, 'ok');
  clearForm();
  await loadRentals();
  renderOpen();
  if (CURRENT_KIND === 'rental') showPage('open');
  btn.disabled = false; btn.textContent = 'Save';
}

async function closeRental(id, studentName){
  // Two-step confirm — staff has to type the student's first name to
  // confirm the board is really back. Prevents accidental returns.
  const first = String(studentName || '').trim().split(/\s+/)[0] || '';
  const typed = window.prompt(`Board back from ${studentName}?\n\nType "${first}" to confirm the return.`);
  if (typed === null) return; // cancelled
  if (String(typed).trim().toLowerCase() !== first.toLowerCase()) {
    toast('Name didn\'t match — return cancelled', 'err');
    return;
  }
  const { error } = await sb.from('surf_school_rentals').update({ is_returned: true, closed_at: new Date().toISOString() }).eq('id', id);
  if (error) { toast('Close failed: '+error.message, 'err'); return; }
  toast('✓ Board returned', 'ok');
  await loadRentals();
  renderOpen();
}

async function reopenRental(id, studentName){
  if (!confirm(`Reopen ${studentName}'s rental? (Board goes back to Open)`)) return;
  const { error } = await sb.from('surf_school_rentals').update({ is_returned: false, closed_at: null, closed_by: null }).eq('id', id);
  if (error) { toast('Reopen failed: '+error.message, 'err'); return; }
  toast('✓ Rental reopened', 'ok');
  await loadRentals();
  renderOpen();
}

// ── UI helpers ──────────────────────────────────────────────────
function setKind(k){
  CURRENT_KIND = k;
  document.querySelectorAll('.segment button[data-kind]').forEach(b => b.classList.toggle('active', b.dataset.kind === k));
  document.getElementById('idLbl').textContent = k === 'rental' ? 'ID card (recommended)' : 'ID card (optional)';
  // Show/hide rental-only fields: Customer Type, Rental Type, Duration,
  // and switch between multi-item checkboxes (rental) vs single-item
  // dropdown (lesson / activity).
  const isRental = k === 'rental';
  document.getElementById('custTypeWrap').style.display    = isRental ? '' : 'none';
  document.getElementById('rentalTypeWrap').style.display  = isRental ? '' : 'none';
  document.getElementById('durationWrap').style.display    = isRental ? '' : 'none';
  document.getElementById('rentalItemsWrap').style.display = isRental ? '' : 'none';
  document.getElementById('singleItemWrap').style.display  = isRental ? 'none' : '';
  renderItemPicker();
  if (isRental) recalcRentalTotal();
}
function setRentalType(t){
  CURRENT_RENTAL_TYPE = t;
  document.querySelectorAll('#rentalTypeWrap .segment button').forEach(b => b.classList.toggle('active', b.dataset.rtype === t));
  const isMulti = t === 'Multi-day';
  // Chip grid (hours) hides for Multi-day; stepper (days) hides for Same Day.
  // The hidden <select> and <input type="hidden"> keep their last values so
  // switching back doesn't clobber the user's earlier pick.
  const chipGrid = document.getElementById('durationChips');
  const stepper  = document.getElementById('daysStepperWrap');
  if (chipGrid) chipGrid.style.display = isMulti ? 'none' : '';
  if (stepper)  stepper.style.display  = isMulti ? '' : 'none';
  document.getElementById('durationLbl').textContent = isMulti ? 'How many days?' : 'Duration';
  recalcRentalTotal();
}

// Mobile chip picker: assigns to the hidden <select> so recalc/save keep
// reading .value the same way, fires the native change event to trigger
// any wired onchange, and paints the .active class on the tapped button.
function pickChip(selectId, value){
  const sel = document.getElementById(selectId);
  if (!sel) return;
  sel.value = value;
  sel.dispatchEvent(new Event('change', { bubbles: true }));
  const wrap = sel.closest('.field');
  if (wrap) {
    wrap.querySelectorAll('.chip-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.val === value);
    });
  }
}

// +/− stepper for the Multi-day "How many days?" input. The hidden
// fld_days input remains the source of truth (saveEntry reads .value).
function stepDays(delta){
  const inp = document.getElementById('fld_days');
  if (!inp) return;
  const current = Math.max(1, Number(inp.value) || 1);
  const next = Math.max(1, current + delta);
  inp.value = next;
  const disp = document.getElementById('daysDisplay');
  if (disp) disp.textContent = String(next);
  const minusBtn = document.getElementById('daysMinus');
  if (minusBtn) minusBtn.disabled = next <= 1;
  recalcRentalTotal();
}

// Collapsible for the optional Email + ID Card fields. Default closed so
// the default rental flow is 2 fields shorter; staff taps to reveal.
function toggleContactInfo(){
  const btn = document.getElementById('contactToggle');
  const body = document.getElementById('contactBody');
  const lbl = document.getElementById('contactToggleLbl');
  if (!btn || !body) return;
  const isOpen = body.classList.toggle('open');
  btn.classList.toggle('open', isOpen);
  if (lbl) lbl.textContent = isOpen ? 'Hide contact info' : 'Add contact info (email · ID)';
}
function setPay(p){
  CURRENT_PAY = p;
  document.querySelectorAll('.pay-toggle button').forEach(b => b.classList.toggle('active', b.dataset.pay === p));
}
function showPage(name){
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.getElementById('page-'+name)?.classList.add('active');
  document.querySelectorAll('.tabbtn').forEach(b => b.classList.toggle('active', b.dataset.page === name));
  if (name === 'history') renderHistory();
  if (name === 'open')    renderOpen();
}
function clearForm(){
  document.getElementById('fld_name').value = '';
  document.getElementById('fld_email').value = '';
  document.getElementById('fld_id').value = '';
  document.getElementById('fld_price').value = '';
  document.getElementById('fld_terms').checked = false;
  document.querySelectorAll('.item-cb').forEach(cb => cb.checked = false);
  const cust = document.getElementById('fld_customer_type'); if (cust) cust.value = '';
  const dur = document.getElementById('fld_duration'); if (dur) dur.value = '1H';
  const days = document.getElementById('fld_days'); if (days) days.value = 2;
  // Reset chip active states — customer type back to unpicked, duration
  // back to 1H, rental item back to Board + Wetsuit (the common defaults).
  document.querySelectorAll('#custTypeWrap .chip-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('#durationChips .chip-btn').forEach(b => b.classList.toggle('active', b.dataset.val === '1H'));
  document.querySelectorAll('#rentalItemsWrap .chip-btn').forEach(b => b.classList.toggle('active', b.dataset.val === 'Board + Wetsuit'));
  // Reset combo select to default too so recalcRentalTotal reads the right value.
  const combo = document.getElementById('fld_rental_combo'); if (combo) combo.value = 'Board + Wetsuit';
  // Days stepper display + minus-button disabled state.
  const daysDisp = document.getElementById('daysDisplay'); if (daysDisp) daysDisp.textContent = '2';
  const minus = document.getElementById('daysMinus'); if (minus) minus.disabled = false;
  // Collapse the contact-info block back to its default hidden state.
  const contactBody = document.getElementById('contactBody');
  const contactBtn = document.getElementById('contactToggle');
  const contactLbl = document.getElementById('contactToggleLbl');
  if (contactBody) contactBody.classList.remove('open');
  if (contactBtn) contactBtn.classList.remove('open');
  if (contactLbl) contactLbl.textContent = 'Add contact info (email · ID)';
  // Reset the date + start time back to now so the next entry defaults
  // correctly and the Return-by preview snaps back to something current.
  const now = new Date();
  const pad = (n) => String(n).padStart(2,'0');
  const dfld = document.getElementById('fld_date'); if (dfld) dfld.value = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  const sfld = document.getElementById('fld_start'); if (sfld) sfld.value = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  updateReturnPreview();
}
function showTerms(){
  alert("Rental terms & conditions:\n\n1. Board rented in the condition inspected on pickup.\n2. Renter is responsible for damage / loss until return.\n3. ID retained as collateral until the board comes back.\n4. Total is due at pickup — no refunds for early return.\n\n(Miguel will replace this with the full text.)");
}
function toast(msg, kind){
  const el = document.getElementById('toast');
  el.className = 'toast show ' + (kind||'');
  el.textContent = msg;
  setTimeout(() => el.className = 'toast', 2500);
}

// Realtime — new rentals / returns fire on any device using this page.
function subscribeRealtime(){
  sb.channel('surf-school-rt')
    .on('postgres_changes', { event:'*', schema:'public', table:'surf_school_rentals', filter:`location_id=eq.${LOCATION_ID}` }, async () => {
      await loadRentals();
      // Re-render whichever tab is visible.
      const active = document.querySelector('.page.active')?.id;
      if (active === 'page-open') renderOpen();
      else if (active === 'page-history') renderHistory();
    })
    .subscribe();
}

// Escape helpers.
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escapeAttr(s){return String(s||'').replace(/'/g,"&#39;").replace(/"/g,'&quot;');}

boot();
</script>
