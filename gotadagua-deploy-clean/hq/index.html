<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gota Dagua — HQ</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 3 C10 12 6 17 6 22 a10 10 0 0 0 20 0 C 26 17 22 12 16 3 Z' fill='%231e6fa8'/><path d='M11 20 a5 5 0 0 0 5 5' fill='none' stroke='%23e8f4fd' stroke-width='1.5' stroke-linecap='round'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#28394b;--ocean:#1e6fa8;--foam:#e8f4fd;--ink:#0d1b2a;--muted:#6b8099;--border:#d4e3f0;--bg:#f0f5fa;--green-bg:#eafaf1;--green:#1a7a40;--red-bg:#fdecea;--red:#b91c1c;--amber-bg:#fef3c7;--amber:#92400e;--r:12px;--sh:0 4px 24px rgba(40,57,75,.10)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{background:var(--navy);color:#fff;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,.25)}
.brand-home{display:flex;align-items:center;gap:14px;color:#fff;text-decoration:none;padding:6px 10px;border-radius:8px;transition:background .15s}
.brand-home:hover{background:rgba(255,255,255,.08)}
.brand-logo{display:flex;align-items:center;justify-content:flex-start;width:110px;height:26px;flex-shrink:0}
.brand-logo svg{height:26px;width:auto;display:block}
.brand-sub{font-size:11px;color:#7aabcc;font-weight:700;letter-spacing:.15em;text-transform:uppercase;border-left:1px solid rgba(255,255,255,.15);padding-left:14px}
.back-hint{font-size:11px;color:#7aabcc;margin-right:auto;padding-left:14px}
.user-badge{font-size:12px;color:#bdd4e8;background:rgba(255,255,255,.08);padding:6px 12px;border-radius:20px}
main{max-width:1400px;margin:0 auto;padding:32px 48px}
.gate-screen{max-width:520px;margin:80px auto;background:#fff;border-radius:var(--r);padding:48px;border:1px solid var(--border);box-shadow:var(--sh);text-align:center}
.gate-title{font-family:'DM Serif Display',serif;font-size:28px;color:var(--navy);margin-bottom:12px}
.gate-msg{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:24px}
.gate-btn{background:var(--ocean);color:#fff;border:none;padding:12px 32px;border-radius:8px;font-weight:700;font-family:'Outfit',sans-serif;font-size:14px;cursor:pointer}
.gate-btn:hover{background:var(--navy)}
.tabs{display:flex;gap:4px;margin-bottom:24px;border-bottom:2px solid var(--border);flex-wrap:wrap}
.tab-btn{background:transparent;border:none;padding:12px 20px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:color .18s, border-color .18s}
.tab-btn:hover{color:var(--navy)}
.tab-btn.active{color:var(--ocean);border-bottom-color:var(--ocean)}
.tab-pane{display:none}
.tab-pane.active{display:block}
.card{background:#fff;border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--sh);margin-bottom:28px;overflow:hidden}
.card-hdr{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.card-title{font-family:'DM Serif Display',serif;font-size:20px;color:var(--navy)}
.card-hint{font-size:12px;color:var(--muted)}
.card-body{padding:24px}
textarea{width:100%;min-height:180px;border:1.5px solid var(--border);border-radius:8px;padding:14px;font-family:'DM Mono',monospace;font-size:12px;line-height:1.5;resize:vertical}
textarea:focus{outline:none;border-color:var(--ocean);box-shadow:0 0 0 3px rgba(30,111,168,.1)}
input,select{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-family:'Outfit',sans-serif;font-size:13px;background:#fff}
input:focus,select:focus{outline:none;border-color:var(--ocean);box-shadow:0 0 0 3px rgba(30,111,168,.1)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.form-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.col-3{grid-column:span 3}.col-4{grid-column:span 4}.col-5{grid-column:span 5}.col-6{grid-column:span 6}.col-7{grid-column:span 7}.col-8{grid-column:span 8}.col-12{grid-column:span 12}
@media(max-width:900px){.col-3,.col-4,.col-5,.col-6,.col-7,.col-8{grid-column:span 12}}
.hint{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
.btn{background:var(--ocean);color:#fff;border:none;padding:10px 24px;border-radius:8px;font-weight:700;font-family:'Outfit',sans-serif;font-size:13px;cursor:pointer;transition:background .18s}
.btn:hover{background:var(--navy)}
.btn:disabled{background:var(--muted);cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--ocean);border:1.5px solid var(--ocean)}
.btn-ghost:hover{background:var(--foam);color:var(--navy);border-color:var(--navy)}
.btn-danger{background:var(--red)}
.btn-danger:hover{background:#8f1414}
.btn-row{display:flex;gap:10px;margin-top:14px;align-items:center;flex-wrap:wrap}
.toast{padding:10px 14px;border-radius:8px;font-size:12px;font-weight:600}
.toast-ok{background:var(--green-bg);color:var(--green)}
.toast-err{background:var(--red-bg);color:var(--red)}
.toast-warn{background:var(--amber-bg);color:var(--amber)}
table{width:100%;border-collapse:collapse}
thead{background:var(--navy)}thead th{padding:12px 16px;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#7aabcc;font-weight:600;text-align:left}
thead th.r{text-align:right}
tbody tr{border-bottom:1px solid var(--border)}
tbody tr:last-child{border-bottom:none}
tbody tr.dup{background:#fef3c7}
tbody tr.dup td:first-child::before{content:"⚠ ";color:var(--amber);font-weight:700}
td{padding:12px 16px;font-size:13px;vertical-align:middle}
td.r{text-align:right;font-family:'DM Mono',monospace;font-size:12px}
td.loc-name{font-weight:700;color:var(--navy)}
.pos{color:var(--green);font-weight:700}
.neg{color:var(--red);font-weight:700}
.zero{color:var(--muted)}
.chip{display:inline-block;padding:3px 8px;border-radius:12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.chip-personal{background:#fce7f3;color:#9d174d}
.chip-review{background:var(--amber-bg);color:var(--amber)}
.chip-normal{background:var(--foam);color:var(--ocean)}
.period-row{margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.period-row label{font-size:12px;color:var(--muted);font-weight:600;margin:0;text-transform:none;letter-spacing:0}
.period-row select,.period-row input{padding:8px 12px;font-size:13px;width:auto;min-width:140px}
.loading{padding:60px;text-align:center;color:var(--muted);font-size:14px}
.dup-warn{background:var(--amber-bg);color:var(--amber);padding:10px 14px;border-radius:8px;font-size:12px;font-weight:600;margin-top:12px;display:none}
.dup-warn.show{display:block}
.dup-warn ul{margin:6px 0 0 20px}
.file-link{color:var(--ocean);text-decoration:none;font-weight:600;font-size:12px}
.file-link:hover{text-decoration:underline}
.action-btn{background:transparent;border:none;color:var(--ocean);cursor:pointer;font-size:12px;font-weight:600;padding:4px 8px;border-radius:4px}
.action-btn:hover{background:var(--foam)}
.action-btn.danger{color:var(--red)}
.action-btn.danger:hover{background:var(--red-bg)}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.summary-box{background:var(--foam);border:1px solid var(--border);border-radius:8px;padding:14px}
.summary-lbl{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.summary-val{font-family:'DM Mono',monospace;font-size:20px;font-weight:600;color:var(--navy)}
</style>
</head>

<script>
const cfg = window.__SUPABASE_CONFIG || {};
const sb  = window.supabase.createClient(cfg.url, cfg.anonKey);
const $   = (id) => document.getElementById(id);
const OWNER_EMAILS = new Set(['miguel@gotadaguasurf.com']);

const HQ_LOCATIONS = [
  {slug:'portugal',    label:'Surfcamp PT'},
  {slug:'surf-school', label:'Surf School'},
  {slug:'morocco',     label:'Morocco'},

// ── Boot ────────────────────────────────────────────────────────────
(async () => {
  const { data:{ session }, error } = await sb.auth.getSession();
  if (error || !session) {
    location.href = '/?next=' + encodeURIComponent('/hq/');
    return;
  }
  const { data: profile } = await sb.from('platform_profiles')
    .select('id, email, full_name, platform_role')
    .eq('id', session.user.id).maybeSingle();
  const role = String(profile?.platform_role || '').toLowerCase();
  const myEmail = String(profile?.email || session.user.email || '').toLowerCase();
  CURRENT_USER = profile || {};
  $('userBadge').textContent = profile?.email || session.user.email || '';

  let hasAccess = OWNER_EMAILS.has(myEmail) || role === 'owner' || role === 'super_admin';
  if (!hasAccess) {
    const { data: hqMembership } = await sb
      .from('workspace_memberships')
      .select('workspace_id, can_view, active, workspaces!inner(slug)')
      .eq('user_id', session.user.id)
      .eq('active', true)
      .eq('workspaces.slug', 'hq')
      .maybeSingle();
    hasAccess = !!(hqMembership && hqMembership.can_view);
  }

  if (!hasAccess) {
    $('mainWrap').innerHTML = `
      <div class="gate-screen">
        <div class="gate-title">HQ access needed</div>
        <div class="gate-msg">This area is restricted to teammates that Miguel has enabled the HQ pill for. Ask him to add you in <b>Settings → Team access → HQ (owner view)</b>.</div>

    return;

  // Load reference data in parallel.
  const [locsRes, catsRes] = await Promise.all([
    sb.from('locations').select('id, slug, name, currency').order('name'),
    sb.from('hq_invoice_categories').select('id, name, sort_order, is_personal, active').eq('active', true).order('sort_order')

})();

function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));

  if (name === 'invoices') { renderInvoiceList(); }
}

function wireInvoiceForm(){
  const inpCur = $('inv_currency');
  const inpAmt = $('inv_amount');
  const inpFx  = $('inv_fx');
  const inpEur = $('inv_amount_eur');
  const inpNum = $('inv_number');
  const inpCo  = $('inv_company');

  const recalcEur = () => {
    const amt = Number(inpAmt.value) || 0;
    const fx  = Number(inpFx.value) || 0;
    inpEur.value = fx > 0 ? (amt * fx).toFixed(2) : '';
  };

  const refreshFx = async () => {
    const cur = inpCur.value || 'EUR';
    if (cur === 'EUR') { inpFx.value = '1'; $('fxHint').textContent = '(EUR — 1.000000)'; recalcEur(); return; }
    try {
      const rate = await fetchFxToEur(cur);
      inpFx.value = rate.toFixed(6);
      $('fxHint').textContent = `(auto ${FX_CACHE.date} — editable)`;
    } catch(e) {
      $('fxHint').textContent = '(auto failed — set manually)';
    }
    recalcEur();
  };

  inpCur.addEventListener('change', refreshFx);
  inpAmt.addEventListener('input', recalcEur);
  inpFx.addEventListener('input', recalcEur);

  // Live dedup check as the user fills invoice_number / amount / company.
  const checkDup = debounce(async () => {
    const num = (inpNum.value||'').trim();
    const amt = Number(inpAmt.value)||0;
    const co  = (inpCo.value||'').trim();
    if (!num || !amt || !co) { $('dupWarn').classList.remove('show'); return; }
    const { data } = await sb.from('hq_invoices')
      .select('id, invoice_date, location_slug, amount, currency, company')
      .eq('invoice_number', num).eq('amount', amt)
      .ilike('company', co).limit(5);
    if (!data || !data.length) { $('dupWarn').classList.remove('show'); return; }
    $('dupWarn').innerHTML = `<b>Possible duplicate.</b> A similar invoice is already registered:
      <ul>${data.map(d => `<li>${d.invoice_date} · ${d.company} · ${d.amount} ${d.currency} · ${locLabel(d.location_slug)}</li>`).join('')}</ul>
      Saving will still work — the form only warns.`;
    $('dupWarn').classList.add('show');
  }, 400);
  [inpNum, inpAmt, inpCo].forEach(el => el.addEventListener('input', checkDup));

  refreshFx();
}

async function fetchFxToEur(currency){
  // Frankfurter (ECB) — free, no key. Base=currency, target=EUR.
  // Cache by date so we don't hammer the API mid-session.
  const today = new Date().toISOString().slice(0,10);
  if (FX_CACHE.date === today && FX_CACHE.rates[currency]) return FX_CACHE.rates[currency];
  const url = `https://api.frankfurter.dev/v1/latest?base=${encodeURIComponent(currency)}&symbols=EUR`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('FX fetch failed');
  const j = await res.json();
  const rate = j?.rates?.EUR;
  if (typeof rate !== 'number') throw new Error('FX shape unexpected');
  if (FX_CACHE.date !== today) FX_CACHE = { date: today, rates: { EUR:1 } };
  FX_CACHE.rates[currency] = rate;
  return rate;
}

async function saveInvoice(){
  const btn = $('saveInvBtn');
  btn.disabled = true;

  const catSel = $('inv_category');
  const catOpt = catSel.options[catSel.selectedIndex];

  const location_slug   = $('inv_location').value;
  const invoice_date    = $('inv_date').value;
  const company         = ($('inv_company').value||'').trim();
  const supplier_nif    = ($('inv_nif').value||'').trim() || null;
  const invoice_number  = ($('inv_number').value||'').trim() || null;
  const amount          = Number($('inv_amount').value) || 0;
  const currency        = $('inv_currency').value || 'EUR';
  const fx_rate         = Number($('inv_fx').value) || (currency==='EUR' ? 1 : null);
  const amount_eur      = Number($('inv_amount_eur').value) || (amount * (fx_rate||1));
  const payment_type    = $('inv_payment').value;
  const description     = ($('inv_description').value||'').trim() || null;
  const notes           = ($('inv_notes').value||'').trim() || null;
  const category_id     = catSel.value || null;
  const category_name   = catOpt?.textContent || null;

  if (!location_slug || !invoice_date || !company || !amount || !payment_type || !category_id) {
    toast('invToast','err','Fill in location, date, company, amount, payment type and category');
    btn.disabled = false;
    return;
  }
  if (!fx_rate || fx_rate <= 0) {
    toast('invToast','err','Set an FX rate (or use EUR)');
    btn.disabled = false;
    return;
  }

  // Upload file first, if any.
  let file_url = null, file_name = null, file_mime = null;
  const fileInput = $('inv_file');
  if (fileInput.files && fileInput.files[0]) {
    const f = fileInput.files[0];
    const safe = f.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const key = `${location_slug}/${invoice_date.slice(0,7)}/${Date.now()}_${safe}`;
    const { error: upErr } = await sb.storage.from('hq-invoices').upload(key, f, {
      contentType: f.type || 'application/octet-stream', upsert:false
    });
    if (upErr) { toast('invToast','err','File upload failed: '+upErr.message); btn.disabled = false; return; }
    file_url  = key;
    file_name = f.name;
    file_mime = f.type || null;
  }

  const payload = {
    location_slug, invoice_date, company, supplier_nif, description,
    amount, currency, fx_rate, amount_eur,
    payment_type, invoice_number, category_id, category_name,
    file_url, file_name, file_mime,
    notes,
    created_by: CURRENT_USER?.id || null
  };

  const { error } = await sb.from('hq_invoices').insert(payload);
  if (error) { toast('invToast','err','Save failed: '+error.message); btn.disabled = false; return; }

  toast('invToast','ok','Invoice saved');
  clearInvoiceForm();
  btn.disabled = false;
  renderInvoiceList();
}

function clearInvoiceForm(){
  const today = new Date().toISOString().slice(0,10);
  $('inv_date').value = today;
  ['inv_company','inv_nif','inv_number','inv_amount','inv_amount_eur','inv_description','inv_notes'].forEach(id => $(id).value = '');
  $('inv_currency').value = 'EUR';
  $('inv_fx').value = '1';
  $('fxHint').textContent = '(EUR — 1.000000)';
  $('dupWarn').classList.remove('show');
  const fileInput = $('inv_file');
  if (fileInput) fileInput.value = '';
}

async function renderInvoiceList(){
  const body = $('invListBody');
  if (!body) return;
  const loc = $('filter_location')?.value || '__all__';
  const month = $('filter_month')?.value || '';

  body.innerHTML = `<div class="loading">Loading…</div>`;
  let q = sb.from('hq_invoices')
    .select('id, location_slug, invoice_date, company, description, amount, currency, amount_eur, payment_type, invoice_number, category_name, file_url, file_name, needs_review, is_duplicate, category_id, notes, supplier_nif, fx_rate')
    .order('invoice_date', { ascending:false })
    .limit(500);
  if (loc !== '__all__') q = q.eq('location_slug', loc);
  if (month) {
    const start = `${month}-01`;
    const [y,m] = month.split('-').map(Number);
    const endD = new Date(Date.UTC(y, m, 1)); // first day of next month
    const end = endD.toISOString().slice(0,10);
    q = q.gte('invoice_date', start).lt('invoice_date', end);
  }
  const { data, error } = await q;
  if (error) { body.innerHTML = `<div class="loading" style="color:var(--red)">Load failed: ${error.message}</div>`; return; }
  const rows = data || [];
  const personalCatIds = new Set(CATEGORIES.filter(c => c.is_personal).map(c => c.id));

  const totalCount   = rows.length;
  const totalEur     = rows.reduce((s,r)=>s+Number(r.amount_eur||0), 0);
  const personalEur  = rows.filter(r => personalCatIds.has(r.category_id)).reduce((s,r)=>s+Number(r.amount_eur||0), 0);
  const businessEur  = totalEur - personalEur;

  if (!rows.length) {
    body.innerHTML = `<div class="loading">No invoices yet. Register the first one above.</div>`;
    return;
  }

  // Group by location_slug when "All" is selected. General first, then camps by size.
  const groupsOrder = ['general','portugal','surf-school','morocco','sri-lanka','junior-camp'];
  const grouped = {};
  rows.forEach(r => {
    const k = r.location_slug || 'general';
    if (!grouped[k]) grouped[k] = [];
    grouped[k].push(r);
  });
  const showGrouped = (loc === '__all__');

  const rowHtml = (r) => {
    const isPersonal = personalCatIds.has(r.category_id);
    return `<tr class="${r.is_duplicate?'dup':''}">
      <td>${r.invoice_date}</td>
      <td class="loc-name">${locLabel(r.location_slug)}</td>
      <td>${escapeHtml(r.company||'')}${r.description?`<br><span style="font-size:11px;color:var(--muted)">${escapeHtml(r.description)}</span>`:''}</td>
      <td>${escapeHtml(r.category_name||'')} ${isPersonal?'<span class="chip chip-personal">personal</span>':''} ${r.needs_review?'<span class="chip chip-review">review</span>':''}</td>
      <td style="font-family:'DM Mono',monospace;font-size:11px">${escapeHtml(r.invoice_number||'—')}</td>
      <td class="r">${Number(r.amount).toFixed(2)} ${r.currency}</td>
      <td class="r">${eur(r.amount_eur)}</td>
      <td>${escapeHtml(r.payment_type||'')}</td>

      <b>General HQ</b> = despesas que pertencem à empresa como um todo (contabilidade, seguros globais, software…).<br>

async function deleteInvoice(id){
  if (!confirm('Delete this invoice permanently?')) return;
  // Fetch first to get file_url so we can delete the attachment too.
  const { data: row } = await sb.from('hq_invoices').select('file_url').eq('id', id).maybeSingle();

  if (row?.file_url) { await sb.storage.from('hq-invoices').remove([row.file_url]); }
  renderInvoiceList();
}

//   EXCEL HISTORY IMPORT (master file with 11 columns)
// ═══════════════════════════════════════════════════════════════════
const EXCEL_LOCATION_MAP = {
  'surfcamp pt':'portugal', 'surfcamppt':'portugal', 'portugal':'portugal',
  'morocco':'morocco', 'morroco':'morocco',  // user's spelling in the sheet
  'surfschool':'surf-school', 'surf school':'surf-school', 'surf-school':'surf-school',
  'sri lanka':'sri-lanka', 'srilanka':'sri-lanka', 'sri-lanka':'sri-lanka',
  'junior camp':'junior-camp', 'juniorcamp':'junior-camp', 'junior-camp':'junior-camp',
  'general':'general', 'hq':'general'
};
const EXCEL_CATEGORY_FIXES = {
  'utulities':'Utilities'   // known typo
};

function parseExcelAmount(cell){
  if (!cell) return null;
  // Strip €, spaces, thousands commas (European "€2,232.07" uses . decimal + , thousands)
  const s = String(cell).replace(/€/g,'').replace(/\s/g,'').replace(/,/g, (m, i, all) => {
    // Ambiguity: comma could be decimal separator in some locales. In Miguel's sheet,
    // format is always €X,XXX.XX so comma = thousands. Strip all commas.
    return '';
  });
  const n = Number(s);
  return isNaN(n) ? null : n;
}

function parseExcelDate(cell){
  // Expected DD/MM/YYYY. Return YYYY-MM-DD or null.
  const s = String(cell||'').trim();
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return null;
  const [_, d, mo, y] = m;
  return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

// CSV row splitter that honors "quoted, cells" — the sheet exports amounts like
// "€2,232.07" wrapped in quotes because of the internal comma.
function splitCsvRow(line){
  const out = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (inQ && line[i+1] === '"') { cur += '"'; i++; }
      else inQ = !inQ;
    } else if (ch === ',' && !inQ) {
      out.push(cur); cur = '';
    } else {
      cur += ch;
    }
  }
  out.push(cur);
  return out.map(c => c.trim());
}

async function previewExcel(){
  const raw = ($('excelBox').value || '').trim();
  const preview = $('excelPreview');
  if (!raw) { preview.innerHTML = '<div class="toast toast-err">Paste your CSV first</div>'; return; }

  const lines = raw.split(/\r?\n/).filter(l => l.trim().length);
  if (lines.length < 2) { preview.innerHTML = '<div class="toast toast-err">Need header + at least one data row</div>'; return; }

  const header = splitCsvRow(lines[0]).map(h => h.toLowerCase());
  const idx = {
    location:    header.findIndex(h => h.includes('location')),
    date:        header.findIndex(h => h.includes('invoice date') || h === 'date'),
    company:     header.findIndex(h => h.includes('company')),
    description: header.findIndex(h => h.includes('description')),
    nif:         header.findIndex(h => h.includes('tax reg') || h === 'nif'),
    amount:      header.findIndex(h => h === 'amount'),
    currency:    header.findIndex(h => h.includes('currency')),
    payment:     header.findIndex(h => h.includes('payment')),
    invnum:      header.findIndex(h => h.includes('invoice number')),
    category:    header.findIndex(h => h === 'category'),
    dup:         header.findIndex(h => h.includes('duplicate'))
  };
  const missing = ['location','date','company','amount','payment','category'].filter(k => idx[k] < 0);
  if (missing.length) {
    preview.innerHTML = `<div class="toast toast-err">Header missing required columns: ${missing.join(', ')}</div>`;
    return;
  }

  const catByName = new Map(CATEGORIES.map(c => [c.name.toLowerCase(), c]));
  const applyCatFix = (raw) => {
    const key = String(raw||'').trim().toLowerCase();
    const fixed = EXCEL_CATEGORY_FIXES[key] || raw;
    return String(fixed||'').trim();
  };

  const rows = [];
  const errors = [];
  for (let i = 1; i < lines.length; i++) {
    const cells = splitCsvRow(lines[i]);
    if (cells.length < 3) continue;
    const rowNum = i + 1;
    const rawLoc = (cells[idx.location]||'').trim();
    const rawDate = (cells[idx.date]||'').trim();
    const rawAmt = (cells[idx.amount]||'').trim();
    const rawCat = applyCatFix(cells[idx.category]);

    const location_slug = EXCEL_LOCATION_MAP[rawLoc.toLowerCase()];
    const invoice_date  = parseExcelDate(rawDate);
    const amount        = parseExcelAmount(rawAmt);
    const category      = catByName.get(String(rawCat).toLowerCase());
    const rowErrors = [];
    if (!location_slug) rowErrors.push(`unknown location "${rawLoc}"`);
    if (!invoice_date)  rowErrors.push(`bad date "${rawDate}"`);
    if (!amount || amount <= 0) rowErrors.push(`bad amount "${rawAmt}"`);
    if (!category)      rowErrors.push(`unknown category "${rawCat}"`);

    const currency = (idx.currency >= 0 && cells[idx.currency]) ? String(cells[idx.currency]).trim().toUpperCase() : 'EUR';
    const fx_rate = currency === 'EUR' ? 1 : null;
    const record = {
      _row: rowNum,
      _errors: rowErrors,
      location_slug: location_slug || null,
      invoice_date: invoice_date || null,
      company: (cells[idx.company]||'').trim(),
      description: idx.description >= 0 ? (cells[idx.description]||'').trim() || null : null,
      supplier_nif: idx.nif >= 0 ? (cells[idx.nif]||'').trim() || null : null,
      amount: amount || 0,
      currency: currency || 'EUR',
      fx_rate,
      amount_eur: currency === 'EUR' ? (amount||0) : null,
      payment_type: mapPaymentType((cells[idx.payment]||'').trim()),
      invoice_number: idx.invnum >= 0 ? (cells[idx.invnum]||'').trim() || null : null,
      category_id: category?.id || null,
      category_name: category?.name || rawCat || null,
      needs_review: idx.dup >= 0 ? String(cells[idx.dup]||'').trim().toUpperCase() === 'TRUE' : false
    };
    if (currency !== 'EUR') rowErrors.push(`non-EUR row (${currency}) needs manual FX — skipped`);
    rows.push(record);
    if (rowErrors.length) errors.push({row: rowNum, errors: rowErrors, company: record.company});
  }

  // Dedup against existing DB rows. Key: invoice_number + amount + company + date.
  // Fetch existing signatures once and compare in-memory (fast for a few hundred rows).
  const validRows = rows.filter(r => !r._errors.length);
  const { data: existing } = await sb.from('hq_invoices')
    .select('invoice_number, amount, company, invoice_date');
  const existingKeys = new Set((existing||[]).map(r => sigKey(r)));

  const dupRows = [];
  const newRows = [];
  for (const r of validRows) {
    if (existingKeys.has(sigKey(r))) dupRows.push(r);
    else newRows.push(r);
  }

  window.__excelImportBuffer = newRows;   // for the Import step

  preview.innerHTML = `
    <div class="summary-grid">
      <div class="summary-box"><div class="summary-lbl">Rows parsed</div><div class="summary-val">${rows.length}</div></div>
      <div class="summary-box" style="border-left:4px solid var(--green)"><div class="summary-lbl">New to import</div><div class="summary-val">${newRows.length}</div></div>
      <div class="summary-box" style="border-left:4px solid var(--amber)"><div class="summary-lbl">Skipped (already in DB)</div><div class="summary-val">${dupRows.length}</div></div>
      <div class="summary-box" style="border-left:4px solid var(--red)"><div class="summary-lbl">Errors</div><div class="summary-val">${errors.length}</div></div>
    </div>

    ${errors.length ? `
      <div class="toast toast-warn" style="margin-bottom:14px"><b>${errors.length} row(s) with errors — will be skipped:</b>
        <ul style="margin-top:6px;margin-left:20px;font-weight:400;line-height:1.7">
          ${errors.slice(0, 20).map(e => `<li>Row ${e.row} (${escapeHtml(e.company||'?')}): ${e.errors.join(' · ')}</li>`).join('')}
          ${errors.length > 20 ? `<li>… and ${errors.length - 20} more</li>` : ''}
        </ul>
      </div>` : ''}

    <div style="overflow-x:auto;max-height:380px;overflow-y:auto;border:1px solid var(--border);border-radius:8px">
      <table style="min-width:900px">
        <thead style="position:sticky;top:0"><tr>
          <th>#</th><th>Date</th><th>Location</th><th>Company</th><th>Category</th>
          <th class="r">Amount</th><th>Pay</th><th>Inv #</th><th>Status</th>
        </tr></thead>
        <tbody>
          ${newRows.slice(0, 40).map(r => `<tr>
            <td>${r._row}</td><td>${r.invoice_date}</td><td>${locLabel(r.location_slug)}</td>
            <td>${escapeHtml(r.company)}</td><td>${escapeHtml(r.category_name)}</td>
            <td class="r">${r.amount.toFixed(2)} ${r.currency}</td>
            <td>${escapeHtml(r.payment_type||'')}</td><td style="font-family:'DM Mono',monospace;font-size:11px">${escapeHtml(r.invoice_number||'—')}</td>
            <td><span class="chip chip-normal">new</span></td>
          </tr>`).join('')}
          ${newRows.length > 40 ? `<tr><td colspan="9" style="text-align:center;color:var(--muted);font-style:italic">… and ${newRows.length - 40} more rows to import</td></tr>` : ''}
        </tbody>
      </table>
    </div>

    <div class="btn-row" style="margin-top:16px">
      <button class="btn" onclick="commitExcelImport()" ${newRows.length ? '' : 'disabled'}>Import ${newRows.length} new row(s)</button>
      <button class="btn btn-ghost" onclick="$('excelPreview').innerHTML=''">Cancel</button>
    </div>
    <div class="hint" style="margin-top:8px">Non-EUR rows are skipped in this pass — add them manually via the Despesas HQ form so you can set the FX rate correctly.</div>
  `;
}

function sigKey(r){
  const num = String(r.invoice_number||'').trim().toLowerCase();
  const co  = String(r.company||'').trim().toLowerCase();
  const amt = Number(r.amount||0).toFixed(2);
  const dt  = String(r.invoice_date||'').trim();
  return `${num}|${amt}|${co}|${dt}`;
}

function mapPaymentType(raw){
  const s = String(raw||'').trim().toLowerCase();
  if (s.includes('bank') || s.includes('transfer')) return 'Bank Transfer';
  if (s.includes('card')) return 'Card';
  if (s.includes('cash')) return 'Cash';
  return 'Other';
}

async function commitExcelImport(){
  const rows = window.__excelImportBuffer || [];
  if (!rows.length) { toast('excelToast','err','Nothing to import — run Preview first'); return; }

  // Strip internal preview keys, add created_by, batch insert.
  const clean = rows.map(r => {
    const { _row, _errors, ...rest } = r;
    return { ...rest, created_by: CURRENT_USER?.id || null };
  });

  const BATCH = 100;
  let inserted = 0;
  for (let i = 0; i < clean.length; i += BATCH) {
    const chunk = clean.slice(i, i + BATCH);
    const { error } = await sb.from('hq_invoices').insert(chunk);
    if (error) {
      toast('excelToast','err',`Failed at row batch ${i}-${i+chunk.length}: ${error.message}`);
      return;
    }
    inserted += chunk.length;
  }
  window.__excelImportBuffer = [];
  toast('excelToast','ok',`Imported ${inserted} row(s)`);
  $('excelPreview').innerHTML = `<div class="toast toast-ok" style="margin-top:12px">Import complete · ${inserted} row(s) added to Despesas HQ.</div>`;
  renderInvoiceList();
  renderOverview();
}

async function importCsv(){
  const raw = ($('csvBox').value || '').trim();
  if (!raw) { toast('importToast','err','Paste some CSV first'); return; }
  const rows = parseCsv(raw);
  if (!rows.length) { toast('importToast','err','No valid rows parsed'); return; }
  const locBySlug = new Map(LOCATIONS.map(l => [String(l.slug||'').toLowerCase(), l.id]));
  const locByName = new Map(LOCATIONS.map(l => [String(l.name||'').toLowerCase(), l.id]));
  const resolved = [];
  const dropped  = [];
  for (const r of rows) {
    const key = String(r.location||'').toLowerCase();
    const location_id = locBySlug.get(key) || locByName.get(key);
    if (!location_id) { dropped.push(r.location); continue; }
    resolved.push({
      location_id, period_ym: r.period, category: r.category,
      amount_eur: Number(r.amount_eur) || 0,
      bookings_count: Number(r.bookings) || 0,
      guests_count: Number(r.guests) || 0,
      imported_by: CURRENT_USER?.id || null
    });
  }
  if (!resolved.length) { toast('importToast','err','No rows matched a known location. Dropped: '+dropped.join(', ')); return; }
  const { error } = await sb.from('bookinglayer_revenue')
    .upsert(resolved, { onConflict: 'location_id,period_ym,category' });
  if (error) { toast('importToast','err','Import failed: '+error.message); return; }
  toast('importToast','ok', `Imported ${resolved.length} rows${dropped.length?` (dropped ${dropped.length} with unknown location)`:''}`);
}

function parseCsv(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if (!lines.length) return [];
  const first = lines[0].toLowerCase();
  const hasHeader = first.includes('location') && first.includes('period');
  const start = hasHeader ? 1 : 0;
  const out = [];
  for (let i = start; i < lines.length; i++) {
    const cells = lines[i].split(',').map(c => c.trim());
    if (cells.length < 4) continue;
    out.push({
      location: cells[0], period: cells[1],
      category: String(cells[2]||'').toLowerCase(),
      amount_eur: cells[3], bookings: cells[4] || 0, guests: cells[5] || 0
    });
  }
  return out;
}

function currentMonth(){

  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`;
}

async function renderProfit(){
  const period = $('periodSelect')?.value || currentMonth();
  const isAll  = period === '__all__';
  $('profitBody').innerHTML = `<div class="loading">Loading…</div>`;

  let blQ = sb.from('bookinglayer_revenue').select('location_id, category, amount_eur, period_ym');
  if (!isAll) blQ = blQ.eq('period_ym', period);
  const { data: blRows } = await blQ;

  const { data: lgRows } = await sb.from('ledger_entries')
    .select('type, amount_eur, entry_date, business_area, category, paid_from, attributed_location, location_id');

  const inPeriod = (d) => isAll || String(d||'').slice(0,7) === period;

  // NEW: HQ invoices contribute to expenses. Skip personal ones.
  let hqQ = sb.from('hq_invoices').select('location_slug, amount_eur, invoice_date, category_id');
  const { data: hqRows } = await hqQ;
  const personalCatIds = new Set(CATEGORIES.filter(c => c.is_personal).map(c => c.id));

  const locIdToSlug = new Map(LOCATIONS.map(l => [l.id, l.slug]));
  const attribOf = (r) => {
    if (r.attributed_location) return r.attributed_location;
    return locIdToSlug.get(r.location_id) || 'unknown';
  };

  const byLoc = {};
  const ensureLoc = (key) => { if (!byLoc[key]) byLoc[key] = {slug:key, blRev:0, localRev:0, expenses:0, hqExpenses:0}; return byLoc[key]; };
  HQ_LOCATIONS.forEach(l => ensureLoc(l.slug));

  (blRows||[]).forEach(r => {
    const slug = locIdToSlug.get(r.location_id);
    if (!slug) return;
    ensureLoc(slug).blRev += Number(r.amount_eur||0);
  });
  (lgRows||[]).forEach(r => {
    if (!inPeriod(r.entry_date)) return;
    const key = attribOf(r);
    const row = ensureLoc(key);
    const amt = Number(r.amount_eur||0);
    if (r.type === 'revenue') row.localRev += amt;
    else if (r.type === 'expense') row.expenses += amt;
  });
  (hqRows||[]).forEach(r => {
    if (!inPeriod(r.invoice_date)) return;
    if (personalCatIds.has(r.category_id)) return;   // exclude Miguel-Personal
    const key = r.location_slug || 'general';
    ensureLoc(key).hqExpenses += Number(r.amount_eur||0);
  });

  const rows = Object.values(byLoc).map(r => ({
    ...r,
    label: locLabel(r.slug),
    totalRev: r.blRev + r.localRev,
    totalExp: r.expenses + r.hqExpenses,
    profit: r.blRev + r.localRev - r.expenses - r.hqExpenses
  }));
  rows.sort((a,b) => {
    if (a.slug === 'general') return 1;
    if (b.slug === 'general') return -1;
    return Math.abs(b.profit) - Math.abs(a.profit);
  });

  const totBl = rows.reduce((s,r)=>s+r.blRev,0);
  const totLR = rows.reduce((s,r)=>s+r.localRev,0);
  const totLE = rows.reduce((s,r)=>s+r.expenses,0);
  const totHE = rows.reduce((s,r)=>s+r.hqExpenses,0);
  const totPF = totBl + totLR - totLE - totHE;

  $('profitBody').innerHTML = `
    <div style="overflow-x:auto"><table>
      <thead><tr>
        <th>Location</th>
        <th class="r">Bookinglayer</th>
        <th class="r">On-site rev</th>
        <th class="r">Local expenses</th>
        <th class="r">HQ invoices</th>
        <th class="r">Profit</th>
      </tr></thead>
      <tbody>
        ${rows.map(r => `<tr>
          <td class="loc-name">${r.label}</td>
          <td class="r">${eur(r.blRev)}</td>
          <td class="r">${eur(r.localRev)}</td>
          <td class="r">${eur(r.expenses)}</td>
          <td class="r">${eur(r.hqExpenses)}</td>
          <td class="r ${r.profit>0?'pos':r.profit<0?'neg':'zero'}">${r.profit>=0?'+':''}${eur(r.profit)}</td>
        </tr>`).join('')}
        <tr style="background:var(--foam);font-weight:700">
          <td class="loc-name">Total</td>
          <td class="r">${eur(totBl)}</td>
          <td class="r">${eur(totLR)}</td>
          <td class="r">${eur(totLE)}</td>
          <td class="r">${eur(totHE)}</td>
          <td class="r ${totPF>0?'pos':totPF<0?'neg':'zero'}">${totPF>=0?'+':''}${eur(totPF)}</td>
        </tr>
      </tbody>
    </table></div>
    <div class="hint" style="margin-top:14px">
      <b>Profit</b> = Bookinglayer + on-site revenue − local ledger expenses − HQ invoices attributed to this location.
      <br><b>HQ invoices</b> come from the Invoices tab. Rows in category <b>Miguel — Personal</b> are excluded.
      <br>Local expenses use <code>attributed_location</code> when set — otherwise fall back to the row's own location.
    </div>
  `;
}

// ── Utilities ───────────────────────────────────────────────────────
function locLabel(slug){
  const hq = HQ_LOCATIONS.find(x => x.slug === slug);
  if (hq) return hq.label;
  const l = LOCATIONS.find(x => x.slug === slug);
  return l?.name || slug || '—';
}
function eur(n){
  const v = Number(n||0);
  return '€' + v.toLocaleString('en-GB', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function toast(id, kind, msg){
  const el = $(id);
  if (!el) return;
  el.className = 'toast toast-'+(kind==='ok'?'ok':kind==='warn'?'warn':'err');
  el.textContent = msg;
  setTimeout(()=>{ el.className=''; el.textContent=''; }, 6000);
}
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function debounce(fn, ms){
  let t; return function(...a){ clearTimeout(t); t = setTimeout(()=>fn.apply(this,a), ms); };
}
</script>
</body></html>
