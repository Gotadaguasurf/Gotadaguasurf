<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gota Dagua — HQ</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 3 C10 12 6 17 6 22 a10 10 0 0 0 20 0 C 26 17 22 12 16 3 Z' fill='%231e6fa8'/><path d='M11 20 a5 5 0 0 0 5 5' fill='none' stroke='%23e8f4fd' stroke-width='1.5' stroke-linecap='round'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#28394b;--ocean:#1e6fa8;--foam:#e8f4fd;--ink:#0d1b2a;--muted:#6b8099;--border:#d4e3f0;--bg:#f0f5fa;--green-bg:#eafaf1;--green:#1a7a40;--red-bg:#fdecea;--red:#b91c1c;--amber-bg:#fef3c7;--amber:#92400e;--r:12px;--sh:0 4px 24px rgba(40,57,75,.10)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{background:var(--navy);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,.25);gap:20px}
.header-left{display:flex;align-items:center;gap:16px;min-width:220px}
.brand-home{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
.brand-lockup{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{display:flex;align-items:center;justify-content:flex-start;width:134px;height:30px;flex-shrink:0}
.brand-logo svg{height:30px;width:auto;display:block}
.header-sub{font-size:10px;color:#7aabcc;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.header-center{display:flex;align-items:center;justify-content:center;gap:4px;flex:1;min-width:0}
.header-right{display:flex;align-items:center;gap:12px;flex-shrink:0;justify-content:flex-end;min-width:220px}
.nav-tabs{display:flex;gap:3px;align-items:center;flex-wrap:wrap;justify-content:center}
.nav-tab{padding:7px 14px;font-size:12px;font-weight:700;color:#7aabcc;cursor:pointer;border:none;border-radius:8px;background:transparent;transition:all .2s;font-family:'Outfit',sans-serif;white-space:nowrap}
.nav-tab:hover{color:#fff;background:rgba(255,255,255,.08)}
.nav-tab.active{color:#fff;background:var(--ocean)}
.user-badge{font-size:12px;color:#bdd4e8;background:rgba(255,255,255,.08);padding:6px 12px;border-radius:20px}
@media(max-width:900px){
  header{height:auto;padding:12px 20px;flex-wrap:wrap}
  .header-left,.header-right{min-width:0;width:100%;justify-content:space-between}
  .header-center{width:100%;order:3}
}
main{max-width:1400px;margin:0 auto;padding:32px 48px}
.gate-screen{max-width:520px;margin:80px auto;background:#fff;border-radius:var(--r);padding:48px;border:1px solid var(--border);box-shadow:var(--sh);text-align:center}
.gate-title{font-family:'DM Serif Display',serif;font-size:28px;color:var(--navy);margin-bottom:12px}
.gate-msg{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:24px}
.gate-btn{background:var(--ocean);color:#fff;border:none;padding:12px 32px;border-radius:8px;font-weight:700;font-family:'Outfit',sans-serif;font-size:14px;cursor:pointer}
.gate-btn:hover{background:var(--navy)}
.tab-pane{display:none}
.tab-pane.active{display:block}
.card{background:#fff;border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--sh);margin-bottom:28px;overflow:hidden}
.card-hdr{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.card-title{font-family:'DM Serif Display',serif;font-size:20px;color:var(--navy)}
.card-hint{font-size:12px;color:var(--muted)}
.card-body{padding:24px}
textarea{width:100%;min-height:180px;border:1.5px solid var(--border);border-radius:8px;padding:14px;font-family:'DM Mono',monospace;font-size:12px;line-height:1.5;resize:vertical}
textarea:focus{outline:none;border-color:var(--ocean);box-shadow:0 0 0 3px rgba(30,111,168,.1)}
input,select{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-family:'Outfit',sans-serif;font-size:13px;background:#fff}
input:focus,select:focus{outline:none;border-color:var(--ocean);box-shadow:0 0 0 3px rgba(30,111,168,.1)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.form-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.col-3{grid-column:span 3}.col-4{grid-column:span 4}.col-5{grid-column:span 5}.col-6{grid-column:span 6}.col-7{grid-column:span 7}.col-8{grid-column:span 8}.col-12{grid-column:span 12}
@media(max-width:900px){.col-3,.col-4,.col-5,.col-6,.col-7,.col-8{grid-column:span 12}}
.manual-row{display:grid;gap:8px;align-items:end;
  grid-template-columns:minmax(120px,1.1fr) minmax(120px,1fr) minmax(160px,1.8fr) minmax(80px,0.7fr) minmax(56px,0.5fr) minmax(130px,1.1fr) minmax(90px,0.8fr) auto}
.manual-row .field{gap:4px}
.manual-row .field label{font-size:10px}
.manual-row .field input,.manual-row .field select{padding:8px 10px;font-size:13px}
@media(max-width:1100px){.manual-row{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.manual-row{grid-template-columns:1fr}}
.hint{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
.btn{background:var(--ocean);color:#fff;border:none;padding:10px 24px;border-radius:8px;font-weight:700;font-family:'Outfit',sans-serif;font-size:13px;cursor:pointer;transition:background .18s}
.btn:hover{background:var(--navy)}
.btn:disabled{background:var(--muted);cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--ocean);border:1.5px solid var(--ocean)}
.btn-ghost:hover{background:var(--foam);color:var(--navy);border-color:var(--navy)}
.btn-danger{background:var(--red)}
.btn-danger:hover{background:#8f1414}
.btn-row{display:flex;gap:10px;margin-top:14px;align-items:center;flex-wrap:wrap}
.toast{padding:10px 14px;border-radius:8px;font-size:12px;font-weight:600}
.toast-ok{background:var(--green-bg);color:var(--green)}
.toast-err{background:var(--red-bg);color:var(--red)}
.toast-warn{background:var(--amber-bg);color:var(--amber)}
table{width:100%;border-collapse:collapse}
thead{background:var(--navy)}thead th{padding:12px 16px;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#7aabcc;font-weight:600;text-align:left}
thead th.r{text-align:right}
tbody tr{border-bottom:1px solid var(--border)}
tbody tr:last-child{border-bottom:none}
tbody tr.dup{background:#fef3c7}
tbody tr.dup td:first-child::before{content:"⚠ ";color:var(--amber);font-weight:700}
td{padding:12px 16px;font-size:13px;vertical-align:middle}
td.r{text-align:right;font-family:'DM Mono',monospace;font-size:12px}
td.loc-name{font-weight:700;color:var(--navy)}
.pos{color:var(--green);font-weight:700}
.neg{color:var(--red);font-weight:700}
.zero{color:var(--muted)}
.chip{display:inline-block;padding:3px 8px;border-radius:12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.chip-personal{background:#fce7f3;color:#9d174d}
.chip-review{background:var(--amber-bg);color:var(--amber)}
.chip-normal{background:var(--foam);color:var(--ocean)}
.period-row{margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.period-row label{font-size:12px;color:var(--muted);font-weight:600;margin:0;text-transform:none;letter-spacing:0}
.period-row select,.period-row input{padding:8px 12px;font-size:13px;width:auto;min-width:140px}
.loading{padding:60px;text-align:center;color:var(--muted);font-size:14px}
.dup-warn{background:var(--amber-bg);color:var(--amber);padding:10px 14px;border-radius:8px;font-size:12px;font-weight:600;margin-top:12px;display:none}
.dup-warn.show{display:block}
.dup-warn ul{margin:6px 0 0 20px}
.file-link{color:var(--ocean);text-decoration:none;font-weight:600;font-size:12px}
.file-link:hover{text-decoration:underline}
.action-btn{background:transparent;border:none;color:var(--ocean);cursor:pointer;font-size:12px;font-weight:600;padding:4px 8px;border-radius:4px}
.action-btn:hover{background:var(--foam)}
.action-btn.danger{color:var(--red)}
.action-btn.danger:hover{background:var(--red-bg)}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.summary-box{background:var(--foam);border:1px solid var(--border);border-radius:8px;padding:14px}
.summary-lbl{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.summary-val{font-family:'DM Mono',monospace;font-size:20px;font-weight:600;color:var(--navy)}
</style>
</head>

<script>
const cfg = window.__SUPABASE_CONFIG || {};
const sb  = window.supabase.createClient(cfg.url, cfg.anonKey);
const $   = (id) => document.getElementById(id);
const OWNER_EMAILS = new Set(['miguel@gotadaguasurf.com']);

const HQ_LOCATIONS = [
  {slug:'portugal',    label:'Surfcamp PT'},
  {slug:'surf-school', label:'Surf School'},
  {slug:'junior-camp', label:'Junior Camp'},
  {slug:'kids-camp',   label:'Kids Camp'},
  {slug:'morocco',     label:'Morocco'},
  {slug:'sri-lanka',   label:'Sri Lanka'},
  {slug:'general',     label:'General (HQ)'},
];
const PAYMENT_TYPES = ['Cash','Card','Bank Transfer','Other'];

// Legal entities that actually pay invoices. covers_locations mirrors the
// public.hq_companies table — if you add a location, update BOTH here and
// there (or query hq_companies at boot; kept as constant for simplicity).
const HQ_COMPANIES = [
  {slug:'water-movements', label:'Water Movements Lda', covers:['portugal','surf-school','junior-camp','kids-camp','general']},
  {slug:'mgrp-sarl',       label:'MGRP Sarl',           covers:['morocco']},
  {slug:'wave-movements',  label:'Wave Movements',      covers:['sri-lanka']},
];
const payingCompanyFor = (locationSlug) => {
  const c = HQ_COMPANIES.find(x => x.covers.includes(locationSlug));
  return c ? c.slug : 'water-movements';   // default fallback so nothing saves null
};
const companyLabel = (slug) => (HQ_COMPANIES.find(c => c.slug === slug)?.label) || slug || '—';

let CURRENT_USER = null;
let LOCATIONS    = [];     // from public.locations (BL revenue join)
let CATEGORIES   = [];     // from hq_invoice_categories
let FX_CACHE     = { date:null, rates:{ EUR:1 } };

// Supabase caps .select() at 1000 rows per request by default. Any table
// that can grow past that (bookings, hq_invoices, ledger_entries) MUST be
// fetched with pagination — otherwise numbers silently truncate. This
// mirrors fetchAllBookings() in /partners/index.html.
async function fetchAllPaged(build){
  const PAGE = 1000;
  let all = [];
  let from = 0;
  for (;;) {
    const { data, error } = await build().range(from, from + PAGE - 1);
    if (error) throw error;
    if (!data || !data.length) break;
    all = all.concat(data);
    if (data.length < PAGE) break;
    from += PAGE;
  }
  return all;
}

// ── Boot ────────────────────────────────────────────────────────────
(async () => {
  const { data:{ session }, error } = await sb.auth.getSession();
  if (error || !session) {
    location.href = '/?next=' + encodeURIComponent('/hq/');
    return;
  }
  const { data: profile } = await sb.from('platform_profiles')
    .select('id, email, full_name, platform_role')
    .eq('id', session.user.id).maybeSingle();
  const role = String(profile?.platform_role || '').toLowerCase();
  const myEmail = String(profile?.email || session.user.email || '').toLowerCase();
  CURRENT_USER = profile || {};
  $('userBadge').textContent = profile?.email || session.user.email || '';

  let hasAccess = OWNER_EMAILS.has(myEmail) || role === 'owner' || role === 'super_admin';
  if (!hasAccess) {
    const { data: hqMembership } = await sb
      .from('workspace_memberships')
      .select('workspace_id, can_view, active, workspaces!inner(slug)')
      .eq('user_id', session.user.id)
      .eq('active', true)
      .eq('workspaces.slug', 'hq')
      .maybeSingle();
    hasAccess = !!(hqMembership && hqMembership.can_view);
  }

  if (!hasAccess) {
    $('mainWrap').innerHTML = `
      <div class="gate-screen">
        <div class="gate-title">HQ access needed</div>
        <div class="gate-msg">This area is restricted to teammates that Miguel has enabled the HQ pill for. Ask him to add you in <b>Settings → Team access → HQ (owner view)</b>.</div>
        <button class="gate-btn" onclick="location.href='/'">Back to camp hub</button>
      </div>`;
    return;
  }

  // Load reference data in parallel.
  const [locsRes, catsRes] = await Promise.all([
    sb.from('locations').select('id, slug, name, currency').order('name'),
    sb.from('hq_invoice_categories').select('id, name, sort_order, is_personal, active').eq('active', true).order('sort_order')
  ]);
  LOCATIONS  = locsRes.data || [];
  CATEGORIES = catsRes.data || [];

  render();
})();

}

function switchTab(name){
  document.querySelectorAll('.nav-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.id === 'tab-'+name));
  if (name === 'profit')   { populatePeriods().then(renderProfit); }
  if (name === 'overview') { renderOverview(); }
  if (name === 'invoices') { renderInvoiceList(); }
  if (name === 'cashflow') { renderCashflow(); }
}

function overviewTabHtml(){

async function renderOverview(){
  const kpiBody = $('blKpiBody');
  const body    = $('overviewBody');
  if (!body || !kpiBody) return;

  // ── Populate period dropdown from bookings.month_key + hq_invoices dates ──
  const perSel = $('ov_period');
  if (perSel && perSel.options.length <= 1) {
    const [bkMonths, invMonths] = await Promise.all([
      fetchAllPaged(() => sb.from('bookings').select('month_key').order('check_in_on', {ascending:false})),
      fetchAllPaged(() => sb.from('hq_invoices').select('invoice_date').order('invoice_date', {ascending:false}))
    ]);
    const set = new Set();
    bkMonths.forEach(r => r.month_key && set.add(r.month_key));
    invMonths.forEach(r => r.invoice_date && set.add(String(r.invoice_date).slice(0,7)));
    const months = [...set].sort().reverse();
    const cur = perSel.value;
    perSel.innerHTML = '<option value="__all__">All-time</option>' +
      months.map(m => `<option value="${m}" ${cur===m?'selected':''}>${m}</option>`).join('');
  }

  const period = perSel?.value || '__all__';
  const isAll  = period === '__all__';

  kpiBody.innerHTML = `<div class="loading">Loading bookings…</div>`;
  body.innerHTML    = `<div class="loading">Loading…</div>`;

  // ── Fetch data (paginated — Supabase caps at 1000 per request) ─────
  const [bkRows, invRowsAll, lgRowsAll] = await Promise.all([
    fetchAllPaged(() => {
      let q = sb.from('bookings').select('total, net_amount, commission_amount, partner_name, booking_type, month_key, pax').order('check_in_on', {ascending:true});
      if (!isAll) q = q.eq('month_key', period);
      return q;
    }),
    fetchAllPaged(() => sb.from('hq_invoices').select('location_slug, amount_eur, category_id, invoice_date').order('invoice_date', {ascending:false})),
    fetchAllPaged(() => sb.from('ledger_entries').select('type, amount_eur, entry_date, paid_from, attributed_location, location_id').order('entry_date', {ascending:false}))
  ]);
  const invRows = invRowsAll.filter(r => isAll || String(r.invoice_date||'').slice(0,7) === period);
  const lgRows  = lgRowsAll.filter(r => isAll || String(r.entry_date||'').slice(0,7) === period);

  // ── BL KPIs — same formula as /partners renderKPIs() ───────────────
  const isDirect = (b) => !b.partner_name || b.booking_type === 'direct';
  const partnerBks = bkRows.filter(b => !isDirect(b));
  const directBks  = bkRows.filter(isDirect);

  const partnerGross = partnerBks.reduce((s,b) => s + Number(b.total||0), 0);
  const partnerNet   = partnerBks.reduce((s,b) => s + Number(b.net_amount ?? b.total ?? 0), 0);
  const directGross  = directBks.reduce((s,b) => s + Number(b.total||0), 0);
  const grossTotal   = partnerGross + directGross;       // Total Gross (Bookinglayer)
  const totalRevenue = partnerNet + directGross;         // Total Revenue GotaDagua
  const commissionPaid = grossTotal - totalRevenue;
  const bkCount      = bkRows.length;

  kpiBody.innerHTML = `
    <div class="summary-grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
      <div class="summary-box" style="border:2px dashed var(--muted)">
        <div class="summary-lbl">Total Gross (Bookinglayer)</div>
        <div class="summary-val">${eur(grossTotal)}</div>
        <div class="hint" style="margin-top:4px">Partner gross + direct · matches Bookinglayer</div>
      </div>
      <div class="summary-box">
        <div class="summary-lbl">Partner Gross Revenue</div>
        <div class="summary-val">${eur(partnerGross)}</div>
        <div class="hint" style="margin-top:4px">${isAll?'All months':period}</div>
      </div>
      <div class="summary-box" style="border-left:4px solid var(--ocean)">
        <div class="summary-lbl">Net from Partners</div>
        <div class="summary-val" style="color:var(--ocean)">${eur(partnerNet)}</div>
        <div class="hint" style="margin-top:4px">After commissions (−${eur(commissionPaid)})</div>
      </div>
      <div class="summary-box" style="border-left:4px solid var(--ocean)">
        <div class="summary-lbl">Direct Bookings</div>
        <div class="summary-val" style="color:var(--ocean)">${eur(directGross)}</div>
        <div class="hint" style="margin-top:4px">${directBks.length} booking${directBks.length===1?'':'s'} · 100% ours</div>
      </div>
      <div class="summary-box" style="border:2px solid var(--ocean)">
        <div class="summary-lbl">Total Revenue GotaDagua</div>
        <div class="summary-val" style="color:var(--ocean)">${eur(totalRevenue)}</div>
        <div class="hint" style="margin-top:4px">Your real take-home (partners net + direct)</div>
      </div>
    </div>
    <div class="hint" style="margin-top:12px">${bkCount} booking${bkCount===1?'':'s'} in the selected period · numbers match the <a href="/partners/" style="color:var(--ocean);font-weight:600">Partners app</a>.</div>
  `;

  // ── HQ expenses + business profit (uses same period filter) ────────
  const personalCatIds = new Set(CATEGORIES.filter(c => c.is_personal).map(c => c.id));
  const invBusiness = invRows.filter(r => !personalCatIds.has(r.category_id));
  const invPersonal = invRows.filter(r =>  personalCatIds.has(r.category_id));

  const hqTotal     = invBusiness.reduce((s,r)=>s+Number(r.amount_eur||0), 0);
  const hqGeneral   = invBusiness.filter(r => r.location_slug === 'general').reduce((s,r)=>s+Number(r.amount_eur||0), 0);
  const hqAttribLoc = hqTotal - hqGeneral;
  const personalTot = invPersonal.reduce((s,r)=>s+Number(r.amount_eur||0), 0);

  const localRev    = lgRows.filter(r => r.type==='revenue').reduce((s,r)=>s+Number(r.amount_eur||0), 0);
  const localExp    = lgRows.filter(r => r.type==='expense').reduce((s,r)=>s+Number(r.amount_eur||0), 0);
  const businessProfit = totalRevenue + localRev - localExp - hqTotal;

  body.innerHTML = `
    <div class="summary-grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
      <div class="summary-box" style="border-left:4px solid var(--ocean);cursor:pointer" onclick="switchTab('invoices')">
        <div class="summary-lbl">Despesas HQ · General</div>
        <div class="summary-val">${eur(hqGeneral)}</div>
        <div class="hint" style="margin-top:4px">${invBusiness.filter(r => r.location_slug === 'general').length} invoice(s)</div>
      </div>
      <div class="summary-box" style="border-left:4px solid var(--ocean);cursor:pointer" onclick="switchTab('invoices')">
        <div class="summary-lbl">Despesas HQ · Attributed</div>
        <div class="summary-val">${eur(hqAttribLoc)}</div>
        <div class="hint" style="margin-top:4px">Paid by HQ, allocated to camps</div>
      </div>
      <div class="summary-box" style="border-left:4px solid #9d174d">
        <div class="summary-lbl">Miguel — Personal</div>
        <div class="summary-val">${eur(personalTot)}</div>
        <div class="hint" style="margin-top:4px">Excluded from business profit</div>
      </div>
      <div class="summary-box" style="border-left:4px solid var(--green)">
        <div class="summary-lbl">On-site revenue (camps)</div>
        <div class="summary-val">${eur(localRev)}</div>
      </div>
      <div class="summary-box" style="border-left:4px solid var(--red)">
        <div class="summary-lbl">Local expenses (camps)</div>
        <div class="summary-val">${eur(localExp)}</div>
      </div>
      <div class="summary-box" style="grid-column:span 2;border-left:4px solid ${businessProfit>=0?'var(--green)':'var(--red)'}">
        <div class="summary-lbl">Business profit${isAll?' (all-time)':' — '+period}</div>
        <div class="summary-val ${businessProfit>=0?'pos':'neg'}">${businessProfit>=0?'+':''}${eur(businessProfit)}</div>
        <div class="hint" style="margin-top:4px">Total Revenue GotaDagua + on-site − local expenses − HQ invoices (excl. personal)</div>
      </div>
    </div>
  `;
}

function wireInvoiceForm(){
  const inpCur = $('inv_currency');
  const inpAmt = $('inv_amount');
  const inpFx  = $('inv_fx');
  const inpEur = $('inv_amount_eur');
  const inpNum = $('inv_number');
  const inpCo  = $('inv_company');

  const recalcEur = () => {
    const amt = Number(inpAmt.value) || 0;
    const fx  = Number(inpFx.value) || 0;
    inpEur.value = fx > 0 ? (amt * fx).toFixed(2) : '';
  };

  const refreshFx = async () => {
    const cur = inpCur.value || 'EUR';
    if (cur === 'EUR') { inpFx.value = '1'; $('fxHint').textContent = '(EUR — 1.000000)'; recalcEur(); return; }
    try {
      const rate = await fetchFxToEur(cur);
      inpFx.value = rate.toFixed(6);
      $('fxHint').textContent = `(auto ${FX_CACHE.date} — editable)`;
    } catch(e) {
      $('fxHint').textContent = '(auto failed — set manually)';
    }
    recalcEur();
  };

  inpCur.addEventListener('change', refreshFx);
  inpAmt.addEventListener('input', recalcEur);
  inpFx.addEventListener('input', recalcEur);

  // Live dedup check as the user fills invoice_number / amount / company.
  const checkDup = debounce(async () => {
    const num = (inpNum.value||'').trim();
    const amt = Number(inpAmt.value)||0;
    const co  = (inpCo.value||'').trim();
    if (!num || !amt || !co) { $('dupWarn').classList.remove('show'); return; }
    const { data } = await sb.from('hq_invoices')
      .select('id, invoice_date, location_slug, amount, currency, company')
      .eq('invoice_number', num).eq('amount', amt)
      .ilike('company', co).limit(5);
    if (!data || !data.length) { $('dupWarn').classList.remove('show'); return; }
    $('dupWarn').innerHTML = `<b>Possible duplicate.</b> A similar invoice is already registered:
      <ul>${data.map(d => `<li>${d.invoice_date} · ${d.company} · ${d.amount} ${d.currency} · ${locLabel(d.location_slug)}</li>`).join('')}</ul>
      Saving will still work — the form only warns.`;
    $('dupWarn').classList.add('show');
  }, 400);
  [inpNum, inpAmt, inpCo].forEach(el => el.addEventListener('input', checkDup));

  // Enable the "Extract from invoice" button only when a file is selected.
  const inpFile = $('inv_file');
  const btnEx   = $('extractBtn');
  if (inpFile && btnEx) {
    inpFile.addEventListener('change', () => {
      btnEx.disabled = !(inpFile.files && inpFile.files[0]);
    });
  }

  // Auto-derive paying_company from location. As long as the user hasn't
  // manually picked a different company, changing location keeps them in
  // sync. Once the user overrides paying_company, we stop auto-updating
  // for this row so we don't clobber their choice.
  const inpLoc    = $('inv_location');
  const inpPayCo  = $('inv_paying_company');
  const payCoAuto = $('payCoAuto');
  const syncPayingCompany = () => {
    if (inpPayCo.dataset.userTouched === '1') return;
    const derived = payingCompanyFor(inpLoc.value);
    inpPayCo.value = derived;
    if (payCoAuto) payCoAuto.textContent = '(auto from location)';
  };
  inpLoc.addEventListener('change', syncPayingCompany);
  inpPayCo.addEventListener('change', () => {
    const derived = payingCompanyFor(inpLoc.value);
    const overridden = inpPayCo.value !== derived;
    inpPayCo.dataset.userTouched = overridden ? '1' : '0';
    if (payCoAuto) payCoAuto.textContent = overridden ? '(overridden — inter-company)' : '(auto from location)';
  });
  syncPayingCompany();

  refreshFx();
}

// ═══════════════════════════════════════════════════════════════════
//   AI extract — upload selected file, call parse-invoice, fill form
// ═══════════════════════════════════════════════════════════════════
async function extractFromInvoice(){
  const fileInput = $('inv_file');
  const status    = $('extractStatus');
  const btn       = $('extractBtn');
  if (!fileInput?.files?.[0]) { toast('invToast','err','Attach a file first'); return; }
  const file = fileInput.files[0];

  btn.disabled = true;
  status.innerHTML = `<div class="toast toast-warn">🤖 Analysing invoice with Claude Sonnet 4.5 — this takes ~3 seconds…</div>`;

  // 1. Upload to a temp path in the same bucket so the Edge Function
  //    can download it via the caller's JWT. Save uses this same path.
  //    Path scheme mirrors saveInvoice() so if the user saves, the file
  //    is already in the right shape and we don't re-upload.
  const location_slug = $('inv_location').value || 'general';
  const dateSlice = ($('inv_date').value || new Date().toISOString().slice(0,10)).slice(0,7);
  const safe = file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const key = `${location_slug}/${dateSlice}/${Date.now()}_${safe}`;

  const { error: upErr } = await sb.storage.from('hq-invoices').upload(key, file, {
    contentType: file.type || 'application/octet-stream', upsert:false
  });
  if (upErr) {
    status.innerHTML = `<div class="toast toast-err">Upload failed: ${escapeHtml(upErr.message)}</div>`;
    btn.disabled = false;
    return;
  }

  // 2. Call the Edge Function. Auth header carries the caller JWT so bucket RLS
  //    applies (the function downloads with the same permissions the caller has).
  const { data: sessionData } = await sb.auth.getSession();
  const jwt = sessionData?.session?.access_token || '';
  const url = `${cfg.url}/functions/v1/parse-invoice`;
  let resp;
  try {
    resp = await fetch(url, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${jwt}`,
        'Content-Type': 'application/json',
        'apikey': cfg.anonKey
      },
      body: JSON.stringify({ storage_path: key })
    });
  } catch (e) {
    status.innerHTML = `<div class="toast toast-err">Network error: ${escapeHtml(e.message||'unknown')}</div>`;
    // Best-effort cleanup — remove the file we uploaded so it doesn't orphan.
    await sb.storage.from('hq-invoices').remove([key]).catch(()=>{});
    btn.disabled = false;
    return;
  }
  const result = await resp.json().catch(() => ({error:'invalid JSON from function'}));
  if (!resp.ok || result?.error) {
    status.innerHTML = `<div class="toast toast-err">Extract failed: ${escapeHtml(result?.error || resp.statusText)}</div>`;
    await sb.storage.from('hq-invoices').remove([key]).catch(()=>{});
    btn.disabled = false;
    return;
  }

  const ex = result.extracted || {};

  // 3. Fill form fields with what the model returned. All fields stay editable.
  //    Also stash the storage key so saveInvoice() reuses it instead of re-uploading.
  window.__prefilledStoragePath = key;
  window.__prefilledFileName    = file.name;
  window.__prefilledFileMime    = file.type || null;

  if (ex.invoice_date)   $('inv_date').value        = ex.invoice_date;
  if (ex.company)        $('inv_company').value     = String(ex.company).trim();
  if (ex.supplier_nif)   $('inv_nif').value         = ex.supplier_nif;
  if (ex.description)    $('inv_description').value = ex.description;
  if (ex.invoice_number) $('inv_number').value      = ex.invoice_number;
  if (ex.amount != null) $('inv_amount').value      = Number(ex.amount).toFixed(2);
  if (ex.currency)       $('inv_currency').value    = ex.currency;
  if (ex.payment_type)   $('inv_payment').value     = ex.payment_type;

  // Category — match by lowercase name against CATEGORIES.
  if (ex.category_hint) {
    const target = String(ex.category_hint).toLowerCase();
    const catSel = $('inv_category');
    for (let i = 0; i < catSel.options.length; i++) {
      if (catSel.options[i].textContent.trim().toLowerCase() === target) {
        catSel.selectedIndex = i;
        break;
      }
    }
  }
  // Location — match by slug. Dispatch change so paying_company auto-syncs.
  if (ex.location_hint) {
    const locSel = $('inv_location');
    for (let i = 0; i < locSel.options.length; i++) {
      if (locSel.options[i].value === ex.location_hint) { locSel.selectedIndex = i; break; }
    }
    locSel.dispatchEvent(new Event('change'));
  }

  // Trigger FX recalculation now that amount + currency are set.
  $('inv_currency').dispatchEvent(new Event('change'));

  const usage = result.usage || {};
  const costHint = usage.input_tokens
    ? ` · ${usage.input_tokens} in + ${usage.output_tokens} out tokens`
    : '';
  status.innerHTML = `<div class="toast toast-ok">✓ Fields extracted — review below and click Save${costHint}</div>`;
  btn.disabled = false;
}

async function fetchFxToEur(currency){
  // Frankfurter (ECB) — free, no key. Base=currency, target=EUR.
  // Cache by date so we don't hammer the API mid-session.
  const today = new Date().toISOString().slice(0,10);
  if (FX_CACHE.date === today && FX_CACHE.rates[currency]) return FX_CACHE.rates[currency];
  const url = `https://api.frankfurter.dev/v1/latest?base=${encodeURIComponent(currency)}&symbols=EUR`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('FX fetch failed');
  const j = await res.json();
  const rate = j?.rates?.EUR;
  if (typeof rate !== 'number') throw new Error('FX shape unexpected');
  if (FX_CACHE.date !== today) FX_CACHE = { date: today, rates: { EUR:1 } };
  FX_CACHE.rates[currency] = rate;
  return rate;
}

async function saveInvoice(){
  const btn = $('saveInvBtn');
  btn.disabled = true;

  const catSel = $('inv_category');
  const catOpt = catSel.options[catSel.selectedIndex];

  const location_slug   = $('inv_location').value;
  const invoice_date    = $('inv_date').value;
  const company         = ($('inv_company').value||'').trim();
  const supplier_nif    = ($('inv_nif').value||'').trim() || null;
  const invoice_number  = ($('inv_number').value||'').trim() || null;
  const amount          = Number($('inv_amount').value) || 0;
  const currency        = $('inv_currency').value || 'EUR';
  const fx_rate         = Number($('inv_fx').value) || (currency==='EUR' ? 1 : null);
  const amount_eur      = Number($('inv_amount_eur').value) || (amount * (fx_rate||1));
  const payment_type    = $('inv_payment').value;
  const paying_company  = $('inv_paying_company').value || payingCompanyFor(location_slug);
  const description     = ($('inv_description').value||'').trim() || null;
  const notes           = ($('inv_notes').value||'').trim() || null;
  const category_id     = catSel.value || null;
  const category_name   = catOpt?.textContent || null;

  if (!location_slug || !invoice_date || !company || !amount || !payment_type || !category_id) {
    toast('invToast','err','Fill in location, date, company, amount, payment type and category');
    btn.disabled = false;
    return;
  }
  if (!fx_rate || fx_rate <= 0) {
    toast('invToast','err','Set an FX rate (or use EUR)');
    btn.disabled = false;
    return;
  }

  // Upload file first, if any.
  // If the user ran AI extract already, the file is already in the bucket —
  // reuse the stashed key so we don't double-upload the same PDF.
  let file_url = null, file_name = null, file_mime = null;
  const fileInput = $('inv_file');
  const preUploaded = window.__prefilledStoragePath;
  const wasExtracted = !!preUploaded;
  const isEditing    = !!window.__editingInvoiceId;

  if (preUploaded) {
    file_url  = preUploaded;
    file_name = window.__prefilledFileName || (fileInput.files?.[0]?.name || null);
    file_mime = window.__prefilledFileMime || (fileInput.files?.[0]?.type || null);
  } else if (fileInput.files && fileInput.files[0]) {
    const f = fileInput.files[0];
    const safe = f.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    const key = `${location_slug}/${invoice_date.slice(0,7)}/${Date.now()}_${safe}`;
    const { error: upErr } = await sb.storage.from('hq-invoices').upload(key, f, {
      contentType: f.type || 'application/octet-stream', upsert:false
    });
    if (upErr) { toast('invToast','err','File upload failed: '+upErr.message); btn.disabled = false; return; }
    file_url  = key;
    file_name = f.name;
    file_mime = f.type || null;
  } else if (isEditing) {
    // Editing without touching the file input — keep the original attachment.
    file_url  = window.__editingFileUrl  || null;
    file_name = window.__editingFileName || null;
    file_mime = window.__editingFileMime || null;
  }

  const payload = {
    location_slug, paying_company,
    invoice_date, company, supplier_nif, description,
    amount, currency, fx_rate, amount_eur,
    payment_type, invoice_number, category_id, category_name,
    file_url, file_name, file_mime,
    notes,
    // Editing = the user reviewed the row → clear the amber chip.
    // Fresh save from AI extract = still needs review.
    // Fresh manual save = clean, no review needed.
    needs_review: isEditing ? false : wasExtracted
  };
  if (!isEditing) payload.created_by = CURRENT_USER?.id || null;

  let error;
  if (isEditing) {
    const oldFileUrl = window.__editingFileUrl;
    ({ error } = await sb.from('hq_invoices').update(payload).eq('id', window.__editingInvoiceId));
    // If the user replaced the attachment, garbage-collect the old file.
    if (!error && oldFileUrl && oldFileUrl !== file_url) {
      await sb.storage.from('hq-invoices').remove([oldFileUrl]).catch(()=>{});
    }
  } else {
    ({ error } = await sb.from('hq_invoices').insert(payload));
  }
  if (error) { toast('invToast','err','Save failed: '+error.message); btn.disabled = false; return; }

  toast('invToast','ok', isEditing ? 'Invoice updated · review cleared' : 'Invoice saved');
  if (isEditing) cancelEditInvoice();
  else           clearInvoiceForm();
  btn.disabled = false;
  renderInvoiceList();
}

// ═══════════════════════════════════════════════════════════════════
//   BULK AI-FIRST UPLOAD — drop N files, AI fills each, save all
// ═══════════════════════════════════════════════════════════════════
function wireBulkUpload(){
  if (window.__bulkWired) return;
  window.__bulkWired = true;

  const drop  = $('bulkDrop');
  const input = $('bulkFiles');
  const btn   = $('bulkProcessBtn');
  const list  = $('bulkList');
  if (!drop || !input || !btn || !list) return;

  // Persist the pending file list on the button so we don't re-read the
  // <input> after it's been reused. Drag-drop bypasses <input.files>
  // otherwise on some browsers.
  window.__bulkFiles = [];

  const updateList = () => {
    const files = window.__bulkFiles || [];
    btn.disabled = files.length === 0;
    btn.textContent = `🚀 Process ${files.length} file${files.length===1?'':'s'}`;
    if (!files.length) { list.style.display = 'none'; list.innerHTML = ''; return; }
    list.style.display = '';
    list.innerHTML = `
      <div class="hint" style="margin-bottom:6px"><b>${files.length}</b> file(s) queued:</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${files.map((f, i) => `
          <span style="display:inline-flex;align-items:center;gap:6px;background:var(--foam);color:var(--navy);padding:4px 10px;border-radius:14px;font-size:12px">
            ${escapeHtml(f.name)}
            <button type="button" onclick="removeBulkFile(${i})" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:0" title="Remove">×</button>
          </span>
        `).join('')}
      </div>`;
  };

  const addFiles = (fileList) => {
    const arr = Array.from(fileList || []);
    if (!arr.length) return;
    window.__bulkFiles = (window.__bulkFiles || []).concat(arr);
    updateList();
  };

  drop.addEventListener('click', () => input.click());
  input.addEventListener('change', () => { addFiles(input.files); input.value = ''; });

  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, (e) => {
    e.preventDefault(); e.stopPropagation();
    drop.style.borderColor = 'var(--ocean)';
    drop.style.background  = 'var(--foam)';
  }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, (e) => {
    e.preventDefault(); e.stopPropagation();
    drop.style.borderColor = '';
    drop.style.background  = '';
  }));
  drop.addEventListener('drop', (e) => addFiles(e.dataTransfer.files));
}

function removeBulkFile(index){
  window.__bulkFiles = (window.__bulkFiles || []).filter((_, i) => i !== index);
  const drop  = $('bulkDrop');
  const btn   = $('bulkProcessBtn');
  const list  = $('bulkList');
  const files = window.__bulkFiles;
  btn.disabled = files.length === 0;
  btn.textContent = `🚀 Process ${files.length} file${files.length===1?'':'s'}`;
  if (!files.length) { list.style.display = 'none'; list.innerHTML = ''; return; }
  // Rebuild the chips (simpler than mutating in-place).
  list.innerHTML = `
    <div class="hint" style="margin-bottom:6px"><b>${files.length}</b> file(s) queued:</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px">
      ${files.map((f, i) => `
        <span style="display:inline-flex;align-items:center;gap:6px;background:var(--foam);color:var(--navy);padding:4px 10px;border-radius:14px;font-size:12px">
          ${escapeHtml(f.name)}
          <button type="button" onclick="removeBulkFile(${i})" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:0" title="Remove">×</button>
        </span>
      `).join('')}
    </div>`;
}

async function bulkProcessInvoices(){
  const files = window.__bulkFiles || [];
  if (!files.length) return;
  const btn = $('bulkProcessBtn');
  const results = $('bulkResults');
  btn.disabled = true;
  btn.textContent = `Processing 0 / ${files.length}…`;

  const defaultLoc = $('bulk_location').value;
  const defaultCo  = $('bulk_paying_company').value;

  // Build a per-file status object we mutate as work progresses.
  const status = files.map((f, i) => ({ i, name: f.name, state: 'queued', message: '' }));
  const renderStatus = () => {
    results.innerHTML = `
      <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden">
        <table style="min-width:600px">
          <thead><tr><th>#</th><th>File</th><th>Status</th><th>Details</th></tr></thead>
          <tbody>
            ${status.map(s => `<tr>
              <td>${s.i+1}</td>
              <td style="font-family:'DM Mono',monospace;font-size:11px">${escapeHtml(s.name)}</td>
              <td>
                ${s.state==='queued'   ? '<span class="chip chip-normal">queued</span>' : ''}
                ${s.state==='working'  ? '<span class="chip chip-review">analysing…</span>' : ''}
                ${s.state==='saved'    ? '<span class="chip chip-normal" style="background:var(--green-bg);color:var(--green)">✓ saved</span>' : ''}
                ${s.state==='error'    ? '<span class="chip chip-review" style="background:var(--red-bg);color:var(--red)">✗ error</span>' : ''}
              </td>
              <td style="font-size:12px;color:var(--muted)">${escapeHtml(s.message||'')}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  };
  renderStatus();

  // Small concurrency limit so we don't hammer the Edge Function or hit
  // Anthropic rate limits with 20 requests at once. 3 in flight = fast
  // enough for a batch of 10-20 files and still safe.
  const CONCURRENCY = 3;
  let cursor = 0;
  let saved = 0;
  let failed = 0;

  const processOne = async (idx) => {
    const file = files[idx];
    const s = status[idx];
    s.state = 'working';
    renderStatus();

    try {
      // 1. Upload to Storage. Path is under a "_bulk" prefix by month so
      //    the folder stays organized even before we know the real location.
      const nowMonth = new Date().toISOString().slice(0,7);
      const guessLoc = defaultLoc !== '__auto__' ? defaultLoc : '_pending';
      const safe = file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
      const storageKey = `${guessLoc}/${nowMonth}/${Date.now()}_${idx}_${safe}`;

      const { error: upErr } = await sb.storage.from('hq-invoices').upload(storageKey, file, {
        contentType: file.type || 'application/octet-stream', upsert:false
      });
      if (upErr) throw new Error('upload: '+upErr.message);

      // 2. Call parse-invoice.
      const { data: sessionData } = await sb.auth.getSession();
      const jwt = sessionData?.session?.access_token || '';
      const resp = await fetch(`${cfg.url}/functions/v1/parse-invoice`, {
        method:'POST',
        headers:{
          'Authorization': `Bearer ${jwt}`,
          'Content-Type':  'application/json',
          'apikey': cfg.anonKey
        },
        body: JSON.stringify({ storage_path: storageKey })
      });
      const result = await resp.json().catch(() => ({error:'invalid JSON'}));
      if (!resp.ok || result?.error) throw new Error(result?.error || resp.statusText);
      const ex = result.extracted || {};

      // 3. Decide final location + paying_company. User's default wins if set.
      const finalLoc = defaultLoc !== '__auto__' ? defaultLoc
                     : (HQ_LOCATIONS.find(l => l.slug === ex.location_hint)?.slug || 'general');
      const finalPayCo = defaultCo !== '__auto__' ? defaultCo : payingCompanyFor(finalLoc);

      // 4. Resolve category by name (case-insensitive) against the CATEGORIES
      //    list loaded at boot. Missing/unknown → leave null (user reviews).
      const catByName = new Map(CATEGORIES.map(c => [c.name.toLowerCase(), c]));
      const catHit    = ex.category_hint ? catByName.get(String(ex.category_hint).toLowerCase()) : null;

      // 5. FX. If EUR → 1. Otherwise 1 as placeholder — user must confirm
      //    the real rate in review since we don't fetch it inline here.
      const currency = (ex.currency || 'EUR').toUpperCase();
      const fx_rate  = currency === 'EUR' ? 1 : 1;
      const amount   = Number(ex.amount) || 0;
      if (!amount) throw new Error('AI could not read a valid amount');
      const amount_eur = currency === 'EUR' ? amount : amount * fx_rate;

      // 6. Build the row and insert. Everything is saved as needs_review
      //    so the amber chip in the list clearly marks the queue to review.
      const payload = {
        location_slug: finalLoc,
        paying_company: finalPayCo,
        invoice_date: ex.invoice_date || new Date().toISOString().slice(0,10),
        company: (ex.company || 'unknown').toString().trim(),
        supplier_nif: ex.supplier_nif || null,
        description: ex.description || null,
        amount, currency, fx_rate, amount_eur,
        payment_type: ex.payment_type || 'Other',
        invoice_number: ex.invoice_number || null,
        category_id: catHit?.id || null,
        category_name: catHit?.name || (ex.category_hint || null),
        file_url: storageKey,
        file_name: file.name,
        file_mime: file.type || null,
        needs_review: true,
        created_by: CURRENT_USER?.id || null
      };
      const { error: insErr } = await sb.from('hq_invoices').insert(payload);
      if (insErr) throw new Error('save: '+insErr.message);

      s.state = 'saved';
      s.message = `${payload.company} · ${amount.toFixed(2)} ${currency} · ${payload.category_name || 'no category'} · ${locLabel(finalLoc)}`;
      saved++;
    } catch (e) {
      s.state = 'error';
      s.message = String(e.message || e);
      failed++;
    }
    renderStatus();
    btn.textContent = `Processing ${saved+failed} / ${files.length}…`;
  };

  // Run with a rolling window of CONCURRENCY workers pulling from the queue.
  const workers = [];
  for (let w = 0; w < CONCURRENCY; w++) {
    workers.push((async () => {
      while (true) {
        const idx = cursor++;
        if (idx >= files.length) break;
        await processOne(idx);
      }
    })());
  }
  await Promise.all(workers);

  btn.textContent = `🚀 Process 0 files`;
  btn.disabled = true;
  window.__bulkFiles = [];
  $('bulkList').style.display = 'none';
  $('bulkList').innerHTML = '';

  results.insertAdjacentHTML('afterbegin',
    `<div class="toast ${failed?'toast-warn':'toast-ok'}" style="margin-bottom:10px">
      ✓ ${saved} imported${failed?` · ${failed} failed`:''} — scroll down to review each row and click Save after any corrections.
    </div>`
  );
  renderInvoiceList();
}

function toggleManualExtras(){
  const box = $('manualExtras');
  const btn = $('manualMoreBtn');
  if (!box || !btn) return;
  const opening = box.style.display === 'none' || !box.style.display;
  box.style.display = opening ? '' : 'none';
  btn.textContent = opening ? 'Fewer fields ▴' : 'More fields ▾';
}

// ─── Edit an existing invoice: fetch, prefill, flag Save as an UPDATE ───
async function openEditInvoice(id){
  const { data: row, error } = await sb.from('hq_invoices')
    .select('id, location_slug, paying_company, invoice_date, company, description, amount, currency, amount_eur, payment_type, invoice_number, category_id, category_name, file_url, file_name, file_mime, needs_review, notes, supplier_nif, fx_rate')
    .eq('id', id).maybeSingle();
  if (error || !row) { alert('Could not load invoice: '+(error?.message||'not found')); return; }

  // Populate the single-line row (essentials).
  $('inv_location').value  = row.location_slug || 'general';
  $('inv_date').value      = row.invoice_date  || '';
  $('inv_company').value   = row.company       || '';
  $('inv_amount').value    = row.amount != null ? Number(row.amount).toFixed(2) : '';
  $('inv_currency').value  = row.currency      || 'EUR';
  $('inv_payment').value   = row.payment_type  || 'Other';
  if (row.category_id) $('inv_category').value = row.category_id;

  // Populate the extras.
  $('inv_paying_company').value = row.paying_company || payingCompanyFor(row.location_slug);
  $('inv_nif').value            = row.supplier_nif   || '';
  $('inv_number').value         = row.invoice_number || '';
  $('inv_fx').value             = row.fx_rate != null ? Number(row.fx_rate) : (row.currency === 'EUR' ? 1 : '');
  $('inv_amount_eur').value     = row.amount_eur != null ? Number(row.amount_eur).toFixed(2) : '';
  $('inv_description').value    = row.description    || '';
  $('inv_notes').value          = row.notes          || '';

  // Reflect the paying_company auto/override state so the label reads right.
  const derived    = payingCompanyFor(row.location_slug);
  const overridden = row.paying_company && row.paying_company !== derived;
  $('inv_paying_company').dataset.userTouched = overridden ? '1' : '0';
  const payCoAuto = $('payCoAuto');
  if (payCoAuto) payCoAuto.textContent = overridden ? '(overridden — inter-company)' : '(auto from location)';

  // Refresh the fx hint label without triggering the auto-refresh network call.
  const fxHint = $('fxHint');
  if (fxHint) fxHint.textContent = row.currency === 'EUR' ? '(EUR — 1.000000)' : `(from row — editable)`;

  // Stash the id so saveInvoice() does UPDATE. Also stash file metadata so we
  // don't overwrite it when the user saves without touching the file input.
  window.__editingInvoiceId  = id;
  window.__editingFileUrl    = row.file_url;
  window.__editingFileName   = row.file_name;
  window.__editingFileMime   = row.file_mime;
  // Clear any AI-extract stash from a previous single-file flow.
  window.__prefilledStoragePath = null;
  window.__prefilledFileName    = null;
  window.__prefilledFileMime    = null;

  // Show the More fields section if the row has any extras — makes the FX,
  // NIF, invoice number and paying_company visible at a glance for review.
  const hasExtras = row.supplier_nif || row.invoice_number || row.description || row.notes || row.file_url || (row.currency && row.currency !== 'EUR') || overridden;
  const extras = $('manualExtras');
  if (hasExtras && extras && (extras.style.display === 'none' || !extras.style.display)) {
    toggleManualExtras();
  }

  // Change Save button label + inject an edit banner above the row.
  $('saveInvBtn').textContent = 'Save changes';
  let banner = $('editBanner');
  if (!banner) {
    banner = document.createElement('div');
    banner.id = 'editBanner';
    banner.className = 'toast toast-warn';
    banner.style.marginBottom = '12px';
    const cardBody = document.querySelector('#tab-invoices .card:nth-of-type(2) .card-body');
    if (cardBody) cardBody.insertBefore(banner, cardBody.firstChild);
  }
  const chip = row.needs_review
    ? ' <span class="chip chip-review" style="margin-left:6px">was flagged for review</span>'
    : '';
  banner.innerHTML = `
    ✎ Editing <b>${row.invoice_date}</b> · ${escapeHtml(row.company||'')}${chip}
    <button type="button" class="action-btn" style="margin-left:12px" onclick="cancelEditInvoice()">Cancel edit</button>
  `;

  // Scroll the form into view so the user knows something happened.
  const anchor = $('inv_location');
  if (anchor) anchor.closest('.card').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function cancelEditInvoice(){
  window.__editingInvoiceId = null;
  window.__editingFileUrl   = null;
  window.__editingFileName  = null;
  window.__editingFileMime  = null;
  const banner = $('editBanner');
  if (banner) banner.remove();
  const saveBtn = $('saveInvBtn');
  if (saveBtn) saveBtn.textContent = 'Save';
  clearInvoiceForm();
}

function clearInvoiceForm(){
  const today = new Date().toISOString().slice(0,10);
  $('inv_date').value = today;
  ['inv_company','inv_nif','inv_number','inv_amount','inv_amount_eur','inv_description','inv_notes'].forEach(id => $(id).value = '');
  $('inv_currency').value = 'EUR';
  $('inv_fx').value = '1';
  $('fxHint').textContent = '(EUR — 1.000000)';
  $('dupWarn').classList.remove('show');
  const fileInput = $('inv_file');
  if (fileInput) fileInput.value = '';
  const extractStatus = $('extractStatus');
  if (extractStatus) extractStatus.innerHTML = '';
  const extractBtn = $('extractBtn');
  if (extractBtn) extractBtn.disabled = true;
  // AI-extract stash cleared so the next Save re-uploads if needed.
  window.__prefilledStoragePath = null;
  window.__prefilledFileName = null;
  window.__prefilledFileMime = null;
  // Reset paying_company override state so it goes back to auto-derive mode.
  const payCo = $('inv_paying_company');
  if (payCo) {
    payCo.dataset.userTouched = '0';
    payCo.value = payingCompanyFor($('inv_location').value);
  }
  const payCoAuto = $('payCoAuto');
  if (payCoAuto) payCoAuto.textContent = '(auto from location)';
}

async function renderInvoiceList(){
  const body = $('invListBody');
  if (!body) return;
  const loc = $('filter_location')?.value || '__all__';
  const month = $('filter_month')?.value || '';

  body.innerHTML = `<div class="loading">Loading…</div>`;
  let rows;
  try {
    rows = await fetchAllPaged(() => {
      let q = sb.from('hq_invoices')
        .select('id, location_slug, paying_company, invoice_date, company, description, amount, currency, amount_eur, payment_type, invoice_number, category_name, file_url, file_name, needs_review, is_duplicate, category_id, notes, supplier_nif, fx_rate')
        .order('invoice_date', { ascending:false });
      if (loc !== '__all__') q = q.eq('location_slug', loc);
      if (month) {
        const start = `${month}-01`;
        const [y,m] = month.split('-').map(Number);
        const endD = new Date(Date.UTC(y, m, 1));
        const end = endD.toISOString().slice(0,10);
        q = q.gte('invoice_date', start).lt('invoice_date', end);
      }
      return q;
    });
  } catch (error) {
    body.innerHTML = `<div class="loading" style="color:var(--red)">Load failed: ${error.message}</div>`;
    return;
  }
  const personalCatIds = new Set(CATEGORIES.filter(c => c.is_personal).map(c => c.id));

  const totalCount   = rows.length;
  const totalEur     = rows.reduce((s,r)=>s+Number(r.amount_eur||0), 0);
  const personalEur  = rows.filter(r => personalCatIds.has(r.category_id)).reduce((s,r)=>s+Number(r.amount_eur||0), 0);
  const businessEur  = totalEur - personalEur;

  if (!rows.length) {
    body.innerHTML = `<div class="loading">No invoices yet. Register the first one above.</div>`;
    return;
  }

  // Group by location_slug when "All" is selected. General first, then camps by size.
  const groupsOrder = ['general','portugal','surf-school','junior-camp','kids-camp','morocco','sri-lanka'];
  const grouped = {};
  rows.forEach(r => {
    const k = r.location_slug || 'general';
    if (!grouped[k]) grouped[k] = [];
    grouped[k].push(r);
  });
  const showGrouped = (loc === '__all__');

  const rowHtml = (r) => {
    const isPersonal = personalCatIds.has(r.category_id);
    // If paying_company diverges from the default for this location,
    // mark the row so the inter-company flow is visible at a glance.
    const derivedPayCo = payingCompanyFor(r.location_slug);
    const isInterCo = r.paying_company && r.paying_company !== derivedPayCo;
    return `<tr class="${r.is_duplicate?'dup':''}">
      <td>${r.invoice_date}</td>
      <td class="loc-name">${locLabel(r.location_slug)}</td>
      <td>${escapeHtml(companyLabel(r.paying_company))}${isInterCo?' <span class="chip chip-review" title="Inter-company: paid by a different company than the location default">inter-co</span>':''}</td>
      <td>${escapeHtml(r.company||'')}${r.description?`<br><span style="font-size:11px;color:var(--muted)">${escapeHtml(r.description)}</span>`:''}</td>
      <td>${escapeHtml(r.category_name||'')} ${isPersonal?'<span class="chip chip-personal">personal</span>':''} ${r.needs_review?'<span class="chip chip-review">review</span>':''}</td>
      <td style="font-family:'DM Mono',monospace;font-size:11px">${escapeHtml(r.invoice_number||'—')}</td>
      <td class="r">${Number(r.amount).toFixed(2)} ${r.currency}</td>
      <td class="r">${eur(r.amount_eur)}</td>
      <td>${escapeHtml(r.payment_type||'')}</td>
      <td>${r.file_url?`<a class="file-link" href="#" onclick="openInvoiceFile('${r.file_url}');return false;">${escapeHtml(r.file_name||'view')}</a>`:'—'}</td>
      <td style="white-space:nowrap">
        <button class="action-btn" onclick="openEditInvoice('${r.id}')" title="Edit fields — also clears the review chip">Edit</button>
        <button class="action-btn danger" onclick="deleteInvoice('${r.id}')">Delete</button>
      </td>
    </tr>`;
  };

  const tableHead = `
    <thead><tr>
      <th>Date</th><th>Location</th><th>Paid by</th><th>Company</th><th>Category</th>
      <th>Invoice #</th><th class="r">Amount</th><th class="r">EUR</th>
      <th>Pay</th><th>File</th><th></th>
    </tr></thead>`;

  let tableBody;
  if (showGrouped) {
    const groupSections = groupsOrder
      .filter(slug => grouped[slug] && grouped[slug].length)
      .map(slug => {
        const gRows = grouped[slug];
        const gTotal = gRows.reduce((s,r)=>s+Number(r.amount_eur||0), 0);
        const label = slug === 'general' ? 'General HQ · not attributed to a camp' : `Attributed to ${locLabel(slug)}`;
        return `
          <tr style="background:var(--foam);border-top:2px solid var(--border)">
            <td colspan="7" style="font-weight:700;color:var(--navy);font-size:12px;text-transform:uppercase;letter-spacing:.06em">${label}</td>
            <td class="r" style="font-weight:700;color:var(--navy)">${eur(gTotal)}</td>
            <td colspan="3" style="color:var(--muted);font-size:11px">${gRows.length} invoice(s)</td>
          </tr>
          ${gRows.map(rowHtml).join('')}
        `;
      }).join('');
    // Any unexpected slugs go to a fallback bucket
    const knownSlugs = new Set(groupsOrder);
    const otherSlugs = Object.keys(grouped).filter(s => !knownSlugs.has(s));
    const otherSection = otherSlugs.map(slug => `
      <tr style="background:var(--foam);border-top:2px solid var(--border)">
        <td colspan="11" style="font-weight:700;color:var(--navy);font-size:12px">Other · ${escapeHtml(slug)}</td>
      </tr>
      ${grouped[slug].map(rowHtml).join('')}
    `).join('');
    tableBody = `<tbody>${groupSections}${otherSection}</tbody>`;
  } else {
    tableBody = `<tbody>${rows.map(rowHtml).join('')}</tbody>`;
  }

  body.innerHTML = `
    <div class="summary-grid">
      <div class="summary-box"><div class="summary-lbl">Invoices</div><div class="summary-val">${totalCount}</div></div>
      <div class="summary-box"><div class="summary-lbl">Total (EUR)</div><div class="summary-val">${eur(totalEur)}</div></div>
      <div class="summary-box"><div class="summary-lbl">Business (excl. personal)</div><div class="summary-val">${eur(businessEur)}</div></div>
      <div class="summary-box"><div class="summary-lbl">Miguel — Personal</div><div class="summary-val">${eur(personalEur)}</div></div>
    </div>
    <div style="overflow-x:auto"><table>${tableHead}${tableBody}</table></div>
    <div class="hint" style="margin-top:14px">
      <b>General HQ</b> = despesas que pertencem à empresa como um todo (contabilidade, seguros globais, software…).<br>
      <b>Attributed to a camp</b> = despesas pagas pelo HQ mas alocadas ao camp para efeitos de lucro (ex.: um seguro do Morocco pago da conta do HQ).<br>
      As despesas que os camps pagam da sua própria caixa continuam no ledger de cada camp — <b>não vão para aqui</b>.
    </div>
  `;
}

async function openInvoiceFile(key){
  const { data, error } = await sb.storage.from('hq-invoices').createSignedUrl(key, 60);
  if (error || !data?.signedUrl) { alert('Could not open file: '+(error?.message||'unknown')); return; }
  window.open(data.signedUrl, '_blank', 'noopener');
}

async function deleteInvoice(id){
  if (!confirm('Delete this invoice permanently?')) return;
  // Fetch first to get file_url so we can delete the attachment too.
  const { data: row } = await sb.from('hq_invoices').select('file_url').eq('id', id).maybeSingle();
  const { error } = await sb.from('hq_invoices').delete().eq('id', id);
  if (error) { alert('Delete failed: '+error.message); return; }
  if (row?.file_url) { await sb.storage.from('hq-invoices').remove([row.file_url]); }
  renderInvoiceList();
}

// ═══════════════════════════════════════════════════════════════════
const EXCEL_LOCATION_MAP = {
  'surfcamp pt':'portugal', 'surfcamppt':'portugal', 'portugal':'portugal',
  'morocco':'morocco', 'morroco':'morocco',  // user's spelling in the sheet
  'surfschool':'surf-school', 'surf school':'surf-school', 'surf-school':'surf-school',
  'sri lanka':'sri-lanka', 'srilanka':'sri-lanka', 'sri-lanka':'sri-lanka',
  'junior camp':'junior-camp', 'juniorcamp':'junior-camp', 'junior-camp':'junior-camp',
  'kids camp':'kids-camp', 'kidscamp':'kids-camp', 'kids-camp':'kids-camp',
  'general':'general', 'hq':'general'
};
const EXCEL_CATEGORY_FIXES = {
  'utulities':'Utilities'   // known typo
};

function parseExcelAmount(cell){
  if (!cell) return null;
  // Strip €, spaces, thousands commas (European "€2,232.07" uses . decimal + , thousands)
  const s = String(cell).replace(/€/g,'').replace(/\s/g,'').replace(/,/g, (m, i, all) => {
    // Ambiguity: comma could be decimal separator in some locales. In Miguel's sheet,
    // format is always €X,XXX.XX so comma = thousands. Strip all commas.
    return '';
  });
  const n = Number(s);
  return isNaN(n) ? null : n;
}

function parseExcelDate(cell){
  // Expected DD/MM/YYYY. Return YYYY-MM-DD or null.
  const s = String(cell||'').trim();
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return null;
  const [_, d, mo, y] = m;
  return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

// CSV row splitter that honors "quoted, cells" — the sheet exports amounts like
// "€2,232.07" wrapped in quotes because of the internal comma.
function splitCsvRow(line){
  const out = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (inQ && line[i+1] === '"') { cur += '"'; i++; }
      else inQ = !inQ;
    } else if (ch === ',' && !inQ) {
      out.push(cur); cur = '';
    } else {
      cur += ch;
    }
  }
  out.push(cur);
  return out.map(c => c.trim());
}

async function previewExcel(){
  const raw = ($('excelBox').value || '').trim();
  const preview = $('excelPreview');
  if (!raw) { preview.innerHTML = '<div class="toast toast-err">Paste your CSV first</div>'; return; }

  const lines = raw.split(/\r?\n/).filter(l => l.trim().length);
  if (lines.length < 2) { preview.innerHTML = '<div class="toast toast-err">Need header + at least one data row</div>'; return; }

  const header = splitCsvRow(lines[0]).map(h => h.toLowerCase());
  const idx = {
    location:    header.findIndex(h => h.includes('location')),
    date:        header.findIndex(h => h.includes('invoice date') || h === 'date'),
    company:     header.findIndex(h => h.includes('company')),
    description: header.findIndex(h => h.includes('description')),
    nif:         header.findIndex(h => h.includes('tax reg') || h === 'nif'),
    amount:      header.findIndex(h => h === 'amount'),
    currency:    header.findIndex(h => h.includes('currency')),
    payment:     header.findIndex(h => h.includes('payment')),
    invnum:      header.findIndex(h => h.includes('invoice number')),
    category:    header.findIndex(h => h === 'category'),
    dup:         header.findIndex(h => h.includes('duplicate'))
  };
  const missing = ['location','date','company','amount','payment','category'].filter(k => idx[k] < 0);
  if (missing.length) {
    preview.innerHTML = `<div class="toast toast-err">Header missing required columns: ${missing.join(', ')}</div>`;
    return;
  }

  const catByName = new Map(CATEGORIES.map(c => [c.name.toLowerCase(), c]));
  const applyCatFix = (raw) => {
    const key = String(raw||'').trim().toLowerCase();
    const fixed = EXCEL_CATEGORY_FIXES[key] || raw;
    return String(fixed||'').trim();
  };

  const rows = [];
  const errors = [];
  for (let i = 1; i < lines.length; i++) {
    const cells = splitCsvRow(lines[i]);
    if (cells.length < 3) continue;
    const rowNum = i + 1;
    const rawLoc = (cells[idx.location]||'').trim();
    const rawDate = (cells[idx.date]||'').trim();
    const rawAmt = (cells[idx.amount]||'').trim();
    const rawCat = applyCatFix(cells[idx.category]);

    const location_slug = EXCEL_LOCATION_MAP[rawLoc.toLowerCase()];
    const invoice_date  = parseExcelDate(rawDate);
    const amount        = parseExcelAmount(rawAmt);
    const category      = catByName.get(String(rawCat).toLowerCase());
    const rowErrors = [];
    if (!location_slug) rowErrors.push(`unknown location "${rawLoc}"`);
    if (!invoice_date)  rowErrors.push(`bad date "${rawDate}"`);
    if (!amount || amount <= 0) rowErrors.push(`bad amount "${rawAmt}"`);
    if (!category)      rowErrors.push(`unknown category "${rawCat}"`);

    const currency = (idx.currency >= 0 && cells[idx.currency]) ? String(cells[idx.currency]).trim().toUpperCase() : 'EUR';
    const fx_rate = currency === 'EUR' ? 1 : null;
    const record = {
      _row: rowNum,
      _errors: rowErrors,
      location_slug: location_slug || null,
      // Excel doesn't have a paying_company column — assume the default
      // company for the location (Water Movements for PT locations,
      // MGRP for morocco, Wave for sri-lanka). If Miguel actually paid
      // some of those Excel rows inter-company, he'll fix them one-off
      // in the invoice list afterwards.
      paying_company: location_slug ? payingCompanyFor(location_slug) : null,
      invoice_date: invoice_date || null,
      company: (cells[idx.company]||'').trim(),
      description: idx.description >= 0 ? (cells[idx.description]||'').trim() || null : null,
      supplier_nif: idx.nif >= 0 ? (cells[idx.nif]||'').trim() || null : null,
      amount: amount || 0,
      currency: currency || 'EUR',
      fx_rate,
      amount_eur: currency === 'EUR' ? (amount||0) : null,
      payment_type: mapPaymentType((cells[idx.payment]||'').trim()),
      invoice_number: idx.invnum >= 0 ? (cells[idx.invnum]||'').trim() || null : null,
      category_id: category?.id || null,
      category_name: category?.name || rawCat || null,
      needs_review: idx.dup >= 0 ? String(cells[idx.dup]||'').trim().toUpperCase() === 'TRUE' : false
    };
    if (currency !== 'EUR') rowErrors.push(`non-EUR row (${currency}) needs manual FX — skipped`);
    rows.push(record);
    if (rowErrors.length) errors.push({row: rowNum, errors: rowErrors, company: record.company});
  }

  // Dedup against existing DB rows. Key: invoice_number + amount + company + date.
  // Paginated: Supabase caps .select() at 1000 per request — without paging,
  // dedup silently lets duplicates through once the table crosses 1000 rows.
  const validRows = rows.filter(r => !r._errors.length);
  const existing = await fetchAllPaged(() =>
    sb.from('hq_invoices').select('invoice_number, amount, company, invoice_date').order('invoice_date',{ascending:false})
  );
  const existingKeys = new Set(existing.map(r => sigKey(r)));

  const dupRows = [];
  const newRows = [];
  for (const r of validRows) {
    if (existingKeys.has(sigKey(r))) dupRows.push(r);
    else newRows.push(r);
  }

  window.__excelImportBuffer = newRows;   // for the Import step

  preview.innerHTML = `
    <div class="summary-grid">
      <div class="summary-box"><div class="summary-lbl">Rows parsed</div><div class="summary-val">${rows.length}</div></div>
      <div class="summary-box" style="border-left:4px solid var(--green)"><div class="summary-lbl">New to import</div><div class="summary-val">${newRows.length}</div></div>
      <div class="summary-box" style="border-left:4px solid var(--amber)"><div class="summary-lbl">Skipped (already in DB)</div><div class="summary-val">${dupRows.length}</div></div>
      <div class="summary-box" style="border-left:4px solid var(--red)"><div class="summary-lbl">Errors</div><div class="summary-val">${errors.length}</div></div>
    </div>

    ${errors.length ? `
      <div class="toast toast-warn" style="margin-bottom:14px"><b>${errors.length} row(s) with errors — will be skipped:</b>
        <ul style="margin-top:6px;margin-left:20px;font-weight:400;line-height:1.7">
          ${errors.slice(0, 20).map(e => `<li>Row ${e.row} (${escapeHtml(e.company||'?')}): ${e.errors.join(' · ')}</li>`).join('')}
          ${errors.length > 20 ? `<li>… and ${errors.length - 20} more</li>` : ''}
        </ul>
      </div>` : ''}

    <div style="overflow-x:auto;max-height:380px;overflow-y:auto;border:1px solid var(--border);border-radius:8px">
      <table style="min-width:900px">
        <thead style="position:sticky;top:0"><tr>
          <th>#</th><th>Date</th><th>Location</th><th>Company</th><th>Category</th>
          <th class="r">Amount</th><th>Pay</th><th>Inv #</th><th>Status</th>
        </tr></thead>
        <tbody>
          ${newRows.slice(0, 40).map(r => `<tr>
            <td>${r._row}</td><td>${r.invoice_date}</td><td>${locLabel(r.location_slug)}</td>
            <td>${escapeHtml(r.company)}</td><td>${escapeHtml(r.category_name)}</td>
            <td class="r">${r.amount.toFixed(2)} ${r.currency}</td>
            <td>${escapeHtml(r.payment_type||'')}</td><td style="font-family:'DM Mono',monospace;font-size:11px">${escapeHtml(r.invoice_number||'—')}</td>
            <td><span class="chip chip-normal">new</span></td>
          </tr>`).join('')}
          ${newRows.length > 40 ? `<tr><td colspan="9" style="text-align:center;color:var(--muted);font-style:italic">… and ${newRows.length - 40} more rows to import</td></tr>` : ''}
        </tbody>
      </table>
    </div>

    <div class="btn-row" style="margin-top:16px">
      <button class="btn" onclick="commitExcelImport()" ${newRows.length ? '' : 'disabled'}>Import ${newRows.length} new row(s)</button>
      <button class="btn btn-ghost" onclick="$('excelPreview').innerHTML=''">Cancel</button>
    </div>
    <div class="hint" style="margin-top:8px">Non-EUR rows are skipped in this pass — add them manually via the Despesas HQ form so you can set the FX rate correctly.</div>
  `;
}

function sigKey(r){
  const num = String(r.invoice_number||'').trim().toLowerCase();
  const co  = String(r.company||'').trim().toLowerCase();
  const amt = Number(r.amount||0).toFixed(2);
  const dt  = String(r.invoice_date||'').trim();
  return `${num}|${amt}|${co}|${dt}`;
}

function mapPaymentType(raw){
  const s = String(raw||'').trim().toLowerCase();
  if (s.includes('bank') || s.includes('transfer')) return 'Bank Transfer';
  if (s.includes('card')) return 'Card';
  if (s.includes('cash')) return 'Cash';
  return 'Other';
}

async function commitExcelImport(){
  const rows = window.__excelImportBuffer || [];
  if (!rows.length) { toast('excelToast','err','Nothing to import — run Preview first'); return; }

  // Strip internal preview keys, add created_by, batch insert.
  const clean = rows.map(r => {
    const { _row, _errors, ...rest } = r;
    return { ...rest, created_by: CURRENT_USER?.id || null };
  });

  const BATCH = 100;
  let inserted = 0;
  for (let i = 0; i < clean.length; i += BATCH) {
    const chunk = clean.slice(i, i + BATCH);
    const { error } = await sb.from('hq_invoices').insert(chunk);
    if (error) {
      toast('excelToast','err',`Failed at row batch ${i}-${i+chunk.length}: ${error.message}`);
      return;
    }
    inserted += chunk.length;
  }
  window.__excelImportBuffer = [];
  toast('excelToast','ok',`Imported ${inserted} row(s)`);
  $('excelPreview').innerHTML = `<div class="toast toast-ok" style="margin-top:12px">Import complete · ${inserted} row(s) added to Despesas HQ.</div>`;
  renderInvoiceList();
  renderOverview();
}

// Booking revenue helper — reads directly from the `bookings` table populated
// by the hub-level CSV import. Maps location NAMES (e.g. "Morocco") to slugs
// via LOCATIONS. Uses net_amount (gross − partner commission) so the number
// represents what the camp actually receives.
function locNameToSlug(name){
  const s = String(name||'').trim().toLowerCase();
  if (!s) return null;
  // First check LOCATIONS from Supabase (canonical).
  const hit = LOCATIONS.find(l => String(l.name||'').toLowerCase() === s || String(l.slug||'').toLowerCase() === s);
  if (hit) return hit.slug;
  // Fallback: known aliases from the CSV import.
  const alias = { 'morocco':'morocco','portugal':'portugal','surf school':'surf-school','sri lanka':'sri-lanka','junior camp':'junior-camp' };
  return alias[s] || null;
}

async function populatePeriods(){
  const data = await fetchAllPaged(() => sb.from('bookings').select('month_key').order('check_in_on',{ascending:false}));
  const periods = Array.from(new Set(data.map(r => r.month_key))).filter(Boolean);
  if (!periods.length) periods.push(currentMonth());
  const sel = $('periodSelect');
  if (sel) sel.innerHTML = periods.map(p => `<option value="${p}">${p}</option>`).join('') + `<option value="__all__">All-time</option>`;
}

function currentMonth(){
  const d = new Date();
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`;
}

async function renderProfit(){
  const period = $('periodSelect')?.value || currentMonth();
  const isAll  = period === '__all__';
  $('profitBody').innerHTML = `<div class="loading">Loading…</div>`;

  // Bookings from the hub-level import: one row per reservation.
  // net_amount = gross − partner commission (what the camp actually receives).
  // Paginated because Supabase caps .select() at 1000 rows per request.
  const [bkRows, lgRows, hqRows] = await Promise.all([
    fetchAllPaged(() => {
      let q = sb.from('bookings').select('location, month_key, total, net_amount, pax').order('check_in_on',{ascending:true});
      if (!isAll) q = q.eq('month_key', period);
      return q;
    }),
    fetchAllPaged(() => sb.from('ledger_entries').select('type, amount_eur, entry_date, business_area, category, paid_from, attributed_location, location_id').order('entry_date',{ascending:false})),
    fetchAllPaged(() => sb.from('hq_invoices').select('location_slug, amount_eur, invoice_date, category_id').order('invoice_date',{ascending:false}))
  ]);

  const inPeriod = (d) => isAll || String(d||'').slice(0,7) === period;
  const personalCatIds = new Set(CATEGORIES.filter(c => c.is_personal).map(c => c.id));

  const locIdToSlug = new Map(LOCATIONS.map(l => [l.id, l.slug]));
  const attribOf = (r) => {
    if (r.attributed_location) return r.attributed_location;
    return locIdToSlug.get(r.location_id) || 'unknown';
  };

  const byLoc = {};
  const ensureLoc = (key) => { if (!byLoc[key]) byLoc[key] = {slug:key, blRev:0, blCount:0, blPax:0, localRev:0, expenses:0, hqExpenses:0}; return byLoc[key]; };
  HQ_LOCATIONS.forEach(l => ensureLoc(l.slug));

  (bkRows||[]).forEach(r => {
    const slug = locNameToSlug(r.location);
    if (!slug) return;
    const row = ensureLoc(slug);
    // Prefer net_amount when populated; otherwise use total (older rows).
    row.blRev += Number(r.net_amount ?? r.total ?? 0);
    row.blCount += 1;
    row.blPax += Number(r.pax || 0);
  });
  (lgRows||[]).forEach(r => {
    if (!inPeriod(r.entry_date)) return;
    const key = attribOf(r);
    const row = ensureLoc(key);
    const amt = Number(r.amount_eur||0);
    if (r.type === 'revenue') row.localRev += amt;
    else if (r.type === 'expense') row.expenses += amt;
  });
  (hqRows||[]).forEach(r => {
    if (!inPeriod(r.invoice_date)) return;
    if (personalCatIds.has(r.category_id)) return;
    const key = r.location_slug || 'general';
    ensureLoc(key).hqExpenses += Number(r.amount_eur||0);
  });

  const rows = Object.values(byLoc).map(r => ({
    ...r,
    label: locLabel(r.slug),
    totalRev: r.blRev + r.localRev,
    totalExp: r.expenses + r.hqExpenses,
    profit: r.blRev + r.localRev - r.expenses - r.hqExpenses
  }));
  rows.sort((a,b) => {
    if (a.slug === 'general') return 1;
    if (b.slug === 'general') return -1;
    return Math.abs(b.profit) - Math.abs(a.profit);
  });

  const totBl = rows.reduce((s,r)=>s+r.blRev,0);
  const totLR = rows.reduce((s,r)=>s+r.localRev,0);
  const totLE = rows.reduce((s,r)=>s+r.expenses,0);
  const totHE = rows.reduce((s,r)=>s+r.hqExpenses,0);
  const totPF = totBl + totLR - totLE - totHE;

  $('profitBody').innerHTML = `
    <div style="overflow-x:auto"><table>
      <thead><tr>
        <th>Location</th>
        <th class="r">Bookinglayer</th>
        <th class="r">On-site rev</th>
        <th class="r">Local expenses</th>
        <th class="r">HQ invoices</th>
        <th class="r">Profit</th>
      </tr></thead>
      <tbody>
        ${rows.map(r => `<tr>
          <td class="loc-name">${r.label}</td>
          <td class="r">${eur(r.blRev)}</td>
          <td class="r">${eur(r.localRev)}</td>
          <td class="r">${eur(r.expenses)}</td>
          <td class="r">${eur(r.hqExpenses)}</td>
          <td class="r ${r.profit>0?'pos':r.profit<0?'neg':'zero'}">${r.profit>=0?'+':''}${eur(r.profit)}</td>
        </tr>`).join('')}
        <tr style="background:var(--foam);font-weight:700">
          <td class="loc-name">Total</td>
          <td class="r">${eur(totBl)}</td>
          <td class="r">${eur(totLR)}</td>
          <td class="r">${eur(totLE)}</td>
          <td class="r">${eur(totHE)}</td>
          <td class="r ${totPF>0?'pos':totPF<0?'neg':'zero'}">${totPF>=0?'+':''}${eur(totPF)}</td>
        </tr>
      </tbody>
    </table></div>
    <div class="hint" style="margin-top:14px">
      <b>Profit</b> = Bookings (net of partner commission) + on-site revenue − local ledger expenses − HQ invoices attributed to this location.
      <br><b>Bookings</b> comes from the <code>bookings</code> table populated by the hub CSV import — no separate import here. <b>net_amount</b> is used when available (gross − commission), falling back to <b>total</b> for older rows.
      <br><b>HQ invoices</b> come from Despesas HQ. Rows in category <b>Miguel — Personal</b> are excluded.
      <br>Local expenses use <code>attributed_location</code> when set — otherwise fall back to the row's own location.
    </div>
  `;
}
