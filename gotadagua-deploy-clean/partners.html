<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partners — Gota d'Água</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js"></script>
<style>
:root{
  --navy:#28394b;--ocean:#1e6fa8;--ocean-light:#3b9dd4;--ocean-soft:#dcecf8;
  --foam:#edf5fb;--bg:#f0f5fa;--card:#fff;--ink:#0d1b2a;--muted:#6b8099;
  --border:#d4e3f0;--green:#15803d;--green-bg:#ecfdf3;--green-border:#b9efd0;
  --red:#b91c1c;--red-bg:#fef2f2;--amber:#9a6f00;--amber-bg:#fef9e7;
  --shadow:0 2px 16px rgba(40,57,75,.08);--shadow-lg:0 12px 40px rgba(40,57,75,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:'Outfit',sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 20px;height:56px;background:rgba(40,57,75,.97);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.07);box-shadow:0 2px 16px rgba(0,0,0,.22)}
.tb-left{display:flex;align-items:center;gap:12px}
.tb-logo{display:flex;align-items:center;gap:8px;border:none;background:none;cursor:pointer;padding:0;color:inherit;text-decoration:none}
.tb-logo svg{height:26px;width:auto}
.tb-sub{font-size:9px;color:#7aabcc;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.ghost-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;transition:all .18s}
.ghost-btn:hover{background:rgba(255,255,255,.16)}
.container{max-width:1280px;margin:0 auto;padding:24px 20px 48px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.section-title{font-family:'DM Serif Display',serif;font-size:26px;color:var(--navy)}
.section-sub{font-size:13px;color:var(--muted);margin-top:3px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px}
.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin-bottom:8px}
.kpi-value{font-family:'DM Serif Display',serif;font-size:28px;color:var(--navy)}
.kpi-value.green{color:var(--green)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:20px;margin-bottom:20px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.card-title{font-family:'DM Serif Display',serif;font-size:18px;color:var(--navy)}
.data-table{width:100%;border-collapse:collapse}
.data-table th{background:var(--bg);padding:10px 14px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;border-bottom:1px solid var(--border)}
.data-table td{padding:11px 14px;font-size:13px;border-bottom:1px solid rgba(212,227,240,.5);vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:var(--foam)}
.mono{font-family:'DM Mono',monospace;font-size:12px}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700}
.badge.green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.badge.red{background:var(--red-bg);color:var(--red);border:1px solid #fca5a5}
.badge.amber{background:var(--amber-bg);color:var(--amber);border:1px solid #f0d060}
.badge.blue{background:var(--ocean-soft);color:var(--ocean);border:1px solid #bfdcf2}
.badge.muted{background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.btn{border:none;border-radius:9px;padding:9px 16px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif;transition:all .18s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--ocean);color:#fff}.btn-primary:hover{background:var(--ocean-light)}
.btn-secondary{background:#fff;color:var(--muted);border:1.5px solid var(--border)}.btn-secondary:hover{border-color:var(--navy);color:var(--navy)}
.btn-danger{background:var(--red-bg);color:var(--red);border:1.5px solid #fca5a5}.btn-danger:hover{background:#fee2e2}
.btn-sm{padding:6px 11px;font-size:11px;border-radius:7px}
.field{margin-bottom:12px}
.field label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--border);border-radius:9px;padding:8px 12px;font-size:13px;font-family:'Outfit',sans-serif;color:var(--ink);outline:none;background:#fff;transition:border-color .18s}
.field input:focus,.field select:focus{border-color:var(--ocean)}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.overlay{display:none;position:fixed;inset:0;background:rgba(20,30,45,.6);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:560px;box-shadow:var(--shadow-lg);animation:mIn .22s cubic-bezier(.34,1.56,.64,1);overflow:hidden;max-height:92vh;overflow-y:auto}
@keyframes mIn{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:scale(1)}}
.modal-head{background:var(--navy);padding:16px 20px 14px}
.modal-title{font-family:'DM Serif Display',serif;font-size:19px;color:#fff}
.modal-body{padding:18px 20px}
.modal-foot{padding:0 20px 18px;display:flex;justify-content:flex-end;gap:8px}
.month-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.month-cell{padding:6px 4px;border-radius:8px;border:1.5px solid var(--border);background:#fff;font-size:10px;font-weight:700;text-align:center;cursor:pointer;transition:all .16s}
.month-cell:hover{border-color:var(--ocean)}
.month-cell.paid{background:var(--green-bg);color:var(--green);border-color:var(--green-border)}
.month-cell.pending{background:var(--amber-bg);color:var(--amber);border-color:#f0d060}
.month-cell.none{color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filter-pill{padding:6px 13px;border-radius:20px;border:1.5px solid var(--border);background:#fff;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif;transition:all .18s}
.filter-pill:hover{border-color:var(--ocean);color:var(--ocean)}
.filter-pill.active{background:var(--navy);color:#fff;border-color:var(--navy)}
#toast{position:fixed;bottom:18px;right:18px;z-index:999;background:var(--navy);color:#fff;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:700;box-shadow:var(--shadow-lg);display:none;max-width:300px}
#toast.show{display:block}
#loadingOverlay{position:fixed;inset:0;background:rgba(240,245,250,.92);backdrop-filter:blur(6px);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--ocean);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;color:var(--muted);text-align:center;gap:10px}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
@media(max-width:900px){.kpi-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.kpi-grid{grid-template-columns:1fr};.form-row{grid-template-columns:1fr};.month-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="loadingOverlay">
  <div class="spinner"></div>
  <div style="font-size:13px;color:var(--muted);font-weight:600">Loading Partners…</div>
</div>

<div class="topbar">
  <div class="tb-left">
    <button class="tb-logo" onclick="window.location.href='/'">
      <svg viewBox="0 0 197.4 91" xmlns="http://www.w3.org/2000/svg">
        <path fill="#fff4d5" d="M61.7,51.9c-.4-9-5.5-16.5-9.7-24.1-2.9-4.8-5.3-9.8-9.3-13.9-3.9-4.4-6.5-9.8-10.8-13.9C19.2,16.6-.5,39.9,0,61.9c9.4-7.9,20.1-17.7,33.1-17.8,3,0,7.2,0,9.5,2.2,1.7,1.7,3.2,4.2,2,6.5-.3.5-1.9,2.7-2.3,2.9-12.9,7.4-20.3,18.6-16.5,33.7,3.1,1.3,8,1,11.1-.3,2.7-.3,5.1-1.3,7.5-2.5,8.7-2.9,14.5-11.1,15.5-20.1,1.2-4.7,2.1-9.7,1.8-14.6z"/>
        <path fill="#fff4d5" d="M69.7,90.6l-.3-1.9c-.7-5.9-.5-11.9-.4-17.9,0-6.7-.3-13.7,0-20.3v-2.3c.5,0,1.1,0,1.7,0,3.3-.3,6.9-.3,10.2,0,.7,0,1.7,0,2.4,0,1.5.3,4,2.2,5,3.3,2.2,2.7,4.9,8.2,5.5,11.7,1.1,7.7-1.8,18.8-6.7,24.8-.4.5-1.4,1.9-1.7,2.1-.2,0-1.5.4-1.9.4-3.3.5-13.7,0-13.7,0z"/>
      </svg>
      <div class="tb-sub">Partners</div>
    </button>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <span style="font-size:12px;color:#c8d8e6;font-weight:600" id="userNameEl"></span>
    <button class="ghost-btn" onclick="window.location.href='/'">← Hub</button>
  </div>
</div>

<div class="container">
  <div class="section-head">
    <div>
      <div class="section-title">Partner Tracker</div>
      <div class="section-sub">Commissions, bookings and monthly payment status</div>
    </div>
    <button class="btn btn-primary" onclick="openPartnerModal()">+ Add partner</button>
  </div>

  <!-- KPIs -->
  <div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-label">Active partners</div><div class="kpi-value" id="kpiPartners">—</div></div>
    <div class="kpi-card"><div class="kpi-label">Bookings this month</div><div class="kpi-value" id="kpiBookings">—</div></div>
    <div class="kpi-card"><div class="kpi-label">Commission this month</div><div class="kpi-value" id="kpiCommission">—</div></div>
    <div class="kpi-card"><div class="kpi-label">Net this month</div><div class="kpi-value green" id="kpiNet">—</div></div>
  </div>

  <!-- Filters -->
  <div class="filters">
    <button class="filter-pill active" data-pf="all" onclick="setPartnerFilter('all',this)">All partners</button>
    <button class="filter-pill" data-pf="active" onclick="setPartnerFilter('active',this)">Active only</button>
    <select id="monthFilter" onchange="loadAll()" style="border:1.5px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;font-family:'Outfit',sans-serif;background:#fff;color:var(--ink);outline:none;cursor:pointer"></select>
  </div>

  <!-- Partners list -->
  <div id="partnersList"></div>

  <!-- Bookings -->
  <div class="card" style="margin-top:24px">
    <div class="card-head">
      <div class="card-title">Bookings</div>
      <button class="btn btn-secondary btn-sm" onclick="openBookingModal()">+ Add booking</button>
    </div>
    <div id="bookingsTableWrap"></div>
  </div>
</div>

<!-- PARTNER MODAL -->
<div class="overlay" id="partnerModal">
  <div class="modal">
    <div class="modal-head"><div class="modal-title" id="partnerModalTitle">Add partner</div></div>
    <div class="modal-body">
      <div class="form-row">
        <div class="field"><label>Partner name</label><input type="text" id="pName" placeholder="LaPoint, Surf & Yoga, …"></div>
        <div class="field"><label>Email</label><input type="email" id="pEmail" placeholder="partner@example.com"></div>
      </div>
      <div class="form-row">
        <div class="field"><label>Commission %</label><input type="number" id="pCommission" min="0" max="100" step="0.5" placeholder="15"></div>
        <div class="field"><label>Type</label>
          <select id="pType">
            <option value="surfcamp">Surf Camp</option>
            <option value="agency">Agency</option>
            <option value="influencer">Influencer</option>
            <option value="direct">Direct</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--ink)">
          <input type="checkbox" id="pCollects" style="width:auto;border:none;padding:0"> Guest pays commission directly to partner
        </label>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeModal('partnerModal')">Cancel</button>
      <button class="btn btn-primary" onclick="savePartner()">Save partner</button>
    </div>
  </div>
</div>

<!-- BOOKING MODAL -->
<div class="overlay" id="bookingModal">
  <div class="modal" style="max-width:600px">
    <div class="modal-head"><div class="modal-title" id="bookingModalTitle">Add booking</div></div>
    <div class="modal-body">
      <div class="form-row">
        <div class="field"><label>Booking ref</label><input type="text" id="bRef" placeholder="BL-12345"></div>
        <div class="field"><label>Guest name</label><input type="text" id="bBooker" placeholder="Anna Schmidt"></div>
      </div>
      <div class="form-row">
        <div class="field"><label>Check-in</label><input type="date" id="bCheckIn"></div>
        <div class="field"><label>Pax</label><input type="number" id="bPax" min="1" value="1"></div>
      </div>
      <div class="form-row">
        <div class="field"><label>Total (€)</label><input type="number" id="bTotal" min="0" step="0.01" placeholder="0.00"></div>
        <div class="field"><label>Partner</label>
          <select id="bPartner">
            <option value="">— Direct booking —</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="field"><label>Location</label><input type="text" id="bLocation" placeholder="Sri Lanka" value="Sri Lanka"></div>
        <div class="field"><label>Package</label><input type="text" id="bPackage" placeholder="7 nights surf"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeModal('bookingModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveBooking()">Save booking</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
let SB = null;
let partnerFilter = 'all';
let allPartners = [];
let editPartnerId = null;
let editBookingId = null;

function getSB(){
  if(SB) return SB;
  const cfg = window.__SUPABASE_CONFIG;
  SB = window.supabase.createClient(cfg.url, cfg.anonKey);
  return SB;
}

const eur = n => new Intl.NumberFormat('en-GB',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(n||0));
const fmtDate = d => d ? new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '—';
const isoToday = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function toast(msg,dur=2400){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),dur);}
function closeModal(id){document.getElementById(id).classList.remove('open')}
function openModal(id){document.getElementById(id).classList.add('open')}
document.querySelectorAll('.overlay').forEach(el=>{el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('open')})});

function buildMonthOptions(){
  const sel = document.getElementById('monthFilter');
  const now = new Date();
  const months = [];
  for(let i=0;i<18;i++){
    const d = new Date(now.getFullYear(),now.getMonth()-i,1);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    months.push({key, label: d.toLocaleDateString('en-GB',{month:'long',year:'numeric'})});
  }
  sel.innerHTML = months.map(m=>`<option value="${m.key}">${m.label}</option>`).join('');
}

function monthRange(k){
  const [y,m]=k.split('-').map(Number);
  return {start:`${y}-${String(m).padStart(2,'0')}-01`,end:new Date(y,m,0).toISOString().slice(0,10)};
}

function setPartnerFilter(f,btn){
  partnerFilter=f;
  document.querySelectorAll('[data-pf]').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderPartners();
}

async function loadAll(){
  await Promise.all([loadPartners(), loadBookings()]);
}

async function loadPartners(){
  try{
    const sb = getSB();
    const monthKey = document.getElementById('monthFilter').value;
    const {start,end} = monthRange(monthKey);

    const [pRes, statusRes] = await Promise.all([
      sb.from('partners').select('*').order('name',{ascending:true}),
      sb.from('partner_month_status').select('*').eq('month_key',monthKey)
    ]);
    if(pRes.error) throw pRes.error;
    allPartners = pRes.data || [];
    const statusMap = {};
    (statusRes.data||[]).forEach(s=>{statusMap[s.partner_id]=s});

    // KPIs from bookings
    const {data:bData} = await sb.from('bookings').select('total,commission_amount,net_amount,partner_id').gte('check_in_on',start).lte('check_in_on',end);
    const bookings = bData||[];
    const monthBookings = bookings.length;
    const monthCommission = bookings.reduce((s,b)=>s+Number(b.commission_amount||0),0);
    const monthNet = bookings.reduce((s,b)=>s+Number(b.net_amount||0),0);
    document.getElementById('kpiPartners').textContent = allPartners.filter(p=>p.is_active).length;
    document.getElementById('kpiBookings').textContent = monthBookings;
    document.getElementById('kpiCommission').textContent = eur(monthCommission);
    document.getElementById('kpiNet').textContent = eur(monthNet);

    // Attach status and booking counts to partners
    const bookingsByPartner = {};
    bookings.forEach(b=>{ if(b.partner_id) bookingsByPartner[b.partner_id]=(bookingsByPartner[b.partner_id]||0)+1; });
    allPartners = allPartners.map(p=>({
      ...p,
      monthStatus: statusMap[p.id]?.status||'',
      monthNotes: statusMap[p.id]?.notes||'',
      monthBookings: bookingsByPartner[p.id]||0
    }));

    renderPartners();
  } catch(e){
    console.error(e);
    toast('Error loading partners: '+e.message);
  }
}

function renderPartners(){
  const el = document.getElementById('partnersList');
  let list = partnerFilter==='active' ? allPartners.filter(p=>p.is_active) : allPartners;
  if(!list.length){
    el.innerHTML=`<div class="empty-state"><div style="font-size:36px;opacity:.25">🤝</div><div>No partners yet.</div><button class="btn btn-primary" onclick="openPartnerModal()" style="margin-top:12px">+ Add partner</button></div>`;
    return;
  }
  el.innerHTML = list.map(p=>{
    const statusBadge = p.monthStatus==='paid'?'green':p.monthStatus==='pending'?'amber':'muted';
    const statusLabel = p.monthStatus||'No status';
    return `<div class="card" style="margin-bottom:12px">
      <div class="card-head">
        <div>
          <div class="card-title">${esc(p.name)}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:3px">${p.partner_type||'partner'} · ${p.commission_pct||0}% commission · ${p.monthBookings} booking${p.monthBookings!==1?'s':''} this month</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap">
          <span class="badge ${statusBadge}">${statusLabel}</span>
          <select onchange="updatePartnerStatus('${p.id}',this.value)" style="border:1.5px solid var(--border);border-radius:8px;padding:5px 8px;font-size:11px;font-family:'Outfit',sans-serif;background:#fff;color:var(--ink);outline:none;cursor:pointer">
            <option value="" ${!p.monthStatus?'selected':''}>Set status…</option>
            <option value="paid" ${p.monthStatus==='paid'?'selected':''}>Paid</option>
            <option value="pending" ${p.monthStatus==='pending'?'selected':''}>Pending</option>
            <option value="invoiced" ${p.monthStatus==='invoiced'?'selected':''}>Invoiced</option>
            <option value="na" ${p.monthStatus==='na'?'selected':''}>N/A</option>
          </select>
          <button class="btn btn-secondary btn-sm" onclick="editPartner('${p.id}')">Edit</button>
          ${p.is_active?`<button class="btn btn-danger btn-sm" onclick="deactivatePartner('${p.id}')">Deactivate</button>`:`<button class="btn btn-secondary btn-sm" onclick="reactivatePartner('${p.id}')">Reactivate</button>`}
        </div>
      </div>
    </div>`;
  }).join('');
}

async function updatePartnerStatus(partnerId, status){
  try{
    const monthKey = document.getElementById('monthFilter').value;
    const { error } = await getSB().rpc('upsert_partner_month_status',{p_partner_name: allPartners.find(p=>p.id===partnerId)?.name, p_month_key:monthKey, p_status:status, p_notes:null});
    if(error) throw error;
    toast('Status updated');
    await loadPartners();
  } catch(e){ toast('Error: '+e.message); }
}

function openPartnerModal(data=null){
  editPartnerId = data?.id||null;
  document.getElementById('partnerModalTitle').textContent = data ? 'Edit partner' : 'Add partner';
  document.getElementById('pName').value = data?.name||'';
  document.getElementById('pEmail').value = data?.email||'';
  document.getElementById('pCommission').value = data?.commission_pct||'';
  document.getElementById('pType').value = data?.partner_type||'surfcamp';
  document.getElementById('pCollects').checked = data?.collects_from_guest||false;
  openModal('partnerModal');
}

async function editPartner(id){
  const p = allPartners.find(x=>x.id===id);
  if(p) openPartnerModal(p);
}

async function savePartner(){
  try{
    const name = document.getElementById('pName').value.trim();
    const email = document.getElementById('pEmail').value.trim()||null;
    const commission_pct = parseFloat(document.getElementById('pCommission').value)||0;
    const partner_type = document.getElementById('pType').value;
    const collects_from_guest = document.getElementById('pCollects').checked;
    if(!name){ toast('Name is required'); return; }
    const payload = {name,email,commission_pct,partner_type,collects_from_guest,is_active:true};
    const sb = getSB();
    if(editPartnerId){
      const {error} = await sb.from('partners').update({...payload,updated_at:new Date().toISOString()}).eq('id',editPartnerId);
      if(error) throw error;
      toast('Partner updated');
    } else {
      const {error} = await sb.from('partners').insert(payload);
      if(error) throw error;
      toast('Partner added');
    }
    closeModal('partnerModal');
    await loadAll();
  } catch(e){ toast('Error: '+e.message); }
}

async function deactivatePartner(id){
  if(!confirm('Deactivate this partner?')) return;
  try{
    const {error} = await getSB().from('partners').update({is_active:false,updated_at:new Date().toISOString()}).eq('id',id);
    if(error) throw error;
    toast('Partner deactivated');
    await loadPartners();
  } catch(e){ toast('Error: '+e.message); }
}

async function reactivatePartner(id){
  try{
    const {error} = await getSB().from('partners').update({is_active:true,updated_at:new Date().toISOString()}).eq('id',id);
    if(error) throw error;
    toast('Partner reactivated');
    await loadPartners();
  } catch(e){ toast('Error: '+e.message); }
}

async function loadBookings(){
  try{
    const monthKey = document.getElementById('monthFilter').value;
    const {start,end} = monthRange(monthKey);
    const {data,error} = await getSB().from('bookings').select('*').gte('check_in_on',start).lte('check_in_on',end).order('check_in_on',{ascending:false});
    if(error) throw error;
    const bookings = data||[];
    const wrap = document.getElementById('bookingsTableWrap');
    if(!bookings.length){
      wrap.innerHTML=`<div class="empty-state"><div style="font-size:32px;opacity:.25">📋</div><div>No bookings this month.</div></div>`;
      return;
    }
    const rows = bookings.map(b=>`<tr>
      <td class="mono" style="font-size:11px">${esc(b.booking_ref||'—')}</td>
      <td style="font-weight:600">${esc(b.booker||'—')}</td>
      <td class="mono" style="font-size:11px">${b.check_in_on?new Date(b.check_in_on+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'-'}</td>
      <td>${b.pax||1} pax</td>
      <td style="font-size:12px;color:var(--muted)">${esc(b.partner_name||'Direct')}</td>
      <td class="mono">${eur(b.total)}</td>
      <td class="mono" style="color:var(--red)">${eur(b.commission_amount)}</td>
      <td class="mono" style="color:var(--green)">${eur(b.net_amount)}</td>
      <td style="text-align:right">
        <button class="btn btn-danger btn-sm" onclick="deleteBooking('${esc(b.id)}')">Del</button>
      </td>
    </tr>`).join('');
    wrap.innerHTML=`<div style="overflow-x:auto"><table class="data-table" style="min-width:700px"><thead><tr><th>Ref</th><th>Guest</th><th>Check-in</th><th>Pax</th><th>Partner</th><th>Total</th><th>Commission</th><th>Net</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
  } catch(e){ toast('Error: '+e.message); }
}

function openBookingModal(){
  editBookingId = null;
  document.getElementById('bookingModalTitle').textContent = 'Add booking';
  document.getElementById('bRef').value='';
  document.getElementById('bBooker').value='';
  document.getElementById('bCheckIn').value=isoToday();
  document.getElementById('bPax').value=1;
  document.getElementById('bTotal').value='';
  document.getElementById('bLocation').value='Sri Lanka';
  document.getElementById('bPackage').value='';
  // Populate partner dropdown
  const sel = document.getElementById('bPartner');
  sel.innerHTML = `<option value="">— Direct booking —</option>`+allPartners.filter(p=>p.is_active).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  openModal('bookingModal');
}

async function saveBooking(){
  try{
    const booking_ref = document.getElementById('bRef').value.trim();
    const booker = document.getElementById('bBooker').value.trim()||null;
    const check_in_on = document.getElementById('bCheckIn').value||null;
    const pax = parseInt(document.getElementById('bPax').value)||1;
    const total = parseFloat(document.getElementById('bTotal').value)||0;
    const partner_id = document.getElementById('bPartner').value||null;
    const location = document.getElementById('bLocation').value.trim()||null;
    const pkg = document.getElementById('bPackage').value.trim()||null;
    if(!booking_ref){ toast('Booking ref is required'); return; }
    const partner = allPartners.find(p=>p.id===partner_id)||null;
    const pct = partner?.commission_pct||0;
    const commission_amount = Math.round(total*(pct/100)*100)/100;
    const net_amount = total - commission_amount;
    const month_key = check_in_on ? check_in_on.slice(0,7) : null;
    const payload = {
      booking_ref, booker, check_in_on, month_key, total, pax,
      location: location||null, package: pkg||null,
      partner_id: partner_id||null, partner_name: partner?.name||null,
      booking_type: partner_id ? 'partner' : 'direct',
      partner_commission_pct: pct, commission_amount, net_amount
    };
    const {error} = await getSB().from('bookings').insert(payload);
    if(error) throw error;
    toast('Booking saved');
    closeModal('bookingModal');
    await loadAll();
  } catch(e){ toast('Error: '+e.message); }
}

async function deleteBooking(id){
  if(!confirm('Delete this booking?')) return;
  try{
    const {error} = await getSB().from('bookings').delete().eq('id',id);
    if(error) throw error;
    toast('Booking deleted');
    await loadAll();
  } catch(e){ toast('Error: '+e.message); }
}

async function boot(){
  try{
    const sb = getSB();
    const {data:{session}} = await sb.auth.getSession();
    if(!session?.user){ window.location.href='/'; return; }
    document.getElementById('userNameEl').textContent = session.user.email?.split('@')[0]||'';
    buildMonthOptions();
    await loadAll();
  } catch(e){
    toast('Error: '+e.message);
  } finally {
    document.getElementById('loadingOverlay').style.display='none';
  }
}
boot();
</script>
