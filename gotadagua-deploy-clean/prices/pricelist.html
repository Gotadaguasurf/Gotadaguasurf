<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Price list — Gota Dagua</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-15 0 92 92'><path fill='%231e6fa8' d='M61.7,51.9c-.4-9-5.5-16.5-9.7-24.1-2.9-4.8-5.3-9.8-9.3-13.9-3.9-4.4-6.5-9.8-10.8-13.9C19.2,16.6-.5,39.9,0,61.9c9.4-7.9,20.1-17.7,33.1-17.8,3,0,7.2,0,9.5,2.2,1.7,1.7,3.2,4.2,2,6.5-.3.5-1.9,2.7-2.3,2.9-12.9,7.4-20.3,18.6-16.5,33.7,3.1,1.3,8,1,11.1-.3,2.7-.3,5.1-1.3,7.5-2.5,8.7-2.9,14.5-11.1,15.5-20.1,1.2-4.7,2.1-9.7,1.8-14.6h0Z'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="preload" href="/assets/fonts/Frastha-Bold.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="/assets/fonts/LondrinaSolid-Regular.ttf" as="font" type="font/ttf" crossorigin>
<script src="/lib/supabase.min.js?v=6" onerror="window.__SUPABASE_SDK_FAILED=true"></script>
<script src="/supabase-config.js?v=6" onerror="window.__SUPABASE_CFG_FAILED=true"></script>
<script src="/owner-config.js"></script>
<script src="/lib/app-shell.js"></script>
<script src="/lib/price-list.js"></script>
<link rel="stylesheet" href="/lib/app-shell.css">
<style>
/* The price list (17 Nov 2026) — a MARKETING document, styled like gotadaguasurf.com, not like the app:
   paper backgrounds, Frastha serif titles, Londrina Solid camp names and buttons, Inter text, sun-yellow «Book now»,
   rounded photo cards. Fonts: Frastha + Londrina Solid self-hosted from /assets/fonts (the website's files),
   Inter from Google Fonts. A4 sheets on screen; the same sheets in print → «Save as PDF». */
@font-face{font-family:"Frastha";src:url("/assets/fonts/Frastha-Bold.ttf") format("truetype");font-weight:400 700;font-display:block}
@font-face{font-family:"Londrina";src:url("/assets/fonts/LondrinaSolid-Regular.ttf") format("truetype");font-weight:400;font-display:block}
:root{
  --gd-paper:#fffdee; --gd-card:#fffdf7; --gd-cream:#fbf4dd; --gd-sand:#f6ecca; --gd-line:#e8dcb4; --gd-line-2:#ddd2ad;
  --gd-navy:#27384a; --gd-navy-soft:#46596b; --gd-yellow:#f6d34e; --gd-yellow-soft:#fbe88f; --gd-terra:#b96a3f; --gd-green:#4e7a4e;
  --gd-serif:"Frastha",Georgia,serif; --gd-display:"Londrina","Arial Narrow",sans-serif; --gd-body:"Inter",system-ui,sans-serif;
  --pl-w:210mm; --pl-h:297mm; --pl-mx:16mm;
}
body{background:#e9e3cf;font-family:var(--gd-body);color:var(--gd-navy)}
.pl-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;padding:12px 16px;background:var(--gd-navy);color:#fff}
.pl-bar .grow{flex:1;min-width:0}
.pl-bar-title{font-weight:700;font-size:15px}
.pl-bar-sub{font-size:12.5px;color:#cdd8e2}
.pl-bar .btn-s{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.pl-bar .btn-p{background:var(--gd-yellow);color:var(--gd-navy);border-color:var(--gd-yellow)}
#doc{padding:24px 0 64px;display:flex;flex-direction:column;align-items:center;gap:24px}
#doc .loading{padding:48px;color:var(--gd-navy-soft)}
.pl-error{max-width:560px;margin:48px auto;background:var(--gd-card);border:1px solid var(--gd-line);border-radius:14px;padding:24px;text-align:center}
.pl-running{display:none}

/* ── cover: full-bleed photo, navy shade, cream logo, Londrina title ── */
.pl-cover{position:relative;width:var(--pl-w);max-width:100%;height:var(--pl-h);overflow:hidden;color:#fff;background:var(--gd-navy);box-shadow:0 10px 30px rgba(39,56,74,.25);display:flex;flex-direction:column;z-index:2}
.pl-cover-photos{position:absolute;inset:0;display:grid;grid-template-columns:1fr}
.pl-cover-photos.n2{grid-template-columns:1fr 1fr}
.pl-cover-photos.n3{grid-template-columns:1fr 1fr 1fr}
.pl-cover-photo{background-size:cover;background-position:center}
.pl-cover-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(23,34,46,.55) 0%,rgba(23,34,46,.05) 26%,rgba(23,34,46,.1) 48%,rgba(23,34,46,.82) 78%,rgba(23,34,46,.94) 100%)}
.pl-cover-top{position:relative;display:flex;justify-content:space-between;align-items:center;padding:16mm var(--pl-mx) 0}
.pl-cover-logo svg{width:46mm;height:auto;display:block}
.pl-book{display:inline-block;background:var(--gd-yellow-soft);color:var(--gd-navy);font-family:var(--gd-display);text-transform:uppercase;letter-spacing:.04em;font-size:15px;line-height:1;padding:9px 16px 8px;border-radius:9px;text-decoration:none}
.pl-book.big{font-size:20px;padding:12px 26px 11px;margin:14px 0 18px}
.pl-cover-main{position:relative;margin-top:auto;padding:0 var(--pl-mx)}
.pl-kicker{font-family:var(--gd-serif);font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:#f7eac1}
.pl-cover h1{font-family:var(--gd-display);font-weight:400;font-size:78px;line-height:.86;text-transform:uppercase;letter-spacing:.01em;margin:6px 0 2px;color:#fffdf7}
.pl-place{font-family:var(--gd-display);font-size:22px;text-transform:uppercase;letter-spacing:.04em;color:#fffdf7;opacity:.95}
.pl-cover-tag{font-family:var(--gd-serif);font-size:17px;color:#f7eac1;margin-top:12px;max-width:120mm;line-height:1.35}
.pl-cover-foot{position:relative;padding:8mm var(--pl-mx) 13mm;margin-top:8mm;border-top:1px solid rgba(255,253,238,.22)}
.pl-contact{display:flex;flex-wrap:wrap;gap:4px 20px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.pl-cover .pl-contact{color:#fffdf7}
.pl-generated{font-size:10.5px;color:#cdd8e2;margin-top:5px}

/* ── a camp: paper sheet, website-style photo card as opener ── */
.pl-camp,.pl-end{width:var(--pl-w);max-width:100%;background:var(--gd-paper);padding:14mm var(--pl-mx) 18mm;box-shadow:0 10px 30px rgba(39,56,74,.12);color:var(--gd-navy);position:relative;z-index:1}
.pl-camp-card{position:relative;height:62mm;border-radius:16px;overflow:hidden;background-size:cover;background-position:center 35%;margin-bottom:9mm;break-inside:avoid}
.pl-camp-card::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(23,34,46,.18),rgba(23,34,46,.6))}
.pl-camp-card-in{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fffdf7}
.pl-camp-kicker{font-family:var(--gd-serif);font-size:17px;text-transform:uppercase;letter-spacing:.02em}
.pl-camp-name{font-family:var(--gd-display);font-weight:400;font-size:54px;line-height:.86;text-transform:uppercase;margin:2px 0;color:#fffdf7;letter-spacing:.01em}
.pl-camp-place{font-family:var(--gd-display);font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.pl-camp-from{font-family:var(--gd-serif);font-size:17px;margin-top:8px}
.pl-part{margin-top:9mm}
.pl-part:first-of-type{margin-top:0}
.pl-sec-head{text-align:center;margin-bottom:5mm;break-after:avoid}
.pl-sec-head h2{margin:0;font-family:var(--gd-serif);font-weight:700;font-size:25px;letter-spacing:.02em;text-transform:uppercase;color:var(--gd-navy);line-height:1.1}
.pl-lead{font-family:var(--gd-serif);font-size:16px;color:var(--gd-navy-soft);margin-top:3px}

/* accommodation matrix: rooms × seasons, white card like the website's package cards */
.pl-pack{background:var(--gd-card);border:1px solid var(--gd-line);border-radius:14px;padding:6mm 6mm 4mm;margin-bottom:6mm;break-inside:avoid}
.pl-pack-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pl-pack h3{margin:0;font-family:var(--gd-serif);font-weight:700;font-size:19px;color:var(--gd-navy)}
.pl-basis{font-family:var(--gd-body);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--gd-navy-soft)}
.pl-pack-desc{font-size:11px;color:var(--gd-navy-soft);line-height:1.5;margin:3px 0 4mm}
.pl-table{width:100%;border-collapse:collapse;table-layout:fixed}
.pl-matrix{font-size:12px}
.pl-matrix col.pl-col-occ{width:21mm}
.pl-matrix col.pl-col-season{width:32mm}
.pl-matrix.pl-cols-4 col.pl-col-season{width:27mm}
.pl-matrix.pl-cols-4 .pl-dates{white-space:normal}
.pl-matrix col.pl-col-room{width:auto}
.pl-matrix th{font-weight:500;text-align:right;vertical-align:top;padding:0 0 7px 6px;border-bottom:1.5px solid var(--gd-navy);font-size:10px;color:var(--gd-navy-soft);line-height:1.35}
.pl-matrix th.pl-room-h{text-align:left;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gd-navy-soft);padding-left:0}
.pl-pill{display:inline-block;font-family:var(--gd-display);font-size:13px;line-height:1;text-transform:uppercase;letter-spacing:.04em;border-radius:7px;padding:5px 9px 4px;margin-bottom:4px}
.pl-pill.low{background:#dfeadb;color:var(--gd-green)}
.pl-pill.mid{background:var(--gd-yellow-soft);color:var(--gd-navy)}
.pl-pill.high{background:var(--gd-terra);color:#fffdf7}
.pl-pill.special,.pl-pill.other{background:var(--gd-navy);color:#fffdf7}
.pl-dates{display:block;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:8.5px;letter-spacing:-.01em}
.pl-matrix td{padding:7px 0 7px 6px;border-bottom:1px solid var(--gd-line);vertical-align:top}
.pl-matrix tbody tr:last-child td{border-bottom:0}
.pl-matrix tbody tr{break-inside:avoid}
.pl-room{font-weight:600;color:var(--gd-navy);padding-left:0;line-height:1.3}
.pl-occ{color:var(--gd-navy-soft);font-size:10.5px}
.pl-line{min-height:19px;display:flex;align-items:center}
.pl-cell .pl-line{justify-content:flex-end}
.pl-amt{font-family:var(--gd-body);font-weight:600;font-size:12.5px;color:var(--gd-navy);font-variant-numeric:tabular-nums;white-space:nowrap}
.pl-amt.na{color:#b8ad8a;font-family:var(--gd-body);font-weight:400;font-size:11px}

/* lists: surf, tours, add-ons — dashed rows like a menu, optional photo */
.pl-items{background:var(--gd-card);border:1px solid var(--gd-line);border-radius:14px;padding:3mm 6mm;break-inside:auto}
.pl-items.whole,.pl-part.whole{break-inside:avoid}
.pl-items.with-photo{break-inside:avoid;display:grid;grid-template-columns:1fr 52mm;gap:6mm;align-items:start}
.pl-photo{border-radius:12px;background-size:cover;background-position:center;height:66mm;margin:3mm 0}
.pl-list td{padding:8px 0;border-bottom:1px dashed var(--gd-line-2);vertical-align:top;font-size:12px;line-height:1.35}
.pl-list tr:last-child td{border-bottom:0}
.pl-list tr{break-inside:avoid}
.pl-list col.pl-col-num{width:26mm}
.pl-name{font-weight:600;color:var(--gd-navy)}
.pl-sub{display:block;font-size:10.5px;color:var(--gd-navy-soft);margin-top:2px;line-height:1.4}
.pl-price{font-family:var(--gd-body);font-weight:700;font-size:13px;color:var(--gd-navy);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pl-table td.r{text-align:right}
.pl-transfers{background:var(--gd-card);border:1px solid var(--gd-line);border-radius:14px;border-collapse:separate;border-spacing:0;overflow:hidden;font-size:12px}
.pl-transfers col.pl-col-mid{width:44mm}
.pl-transfers col.pl-col-num{width:30mm}
.pl-transfers th{font-weight:600;font-size:10px;letter-spacing:.06em;text-transform:uppercase;text-align:left;padding:9px 6mm 7px;border-bottom:1.5px solid var(--gd-navy);color:var(--gd-navy)}
.pl-transfers th.r{text-align:right}
.pl-transfers td{padding:7px 6mm;border-bottom:1px dashed var(--gd-line-2)}
.pl-transfers tr:last-child td{border-bottom:0}
.pl-transfers tr.pl-route-row td{font-weight:700;font-size:12px;background:var(--gd-cream);border-bottom:1px solid var(--gd-line)}
.pl-transfers tr.pl-veh td:first-child{padding-left:10mm}
.pl-transfers tbody tr.pl-route-row{break-after:avoid}

/* good to know: check-circle list like the website's «Included» */
.pl-notes{background:var(--gd-cream);border-radius:14px;padding:5mm 6mm;break-inside:avoid;margin-top:2mm}
.pl-notes h3{margin:0 0 6px;font-family:var(--gd-serif);font-weight:700;font-size:18px;margin-bottom:6px}
.pl-notes ul{list-style:none;margin:0;padding:0;font-size:11.5px;line-height:1.5}
.pl-notes li{position:relative;padding-left:20px;margin-bottom:4px}
.pl-notes li::before{content:'';position:absolute;left:0;top:3px;width:11px;height:11px;border:1.4px solid var(--gd-navy);border-radius:50%;background:radial-gradient(circle,var(--gd-navy) 0 2px,transparent 2.5px)}

/* closing call to action */
.pl-end{background:var(--gd-navy);color:#fffdf7;text-align:center;padding:14mm var(--pl-mx)}
.pl-end-logo svg{width:34mm;height:auto;margin:0 auto 6mm;display:block}
.pl-end-title{font-family:var(--gd-serif);font-weight:700;font-size:26px;text-transform:uppercase}
.pl-end p{font-family:var(--gd-serif);font-size:15px;color:#f7eac1;margin-top:4px}
.pl-end .pl-contact{justify-content:center;color:#fffdf7}
.pl-end .pl-generated{color:#aebccb}
.pl-empty{color:var(--gd-navy-soft);font-size:14px}

/* phones: the sheets scale down (the PDF is A4 either way) */
@media screen and (max-width:820px){
  :root{ --pl-w:100%; --pl-mx:18px; }
  #doc{padding:16px 12px 48px}
  .pl-bar-sub{display:none}
  .pl-cover{height:auto;min-height:620px}
  .pl-cover h1{font-size:56px}
  .pl-camp,.pl-end{padding:20px 14px}
  .pl-camp-card{height:200px}
  .pl-camp-name{font-size:42px}
  .pl-pack,.pl-items{padding:12px}
  .pl-items.with-photo{grid-template-columns:1fr}
  .pl-photo{height:180px}
  .pl-table{table-layout:auto}
  .pl-matrix col.pl-col-occ,.pl-matrix col.pl-col-season,.pl-list col.pl-col-num,.pl-transfers col{width:auto}
  .pl-dates{white-space:normal}
  .pl-transfers td,.pl-transfers th{padding-left:10px;padding-right:10px}
  .pl-transfers tr.pl-veh td:first-child{padding-left:16px}
}

/* print: margin 0 so the paper colour runs to the edges; each sheet keeps its padding on every page
   (box-decoration-break), a running line at the foot of every page */
@page{ size:A4; margin:0 }
@media print{
  html,body{background:var(--gd-paper)}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pl-bar{display:none}
  #doc{padding:0;display:block}
  .pl-cover{width:auto;height:297mm;box-shadow:none;break-after:page}
  .pl-camp{width:auto;box-shadow:none;background:transparent;z-index:auto;padding:14mm 16mm 20mm;-webkit-box-decoration-break:clone;box-decoration-break:clone;break-before:page}
  .pl-cover + .pl-camp{break-before:auto}
  .pl-end{width:auto;box-shadow:none;break-inside:avoid;break-before:page;height:297mm;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .pl-running{display:flex;position:fixed;left:16mm;right:16mm;bottom:8mm;align-items:center;justify-content:space-between;gap:8px;font-size:8.5px;color:var(--gd-navy-soft);z-index:1}
  .pl-cover,.pl-end{position:relative;z-index:5}
  .pl-running svg{width:18mm;height:auto}
}
</style>
</head>
<body>
<div class="pl-bar" id="plBar">
  <a class="btn btn-s btn-sm" href="/prices/" id="plBack">Back to prices</a>
  <div class="grow"><div class="pl-bar-title" id="plTitle">Price list</div><div class="pl-bar-sub">In the print window choose «Save as PDF» · paper A4</div></div>
  <button class="btn btn-p" id="plPrint" onclick="window.print()" disabled>Save as PDF</button>
</div>
<main id="doc"><div class="loading">Loading the prices…</div></main>

<script>
// /prices/pricelist.html?location=<slug|all>&period=<upcoming|all|YYYY>&sections=a,b,c&print=1
// Same access rule as /prices: the owner, or an active prices-<camp> membership that can view. Guest prices only
// (no cost column is selected). Nothing is written.
(async function(){
  const q = new URL(location.href).searchParams;
  const loc = (q.get('location') || 'portugal').toLowerCase();
  const period = q.get('period') || 'upcoming';
  const sections = (q.get('sections') || 'accommodation,surf,tours,transfers,addons').split(',').map(s => s.trim()).filter(Boolean);
  const doc = document.getElementById('doc');
  const back = document.getElementById('plBack');
  if (loc !== 'all') back.href = '/prices/?location=' + encodeURIComponent(loc);
  const fail = (title, text) => { doc.innerHTML = `<div class="pl-error"><h2 style="font-size:18px;color:var(--navy);margin-bottom:6px">${AppShell.esc(title)}</h2><p style="color:var(--muted);font-size:13px">${AppShell.esc(text)}</p></div>`; };
  if (window.__SUPABASE_SDK_FAILED || window.__SUPABASE_CFG_FAILED || !window.supabase || !window.__SUPABASE_CONFIG) return fail('Could not load', 'The app files did not load. Refresh the page.');
  const sb = window.supabase.createClient(window.__SUPABASE_CONFIG.url, window.__SUPABASE_CONFIG.anonKey);
  const { data: sess } = await sb.auth.getSession();
  const user = sess && sess.session && sess.session.user;
  if (!user) return fail('Not signed in', 'Sign in on the home page first, then create the price list again.');
  const owners = new Set(window.__PLATFORM_OWNER_EMAILS || ['miguel@gotadaguasurf.com']);
  let slugs = loc === 'all' ? PriceList.CAMP_ORDER.slice() : [loc];
  if (!owners.has(String(user.email || '').toLowerCase())) {
    try {
      const { data: mems } = await sb.from('workspace_memberships').select('can_view, workspaces!inner(slug)').eq('user_id', user.id).eq('active', true).in('workspaces.slug', slugs.map(s => 'prices-' + s));
      const ok = new Set((mems || []).filter(m => m.can_view !== false).map(m => String(m.workspaces && m.workspaces.slug || '').replace(/^prices-/, '')));
      slugs = slugs.filter(s => ok.has(s));
    } catch (_) { slugs = []; }
    if (!slugs.length) return fail('No access', 'You don\'t have access to these prices. Ask Miguel in Settings → Team access.');
  }
  const CAT_COLS = 'id,name,category,sell_price,sell_currency,currency,notes,active,sort_order,capacity,covers_pax,audience';
  async function loadCamp(slug){
    const { data: L } = await sb.from('locations').select('id,slug,name').eq('slug', slug).maybeSingle();
    if (!L) return null;
    let cat = await sb.from('pricing_catalog').select(CAT_COLS).eq('location_id', L.id);
    if (cat.error && /covers_pax/.test(cat.error.message || '')) cat = await sb.from('pricing_catalog').select(CAT_COLS.replace(',covers_pax', '')).eq('location_id', L.id);
    if (cat.error) throw cat.error;
    const [packs, seasons, rooms, prices] = await Promise.all([
      sb.from('accommodation_packs').select('id,label,description,price_basis,sort_order,active').eq('location_id', L.id),
      sb.from('accommodation_seasons').select('id,season_key,label,date_ranges,sort_order,active').eq('location_id', L.id),
      sb.from('accommodation_room_types').select('id,label,description,sort_order,active').eq('location_id', L.id),
      sb.from('accommodation_prices').select('pack_id,season_id,room_type_id,occupancy,sell_price,currency').eq('location_id', L.id),
    ]);
    const accErr = [packs, seasons, rooms, prices].map(r => r.error).find(Boolean);
    if (accErr && !/does not exist/i.test(accErr.message || '')) throw accErr;   // never a price list silently without rooms
    return { slug, label: PriceList.CAMP_LABEL[slug] || L.name, catalog: cat.data || [],
      accom: { packs: packs.data || [], seasons: seasons.data || [], rooms: rooms.data || [], prices: prices.data || [] } };
  }
  let camps;
  try { camps = (await Promise.all(slugs.map(loadCamp))).filter(Boolean); }
  catch (err) { console.error('[Price list] load failed', err); return fail("Couldn't load the prices", 'Check the connection and try again. (' + (err && err.message || err) + ')'); }
  const model = PriceList.buildModel({ camps, period, sections });
  window.__priceListModel = model;
  document.title = model.fileTitle;   // the PDF's file name
  document.getElementById('plTitle').textContent = `Price list · ${model.title} · ${model.period}`;
  doc.innerHTML = PriceList.render(model, { logo: AppShell.LOGO });
  document.getElementById('plPrint').disabled = false;
  try { await document.fonts.ready; } catch (_) {}
  // the photos are CSS backgrounds: wait for them (max 6 s) so the print never catches a blank card
  const urls = [...new Set([...doc.querySelectorAll('[style*="background-image"]')].map(e => (/url\(['"]?([^'")]+)/.exec(e.getAttribute('style')) || [])[1]).filter(Boolean))];
  await Promise.race([Promise.all(urls.map(u => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = u; }))), new Promise(r => setTimeout(r, 6000))]);
  window.__priceListReady = true;
  if (q.get('print') === '1') setTimeout(() => window.print(), 350);
})().catch(err => {
  console.error('[Price list] failed', err);
